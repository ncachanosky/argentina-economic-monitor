# Manual helper: download a source file on GitHub's network and push it to
# the `inspect` branch, to inspect files the development sandbox cannot reach.
name: Fetch a source file
on:
  workflow_dispatch:
    inputs:
      url:
        description: File URL
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - name: Download and push to the inspect branch
        run: |
          git init -q work && cd work
          git config user.name "aem-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b inspect
          curl -sSL --retry 3 -A "argentina-economic-monitor" -o "$(basename "${{ inputs.url }}")" "${{ inputs.url }}"
          ls -la
          git add -A && git commit -q -m "inspect: $(basename "${{ inputs.url }}")"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" inspect
