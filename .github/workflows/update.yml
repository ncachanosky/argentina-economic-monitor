name: Update data and deploy

# Daily: fetch every registry series, validate, record new vintages,
# commit any changes, then build and publish the site to GitHub Pages.
on:
  schedule:
    # 10:30 UTC = 07:30 Buenos Aires. INDEC releases at 16:00 local, so a
    # second run picks up same-day releases.
    - cron: "30 10 * * *"
    - cron: "30 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", "registry/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Test
        run: python -m pytest -q

      - name: Fetch, validate, store
        # Also runs on pushes, so newly registered series appear right away.
        run: python -m pipeline.update

      - name: Commit new data
        run: |
          git config user.name "aem-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: update $(date -u +%Y-%m-%d)"
            # Someone may have pushed code meanwhile: rebase the data commit on top.
            for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
          fi

      - name: Fonts for preview images
        # Carlito (metric-compatible with Calibri, the EO font); falls back to DejaVu if unavailable.
        run: sudo apt-get install -y -qq fonts-crosextra-carlito >/dev/null 2>&1 || true

      - name: Build site
        # One page per topic; the tag cache-busts CSS/JS so browsers never
        # pair new data with stale code.
        run: python -m pipeline.build --out _site --tag "${GITHUB_SHA::8}-$(date -u +%Y%m%d%H%M)"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
