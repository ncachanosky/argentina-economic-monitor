  footer: |2
          <div>
            <h4>Acerca del Monitor</h4>
            <p>El Monitor de la Economía Argentina es un proyecto de <a id="eo-link" href="#">Economic Order</a>, de Nicolás Cachanosky. Los datos se descargan automáticamente de sus fuentes dos veces por día, se validan y se guardan con todo su historial de revisiones.</p>
            <p>Fuentes: INDEC, el BCRA, el Ministerio de Economía y otros organismos oficiales; cotizaciones de mercado de servicios de datos de mercado, señaladas como no oficiales. Los gráficos y las transformaciones son nuestros, y los errores también. Las correcciones son bienvenidas en <a id="repo-link" href="#">GitHub</a>. <a href="__ROOT__about/">Más sobre el Monitor</a>.</p>
            <p class="social-links">Nicolás Cachanosky: <a href="https://x.com/n_cachanosky" rel="me noopener" target="_blank">X</a> · <a href="https://www.linkedin.com/in/ncachanosky/" rel="me noopener" target="_blank">LinkedIn</a> · <a href="https://www.ncachanosky.com/" rel="me noopener" target="_blank">ncachanosky.com</a></p>
          </div>
          <div>
            <h4>Datos</h4>
            <p>Cada gráfico ofrece la serie en CSV. Los historiales completos de revisiones (cada versión publicada) están en <code>data/vintages/</code>. Cómo se calcula cada número: <a href="__ROOT__methodology/">Metodología</a>.</p>
          </div>

topics:
  real_sector: {title: Actividad mensual, group: Actividad, description: "La actividad económica mensual: el estimador de actividad (EMAE) por sector, la industria, la construcción y la utilización de la capacidad instalada."}
  gdp: {title: Cuentas nacionales, group: Actividad, description: "El PIB trimestral a precios constantes de 2004 y su crecimiento por componente del gasto y por sector."}
  trade: {title: Comercio exterior, group: Sector externo, description: "Exportaciones e importaciones de bienes: la balanza comercial desde 1910, qué vende y qué compra la Argentina, el balance energético, precios y cantidades, los términos del intercambio, los socios comerciales y los bienes embarcados frente a los dólares liquidados en el mercado de cambios. Del INDEC y el BCRA."}
  bop: {title: Balanza de pagos, group: Sector externo, description: "Las transacciones de la Argentina con el resto del mundo, por trimestre: la cuenta corriente y sus componentes, cómo se financió, las rentas de la inversión y la posición de inversión internacional (lo que los residentes tienen en el exterior y lo que deben a no residentes). Del INDEC."}
  prices: {title: Precios, group: Precios y dinero, description: "Precios al consumidor (nivel general, núcleo, regulados, estacionales; por división y región), la inflación desde 1943 corregida por la intervención del INDEC de 2007-2015 y los precios mayoristas."}
  money: {title: Dinero y Banco Central, group: Precios y dinero, description: "La base monetaria y sus factores de explicación, los agregados monetarios, depósitos y préstamos, tasas de interés, el tipo de cambio oficial, las reservas y el balance del Banco Central. Del BCRA. Los montos en pesos pueden verse en términos reales."}
  fx: {title: Tipo de cambio, group: Precios y dinero, description: "Los tipos de cambio oficiales y de mercado y las brechas entre ellos, el rendimiento en dólares del carry trade, las estimaciones de devaluación de mercado y de encuesta, las compras de divisas del BCRA y los flujos del mercado de cambios (balance cambiario)."}
  banks: {title: Bancos, group: Precios y dinero, description: "El sistema financiero: exposición al sector público, liquidez y encajes, depósitos en dólares, calidad de la cartera, capital y rentabilidad, concentración y los mayores bancos. Del Informe sobre Bancos del BCRA y sus datos mensuales por entidad."}
  labor: {title: Trabajo y pobreza, group: Trabajo y sociedad, description: "El mercado de trabajo, los salarios y las condiciones de vida: empleo y desempleo, empleo registrado, salarios reales y en dólares, el salario mínimo desde 1965, pobreza e indigencia, qué compran los ingresos y la distribución del ingreso. Del INDEC, el Ministerio de Trabajo y la ANSES."}
  fiscal: {title: Finanzas públicas y deuda, group: Sector público, description: "Las cuentas del gobierno nacional y su deuda: el resultado primario y financiero, ingresos y gastos, los intereses pagados y los capitalizados fuera del presupuesto, el stock de deuda, el perfil de vencimientos, los pagos y las colocaciones y licitaciones del Tesoro."}
  institutions: {title: Instituciones, group: Instituciones, description: "El marco institucional: la confianza en el gobierno y la confianza del consumidor, cuánto duran los presidentes del Banco Central y los ministros de Economía, la libertad económica, y la democracia y el Estado de derecho, con países de comparación. De la UTDT, el Fraser Institute y V-Dem."}

