  IMF Country Report, May 2026: Informe del FMI sobre la Argentina, mayo de 2026

  # Panels, contributions, tables (fixed texts)
  average since 1997: promedio desde 1997
  average since 2003: promedio desde 2003
  average since 2016: promedio desde 2016
  median since 2003: mediana desde 2003
  this year, if flat: este año, si se mantiene
  no quarterly data for these dates: no hay datos trimestrales para estas fechas
  Components to compare: Componentes para comparar
  "Compare with: year": "Comparar con: año"
  "Compare with: weekly balance": "Comparar con: balance semanal"
  Show only the selected balance: Mostrar solo el balance seleccionado
  Debt maturities by type of debt: Vencimientos de deuda por tipo
  By year: Por año
  CSV (year): CSV (año)
  How ratios to GDP are calculated: Cómo se calculan los ratios sobre el PIB
  Show each component's contribution to the total's change: Mostrar la contribución de cada componente a la variación del total
  Weights (share of 2004 GDP at constant prices): Ponderaciones (participación en el PIB de 2004 a precios constantes)
  Weights (CPI basket weight, recovered from the published indices): Ponderaciones (peso en la canasta del IPC, recuperado de los índices publicados)
  "This is relative purchasing-power parity: it assumes the reference was an equilibrium and that nothing fundamental has changed since. Both are strong assumptions.": "Es la paridad relativa del poder adquisitivo: supone que la referencia fue un equilibrio y que desde entonces no cambió nada fundamental. Ambos supuestos son fuertes."
  "The terms of trade are about 45% above their 2004 level and energy has turned from a deficit into a surplus, changes that support a stronger peso than history suggests; productivity growth relative to partners (the Balassa–Samuelson effect) works the same way. Single dates can be overshoots: the index spiked after the 2002 and December 2023 devaluations, and was at its strongest at the end of convertibility in 2001. The range across reference choices is the honest answer, not any one number.": "Los términos del intercambio están cerca de un 45% por encima de su nivel de 2004 y la energía pasó de déficit a superávit, cambios que sostienen un peso más fuerte de lo que sugiere la historia; el crecimiento de la productividad frente a los socios (el efecto Balassa–Samuelson) opera en el mismo sentido. Una fecha aislada puede ser un desborde: el índice saltó tras las devaluaciones de 2002 y de diciembre de 2023, y estuvo en su punto más fuerte al final de la convertibilidad, en 2001. La respuesta honesta es el rango entre distintas referencias, no un único número."
  "Model-based assessments (the IMF's External Balance Assessment) estimate the real exchange rate consistent with fundamentals and desirable policies. The IMF's May 2026 staff report judges Argentina's external position \"weaker than the level implied by medium-term fundamentals and desirable policies\", a preliminary assessment subject to exceptionally high uncertainty.": "Las evaluaciones basadas en modelos (la External Balance Assessment del FMI) estiman el tipo de cambio real coherente con los fundamentos y con políticas deseables. El informe del personal técnico del FMI de mayo de 2026 juzga que la posición externa de la Argentina es \"más débil que el nivel implicado por los fundamentos de mediano plazo y políticas deseables\", una evaluación preliminar sujeta a una incertidumbre excepcionalmente alta."

  "<b>Argentina Economic Monitor</b> · Economic Order": "<b>Monitor de la Economía Argentina</b> · Economic Order"

