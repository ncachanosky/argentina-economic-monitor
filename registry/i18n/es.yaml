patterns:
  - ["Real exchange rate, (.+)", "Tipo de cambio real, $1"]
  - ["Reference \\((.+)\\): (.+)", "Referencia ($1): $2"]
  - ["Index between (.+) \\(25th percentile\\) and (.+) \\(75th\\)", "Índice entre $1 (percentil 25) y $2 (percentil 75)"]
  - ["Actual official \\(wholesale\\) rate (.+) on (.+): (.+) away", "Tipo de cambio oficial (mayorista) efectivo: $1 el $2; $3 de distancia"]
  - ["Actual CCL rate (.+) on (.+): (.+) away", "Tipo de cambio CCL efectivo: $1 el $2; $3 de distancia"]
  - ["Today's official \\(wholesale\\) rate × reference index / today's index\\. ?", "Tipo de cambio oficial (mayorista) de hoy × índice de referencia / índice de hoy."]
  - ["Today's CCL rate × reference index / today's index\\. CCL mode: (.+)", "Tipo de cambio CCL de hoy × índice de referencia / índice de hoy. Modo CCL: el índice al tipo de cambio CCL (el índice oficial antes de noviembre de 2011, cuando no había controles), aplicado al CCL de hoy."]
  - ["(.+) to (.+): (.+) \\(real appreciation\\)", "$1 a $2: $3 (apreciación real)"]
  - ["(.+) to (.+): (.+) \\(real depreciation\\)", "$1 a $2: $3 (depreciación real)"]
  - ["over (.+) years, with α = (.+)", "en $1 años, con α = $2"]
  - ["(.+) to (.+) \\(INDEC\\); a rise also supports a stronger peso", "$1 a $2 (INDEC); una suba también sostiene un peso más fuerte"]
  - ["Next release: (.+) \\((.+) data\\)", "Próxima publicación: $1 (datos de $2)"]
  - ["· Latest: (.+) ·", "· Último dato: $1 ·"]
  - ["· Latest: (.+)", "· Último dato: $1"]
  - ["(.+) data was due (.+); updating", "Los datos de $1 debían publicarse el $2; actualizando"]
