# Spanish version of the site (pages under /es/). pipeline/build.py renders the
# pages with `site` and `topics`; the browser translates the interface with
# `ui` (exact English string -> Spanish), `patterns` (regex on whole strings,
# for texts with numbers or dates; $1, $2 ... keep the matched parts) and
# `hover` (phrases replaced inside chart tooltips).
# Style: impersonal, Argentine terms (tipo de cambio mayorista, brecha, riesgo
# país, base monetaria, interanual).

site:
  site_name: Monitor de la Economía Argentina
  home_h1: La economía argentina, actualizada todos los días
  home_lede: >-
    Estadísticas oficiales, verificadas cada mañana contra la fuente y graficadas
    apenas se publican. Cada gráfico es interactivo y se puede descargar como
    imagen o como datos.
  home_desc: >-
    Gráficos interactivos y actualizados a diario de la economía argentina:
    actividad, PIB, inflación y más. De Economic Order.
  methodology_title: Metodología
  methodology_lede: Fuentes, controles y cada cálculo detrás de los gráficos.
  methodology_desc: Cómo el Monitor de la Economía Argentina obtiene, verifica y transforma sus datos.
  about_title: Acerca de
  about_lede: Qué es el Monitor, quién está detrás y cómo citarlo o informar un error.
  about_desc: Acerca del Monitor de la Economía Argentina, un proyecto de Economic Order.
