# Country groups for the International page: regions (with sub-regions) and blocs.
# ISO3 codes. Membership is today's for the whole series (stated on the page): a group's
# median each year is taken over its members with data that year. Codes not covered by the
# IMF's World Economic Outlook or the World Bank are dropped when the table is built.
# Blocs as of November 2026: Mercosur without Venezuela (suspended since 2016) and with
# Bolivia (full member since 2024); euro area with Bulgaria (2026); BRICS after the 2024-25
# enlargement; ASEAN with Timor-Leste (2025).

regions:
  - key: latam
    label: Latin America & Caribbean
    sub:
      - {key: south_america, label: South America, members: [ARG, BOL, BRA, CHL, COL, ECU, GUY, PRY, PER, SUR, URY, VEN]}
