# Official release calendar, used to show "Next release" on each chart.
#
# Source: INDEC, "Calendario de difusión. Segundo semestre de 2026"
#   https://www.indec.gob.ar/ftp/cuadros/publicaciones/calendario_2sem2026.pdf
# INDEC publishes each semester's calendar ahead of time. When the listed
# dates run out, the daily update flags it in the run summary; add the next
# semester's dates here.
#
# Each entry: date of publication and the reference month it covers.
# Indicators point here with `release: <key>` in series.yaml.

