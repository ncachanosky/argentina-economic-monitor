      caba:     {label: "City of Buenos Aires",             id: 380.3_DESAGREGACTAL_0_T_30}
      gba:      {label: "Greater Buenos Aires",             id: 380.3_DESAGREGACGBA_0_T_26}
      interior: {label: "Interior",                         id: 380.3_DESAGREGACIOR_0_T_31}
    default: {variant: national, transform: level, range: Max, rebase: false}

  - id: inst_tenure_bcra
    topic: institutions
    kind: tenure
    wide: true
    title: Tenure of BCRA Presidents
    short_title: BCRA presidents
    description: >-
      Days in office of each president of the Central Bank, in order, with the average; the president in office is counted to today.
    source: table
    source_label: "Compiled by N. Cachanosky from official records (BCRA, Ministry of Economy)"
    frequency: Y
    units: Days in office
    default: {}
    table:
      source: officials
      file: tenure.json
      role: bcra
      status_id: "officials:bcra"
    note: >-
      Bars are colored by the party of the president who appointed each
      official (presidencies since December 1983; earlier bars are grey).
      The average leaves out the official in office, whose tenure is not yet
      complete. Interim officials who served days are kept: they are part of
      the turnover. Before 1983 the list spans civilian and military
      governments; the dashed line is the average of the period shown.
    method_links: [{anchor: tenure, label: "About the list of officials"}]

