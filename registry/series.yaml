     label: "Post-primary devaluation",
     description: "The official exchange rate was raised about 22% the day after the August 2023 primaries"}
  - {id: platita, start: "2023-11-01", end: "2023-12-01", indicators: [cpi_long],
     label: "Plan Platita and the December devaluation",
     description: "Pre-election fiscal and monetary expansion; the official exchange rate then more than doubled on 13 December 2023"}
  - {id: correction_2024, start: "2024-01-01", end: "2024-04-01", indicators: [cpi_long],
     label: "Correction of relative prices",
     description: "Pass-through of the December devaluation and the adjustment of regulated prices"}

# Each topic is a page of the site at /<slug>/, listed in this order in the
# navbar's Dashboards menu, under its `group` (groups in order of first use).
topics:
  - id: real_sector
    slug: monthly-activity
    old_slugs: [real-sector]
    group: Activity
    title: Monthly Activity
    description: >-
      Monthly economic activity: the activity estimator (EMAE) by sector,
      manufacturing, construction and capacity utilization.
  - id: gdp
    slug: national-accounts
    old_slugs: [gdp]
    group: Activity
    title: National Accounts
    description: >-
      Quarterly GDP at constant 2004 prices, and its growth by expenditure
      component and by industry.
  - id: trade
    slug: international-trade
    group: External Sector
    title: International Trade
    description: >-
      Exports and imports of goods: the trade balance since 1910, what
      Argentina sells and buys, the energy balance, prices against volumes,
      the terms of trade, trading partners, and goods shipped against the
      dollars settled in the foreign-exchange market. From INDEC and the
      BCRA.

  - id: bop
    slug: balance-of-payments
    group: External Sector
    title: Balance of Payments
    description: >-
      Argentina's transactions with the rest of the world, quarterly: the
      current account and its parts, how it was financed, investment income,
      and the international investment position (what residents own abroad
      and owe to non-residents). From INDEC.

  - id: prices
    slug: prices
    # Earlier page names, kept as redirects so shared links keep working.
    old_slugs: [prices-money]
    old_ids: [prices_money]
    group: Prices & Money
    title: Prices
    description: >-
      Consumer prices (headline, core, regulated, seasonal; by division and
      region), inflation since 1943 corrected for the 2007-2015 INDEC
      intervention, and wholesale prices.
  - id: money
    slug: money-central-bank
    old_slugs: [money-banking]
    group: Prices & Money
    title: Money & Central Bank
    description: >-
      Base money and what creates it, monetary aggregates, deposits and loans,
      interest rates, the official exchange rate, reserves and the central
      bank's balance sheet. From the BCRA. Peso amounts can be shown in real
      terms.

  - id: fx
    slug: exchange-rate
    group: Prices & Money
    title: Exchange Rate
    description: >-
      Official and market exchange rates and the gaps between them, the
      dollar return of the peso carry trade, market and survey estimates of
      devaluation, the BCRA's purchases of foreign currency, and the
      foreign-exchange market's flows (balance cambiario).

  - id: banks
    slug: banks
    group: Prices & Money
    title: Banks
    description: >-
      The financial system: exposure to the public sector, liquidity and
      reserve requirements, dollar deposits, loan quality, capital and
      profitability, concentration and the largest banks. From the BCRA's
      banking report and its monthly data on each institution.

  - id: labor
    slug: labor-social
    group: Labor & Social
    title: Labor & Poverty
    description: >-
      The labor market, wages and living standards: employment and
      unemployment, registered jobs, real and dollar wages, the minimum
      wage since 1965, poverty and indigence, what incomes buy, and income
      distribution. From INDEC, the Ministry of Labor and ANSES.

  - id: fiscal
    slug: fiscal
    group: Public Sector
    title: Fiscal & Debt
    description: >-
      The national government's accounts and its debt: the primary and
      financial balance, revenue and spending, interest paid and interest
      capitalized outside the budget, the debt stock, the maturity profile,
      payments, and Treasury placements and auctions.

  - id: institutions
    slug: institutions
    group: Institutions
    title: Institutions
    description: >-
      The institutional setting: confidence in the government and consumer
      confidence, how long central bank presidents and economy ministers
      last, economic freedom, and democracy and the rule of law, with
      comparison countries. From UTDT, the Fraser Institute and V-Dem.

indicators:
  - id: emae
    topic: real_sector
    wide: true
    kind: variants
    title: Monthly Economic Activity Estimator (EMAE)
    short_title: EMAE
    description: >-
      INDEC's monthly proxy for GDP. The seasonally adjusted series is the
      standard read on month-to-month momentum.
    release: emae
    source: datos_gob
    source_label: INDEC, via datos.gob.ar
    frequency: M
    units: Index, 2004 = 100
    variants:
      sa:       {label: Seasonally adjusted, id: 143.3_NO_PR_2004_A_31}
      original: {label: Original,            id: 143.3_NO_PR_2004_A_21}
      trend:    {label: Trend-cycle,         id: 143.3_NO_PR_2004_A_28}
    default: {variant: sa, transform: level, start: "2016-01"}
    headline: {variant: sa, transform: mom}
    tiles: [{variant: trend, transform: mom, label: "EMAE trend-cycle", orig: original}]
    # Yearly table: cumulative change of the year to date vs. the same months a
    # year earlier (original series, as INDEC reports it) and Dec-to-Dec (SA).
    annual_table: {accumulated: original, within_year: sa, carryover: true}

  - id: emae_turns
    topic: real_sector
    kind: turns
    title: How Fast the Trend-Cycle Calls a Turn
    short_title: Trend-cycle in real time
    description: >-
      The EMAE trend-cycle as INDEC published it at each release since
      August 2016, against the series as it stands today: how many months
      it took to signal each peak and trough, and when it signalled a turn
      that later disappeared.
    source: manual
    source_label: INDEC (EMAE informes técnicos, Cuadro 2, each release); monitor's calculations
    frequency: M
    units: "% change in the trend-cycle, month on month"
    table: {source: emae_turns}
    method_links: [{anchor: emae-turns, label: "How turns and signals are defined"}]
    note: >-
      Turning points are dated on today's trend-cycle. A release signals a
      turn when the change in its latest month has the new sign; a turn is
      confirmed by three releases in a row with that sign. Months of data:
      from the turning month to the latest month in the release; months
      after the turn: to the release date, which comes about two months
      after the data. Releases since October 2026 are stored by the daily
      update; earlier ones come from INDEC's PDF reports (the September 2018
      report is missing).

  - id: emae_sectors
    topic: real_sector
    kind: panel
    title: EMAE by Sector
    short_title: EMAE sectors
    description: >-
      Change by sector, original (not seasonally adjusted)
      series. Select sectors to compare their paths.
    release: emae
    source: datos_gob
    source_label: INDEC, via datos.gob.ar
    frequency: M
    units: Index, 2004 = 100
    variants:
      agro:          {label: Agriculture & livestock,        id: 11.3_ISOM_2004_M_39}
      fishing:       {label: Fishing,                        id: 11.3_VIPAA_2004_M_5}
      mining:        {label: Mining & quarrying,             id: 11.3_ISD_2004_M_26}
      manufacturing: {label: Manufacturing,                  id: 11.3_VMASD_2004_M_23}
      utilities:     {label: "Electricity, gas & water",       id: 11.3_ITC_2004_M_21}
      construction:  {label: Construction,                   id: 11.3_VMATC_2004_M_12}
      trade:         {label: Wholesale & retail trade,       id: 11.3_AGCS_2004_M_41}
      hotels:        {label: Hotels & restaurants,           id: 11.3_P_2004_M_20}
      transport:     {label: Transport & communications,     id: 11.3_EMC_2004_M_25}
      finance:       {label: Financial intermediation,       id: 11.3_IM_2004_M_25}
      real_estate:   {label: Real estate & business services, id: 11.3_SEGA_2004_M_48}
      public_admin:  {label: Public administration,          id: 11.3_C_2004_M_60}
      education:     {label: Education,                      id: 11.3_CMMR_2004_M_10}
      health:        {label: Health & social services,       id: 11.3_HR_2004_M_24}
      other_services: {label: Other community services,      id: 11.3_TAC_2004_M_60}
      net_taxes:     {label: Net taxes on products,          id: 11.3_IF_2004_M_25}
    # Bars: y/y and INDEC's accumulated change (year to date vs. the same months
    # a year earlier). No m/m: sector series are not seasonally adjusted.
    bar_transforms: [yoy, acc]
    default: {variant: [manufacturing, construction, agro], transform: yoy, start: "2016-01"}
    # Sector weights = shares of 2004 GDP at constant prices, from the quarterly
    # value added by industry (gdp_supply). Net taxes take the remainder.
    # With these, incidences reproduce INDEC's published figures.
    weights:
      from: gdp_supply
      year: "2004"
      residual: net_taxes          # weight = 100 - all sector shares
      exclude_from_residual: [net_taxes]
      map: {agro: agro, fishing: fishing, mining: mining, manufacturing: manufacturing,
            utilities: utilities, construction: construction, trade: trade, hotels: hotels,
            transport: transport, finance: finance, real_estate: real_estate,
            public_admin: public_admin, education: education, health: health,
            other_services: other_services}

  - id: industry_construction
    topic: real_sector
    kind: variants
    overlay: true
