  - id: inflation_expectations_range
    topic: prices
    wide: true
    kind: variants
    overlay: true
    measure: rate
    validate_as: flow       # expectations exceeded 100% in 2023
    plain_level: true
    emphasis: median
    title: How Much Forecasters Disagree
    short_title: Expectations range
    description: >-
      The spread of inflation expected over the next 12 months among the
      forecasters in the BCRA's survey (REM): the median, the middle half of
      answers (shaded) and the 10th and 90th percentiles, monthly since 2016.
    source: rem
    source_label: BCRA (REM)
    frequency: M
    units: "%"
    transforms: [level]
    ranges: [2Y, 5Y, Max]
    fan: {lo: p25, hi: p75, label: "25th-75th percentile"}
    muted: [p10, p90]
    note: >-
      A wider band means less agreement about where inflation is going, a
      rough measure of uncertainty about the disinflation path. The band
      narrows when inflation falls, so it is also worth reading relative to
      the median.
    method_links: [{anchor: rem, label: "About the REM survey"}]
    variants:
      median: {label: Median,          id: "rem:cpi12"}
      p25:    {label: 25th percentile, id: "rem:cpi12_p25"}
      p75:    {label: 75th percentile, id: "rem:cpi12_p75"}
      p10:    {label: 10th percentile, id: "rem:cpi12_p10"}
      p90:    {label: 90th percentile, id: "rem:cpi12_p90"}
    default: {variant: median, transform: level, range: Max}

  - id: rem_revisions
