    source: derived
    source_label: BCRA (Informe sobre Bancos, statistical annex)
    frequency: M
    units: "% of assets, annualized"
    ranges: [5Y, Max]
    note: >-
      The BCRA's monthly annualized results as a percentage of netted assets,
      in constant currency (IAS 29), averaged over twelve months. Net
      interest: interest income minus interest expense. CER adjustments:
      indexation of inflation-linked loans and bonds. Securities and repos:
      results on securities (mostly government paper) and premiums on repos
      (mostly with the BCRA). Inflation: the monetary result, the loss on net
      peso positions. Costs: administrative expenses and taxes other than
      income tax. Other: other financial results, miscellaneous and income
      tax. With inflation above 200% (2023-24), nominal interest and gains
      on securities were very large and mostly offset by the inflation loss;
      the total result is what is left.
    contributions:
      precomputed: true
      total: total
      total_label: Total result
      style: bars
      units: "% of assets"
      groups:
        - {key: interest,   label: Net interest,           add: [interest],   color: copper}
        - {key: cer,        label: CER adjustments,        add: [cer],        color: sky}
        - {key: securities, label: Securities and repos,   add: [securities], color: sage}
        - {key: fx,         label: Exchange-rate gains,    add: [fx],         color: lavender}
        - {key: fees,       label: Net fees,               add: [fees],       color: gold}
        - {key: losses,     label: Credit losses,          add: [losses],     color: rose}
        - {key: costs,      label: Costs,                  add: [costs],      color: slate}
        - {key: inflation,  label: Inflation (monetary result), add: [inflation], color: teal}
        - {key: other,      label: Other,                  add: [other],      color: neutral}
    default: {variant: total, transform: level, range: Max}
    derive:
      method: formula
      anchor: tot
      start: "2020-12-01"
      vars:
        ii: "bcrabk:res|system|ingresos_por_intereses_2"
        ie: "bcrabk:res|system|egresos_por_intereses_2"
        cer: "bcrabk:res|system|ajustes_cer_y_cvs_2"
        fx: "bcrabk:res|system|diferencias_de_cotizacion_2"
        sec: "bcrabk:res|system|resultado_por_titulos_valores_2"
        rep: "bcrabk:res|system|primas_por_pases_2"
        ofin: "bcrabk:res|system|otros_resultados_financieros_2"
        fees: "bcrabk:res|system|resultado_por_servicios_2"
        loss: "bcrabk:res|system|cargos_por_incobrabilidad_2"
        adm: "bcrabk:res|system|gastos_de_administracion_2"
        tax: "bcrabk:res|system|cargas_impositivas_2"
        div: "bcrabk:res|system|diversos_2"
        mon: "bcrabk:res|system|resultado_monetario_2"
        inc: "bcrabk:res|system|impuesto_a_las_ganancias_2"
        tot: "bcrabk:res|system|resultado_total_2"
      variants:
        total:      {label: Total result,         expr: "avg12(tot)"}
        interest:   {label: Net interest,         expr: "avg12(ii + ie)"}
        cer:        {label: CER adjustments,      expr: "avg12(cer)"}
        securities: {label: Securities and repos, expr: "avg12(sec + rep)"}
        fx:         {label: Exchange-rate gains,  expr: "avg12(fx)"}
        fees:       {label: Net fees,             expr: "avg12(fees)"}
        losses:     {label: Credit losses,        expr: "avg12(loss)"}
        costs:      {label: Costs,                expr: "avg12(adm + tax)"}
        inflation:  {label: Inflation (monetary result), expr: "avg12(mon)"}
        other:      {label: Other,                expr: "avg12(ofin + div + inc)"}

  - id: bank_concentration
    topic: banks
    kind: variants
    overlay: true
    measure: rate
    title: Concentration of the Financial System
    short_title: Concentration
    description: >-
      Combined share of the ten largest institutions in the system's assets,
      deposits and loans. Monthly, since June 1996.
    source: bcra_entities
    source_label: BCRA (Información de Entidades Financieras, monthly data on each institution)
    frequency: M
    validate_as: flow
    units: "% of the system"
    plain_level: true
    transforms: [level]
    ranges: [10Y, 25Y, Max]
    note: >-
      Ten largest by each measure, from each institution's balance sheet
      (unconsolidated). The Herfindahl-Hirschman index (sum of squared
      shares, 0 to 10,000) is in the next chart. Number of institutions:
      149 in June 1996, 73 in 2026. Before June 1996 the BCRA's archive
      omits the public banks, so the series start then.
    variants:
      assets:   {label: Assets,   id: "bcraef:top10_assets"}
      deposits: {label: Deposits, id: "bcraef:top10_deposits"}
      loans:    {label: Loans,    id: "bcraef:top10_loans"}
    default: {variant: assets, transform: level, range: Max}

  - id: bank_concentration_hhi
    topic: banks
    kind: variants
    overlay: true
    title: Concentration Index and Number of Institutions
    short_title: HHI
    description: >-
      Herfindahl-Hirschman index of assets, deposits and loans, and of the
      banks' claims on the Treasury and on the BCRA (sum of squared shares,
      0 to 10,000). Monthly, since June 1996.
    source: bcra_entities
    source_label: BCRA (Información de Entidades Financieras, monthly data on each institution)
    frequency: M
    validate_as: flow
    plain_level: true
    units: "HHI, 0 to 10,000"
    transforms: [level]
    ranges: [10Y, 25Y, Max]
    note: >-
      Below 1,500: unconcentrated; 1,500-2,500: moderately concentrated;
      above 2,500: highly concentrated (US merger guidelines, 2010).
    variants:
      assets:   {label: Assets,   id: "bcraef:hhi_assets"}
      deposits: {label: Deposits, id: "bcraef:hhi_deposits"}
      loans:    {label: Loans,    id: "bcraef:hhi_loans"}
      treasury: {label: "Claims on the Treasury and provinces", id: "bcraef:hhi_treasury"}
      bcra:     {label: Claims on the BCRA, id: "bcraef:hhi_bcra"}
    default: {variant: assets, transform: level, range: Max}

  - id: bank_top10
    topic: banks
    kind: top10
    wide: true
    title: The Ten Largest Institutions
    short_title: Ten largest
    description: >-
      The ten largest institutions by assets and how their balance sheets are
      composed, next to the ten together, the whole system, and public and
      private banks. Latest month, or any December since 1996.
    source: table
    source_label: BCRA (Información de Entidades Financieras, monthly data on each institution)
    frequency: M
    units: "% of each institution's assets"
    default: {}
    table:
      source: bcra_entities
      file: top10.json
      status_id: "bcraef:top10_assets"
      source_url: https://www.bcra.gob.ar/en/information-on-financial-institutions/
    note: >-
      Unconsolidated balance sheets as each institution reports them to the
      BCRA, grouped by the BCRA's chart of accounts. Government securities
      include the Treasury's LEFI; BCRA notes and repos are the central
      bank's securities (LEBAC, LELIQ, NOTALIQ and others) plus repos with
      the BCRA (large in 2019-2024). Shares of total assets; deposits and equity are on
      the funding side. Descriptive only: a bank's balance-sheet mix reflects
      its business model, not its soundness.

  - id: bank_balance_sheet
    topic: banks
    kind: balance_sheet
    wide: true
    title: Balance Sheet of the Financial System
    short_title: System balance sheet
    description: >-
      The financial system's balance sheet in the BCRA's standardized
      presentation, for the whole system or a group of banks: assets on the
      left, liabilities and net equity on the right. Monthly since December
      2009 (Decembers before).
    source: table
    source_label: BCRA (Informe sobre Bancos, statistical annex)
    frequency: M
    units: Millions of pesos
    default: {}
    table:
      source: bcra_banks
      status_id: "bcrabk:bal|system|activo"
      source_url: https://www.bcra.gob.ar/informe-sobre-bancos/
      monthly: true
      units: [ars, pct]
      guide:
        - >-
          <b>Assets and their funding.</b> Assets on the left; on the right,
          what funds them: deposits, other liabilities and net equity. Main
          lines in bold, their breakdown indented.
        - >-
          <b>Government paper.</b> Government securities include the
          Treasury's bills and bonds (and LEFI in 2024-25) and, as a sub-line,
          the BCRA's notes (LEBAC, NOBAC, LELIQ). Repos with the BCRA are in
          other claims from financial intermediation.
        - >-
          <b>Deposits.</b> Public- and private-sector deposits; private ones
          by type (current accounts, savings accounts, time deposits). Amounts
          include dollar deposits valued in pesos.
        - >-
          <b>Comparing dates.</b> Pesos of each date; for long comparisons use
          shares of total assets. Since 2020 banks report in constant
          currency, and since 2018 under international accounting standards.

  - id: bank_credit_depth
    topic: banks
    kind: variants
    measure: rate
    title: Private Credit as a Share of GDP
    short_title: Credit / GDP
    description: >-
      Banks' loans to the private sector over nominal GDP, both averaged over
      the last four quarters. Quarterly, since 2010.
    source: derived
    source_label: BCRA (Informe sobre Bancos, statistical annex); INDEC
    frequency: Q
    units: "% of GDP"
    transforms: [level, yoy]
    ranges: [5Y, 10Y, Max]
    note: >-
      Loans in pesos and dollars (dollar loans valued in pesos), gross of
      provisions: average of the last four quarter-end stocks. GDP at current
      prices: average of the last four quarters (INDEC publishes quarterly
      GDP at annual rates). Averaging the stock keeps high inflation from
      inflating the ratio: an end-of-period stock over a year's output would
      overstate it.
    default: {variant: depth, transform: level, range: Max}
    derive:
      method: formula
      anchor: loans
      start: "2010-10-01"
      vars:
        loans: "bcrabk:bal|system|prestamos/sector_privado"
        gdp: 4.4_OGP_2004_T_17
      variants:
        depth: {label: Private credit / GDP, expr: "100 * sum4(loans) / sum4(gdp)"}

  - id: bank_credit_mix
    topic: banks
    wide: true
    kind: contributions
    measure: flow
    title: What Banks Lend For
    short_title: Credit by type
    description: >-
      Financing to the private sector by type, as a share of the total, in
      pesos and dollars. Monthly, since January 2010. For growth in real
      terms of peso loans by type, see Private Peso Loans on the Money page.
    source: derived
    source_label: BCRA (Informe sobre Bancos, statistical annex)
    frequency: M
    units: "% of private financing"
    ranges: [5Y, 10Y, Max]
    note: >-
      Loans and other financing to the non-financial private sector, by
      type, as classified in the BCRA's debtor data; dollar financing valued
      in pesos (most export finance is in dollars).
    contributions:
      precomputed: true
      hide_total: true
      style: area
      units: "%"
      groups:
        - {key: cards, label: "Credit cards", add: [cards], color: copper}
        - {key: personal, label: "Personal loans", add: [personal], color: sky}
        - {key: documents, label: "Promissory notes", add: [documents], color: sage}
        - {key: overdrafts, label: "Overdrafts", add: [overdrafts], color: lavender}
        - {key: mortgages, label: "Mortgage-backed", add: [mortgages], color: gold}
        - {key: pledge, label: "Pledge-backed (cars)", add: [pledge], color: rose}
        - {key: exports, label: "Export finance", add: [exports], color: teal}
        - {key: other, label: "Other", add: [other], color: neutral}
    default: {variant: cards, transform: level, range: Max}
    derive:
      method: formula
      anchor: tot
      vars:
        tot: "bcrabk:npl_lines|system|1_total_sector_privado/saldo_total_de_financiaciones/cartera_total"
        cards: "bcrabk:npl_lines|system|1_total_sector_privado/saldo_total_de_financiaciones/tarjetas_de_credito"
        personal: "bcrabk:npl_lines|system|1_total_sector_privado/saldo_total_de_financiaciones/personales"
        documents: "bcrabk:npl_lines|system|1_total_sector_privado/saldo_total_de_financiaciones/documentos"
        overdrafts: "bcrabk:npl_lines|system|1_total_sector_privado/saldo_total_de_financiaciones/adelantos"
        mortgages: "bcrabk:npl_lines|system|1_total_sector_privado/saldo_total_de_financiaciones/con_garantia_hipotecaria"
        pledge: "bcrabk:npl_lines|system|1_total_sector_privado/saldo_total_de_financiaciones/con_garantia_prendaria"
        exports: "bcrabk:npl_lines|system|1_total_sector_privado/saldo_total_de_financiaciones/prefinanciacion_y_financiacion_de_exportaciones"
        other: "bcrabk:npl_lines|system|1_total_sector_privado/saldo_total_de_financiaciones/otros"
      variants:
        cards: {label: "Credit cards", expr: "100 * cards / tot"}
        personal: {label: "Personal loans", expr: "100 * personal / tot"}
        documents: {label: "Promissory notes", expr: "100 * documents / tot"}
        overdrafts: {label: "Overdrafts", expr: "100 * overdrafts / tot"}
        mortgages: {label: "Mortgage-backed", expr: "100 * mortgages / tot"}
        pledge: {label: "Pledge-backed (cars)", expr: "100 * pledge / tot"}
        exports: {label: "Export finance", expr: "100 * exports / tot"}
        other: {label: "Other", expr: "100 * other / tot"}

  - id: bank_uva
    topic: banks
    kind: variants
    overlay: true
    measure: rate
    title: Inflation-Indexed (UVA) Lending
    short_title: UVA lending
    description: >-
      Loans in UVA (units indexed to the CPI) as a share of financing to the
