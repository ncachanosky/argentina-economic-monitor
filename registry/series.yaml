  - {id: "bcra:91",  source: bcra, frequency: D, measure: flow, label: "Peso deposits, public and private non-financial sectors"}
  - {id: "bcra:94",  source: bcra, frequency: D, measure: flow, label: "Current accounts, private non-financial sector (pesos)"}
