      gross: {label: Gross reserves, id: "bcra:1"}
    default: {variant: gross, transform: level, start: "2019-01"}

  - id: net_reserves
    topic: money
    wide: true
    kind: variants
    overlay: true
    plain_level: true
    title: Net International Reserves
    short_title: Net reserves
    description: >-
      Gross reserves minus the BCRA's short-term foreign-currency liabilities,
      under three conventions: the standard market estimate, a liquid measure
      that also leaves out gold, and an approximation of the IMF program's
      definition. Millions of US dollars, weekly, since 2003.
    caveat: >-
      Net reserves are estimates, not official statistics. There is no
      official or universal definition: analysts, the BCRA and the IMF
      subtract different liabilities, so each convention gives a different
      number. The table below shows how each one is built.
    source: derived
    source_label: BCRA (weekly summary balance, balance sheet, FX quotes); IMF; hand-kept files
    frequency: D
    units: Millions of US dollars
    transforms: [level]
    ranges: [2Y, 5Y, 10Y, Max]
    note: >-
      Weekly balances (the 7th, 15th, 23rd and last day of each month), at
      each balance's exchange rates. The China swap is deducted in full (CNY
      130 bn since December 2018), valued at the BCRA's yuan quote; the BCRA
      stopped announcing tranches in February 2015, so the 2015 build-up is
      read from its balance sheet. Repos with foreign banks and IMF purchases
      come from hand-kept files with sources (data/manual). Treasury dollar
      deposits come from the monthly balance sheet. The IMF-style line leaves
      out items the weekly balance does not show (deposit insurance, BOPREAL
      due within a year, forwards, the US Treasury swap), so it runs about
      USD 2-3 bn above the IMF's published figures (-2.4 bn at end-2024,
      -11.8 bn at end-2025). Month-end balances are lower than mid-month
      ones because banks move their dollar reserve requirements around the
      turn of the month.
    default: {variant: standard, transform: level, start: "2019-01"}
    derive:
      method: net_reserves
      start: "2003-01-01"
      inputs:
        gross: "bcrawk:gross"
        encaje: "bcrawk:encaje"
        intl_org: "bcrawk:intl_org"
        gold: "bcrawk:gold"
        repo_line: "bcrawk:repo_line"
        fx: "bcrawk:fx"
        swap_cny: china_swap_cny
        cny_usd: "bcracot:CNY"
        repos: bcra_fx_repos
        repos_short: "bcra_fx_repos#short_usd_m"
        treasury: "bcrabal:107"
        treasury_fx: "bcrabal:fx"
        imf_purchases: imf_purchases
      variants:
        standard: {label: Standard (market)}
        liquid:   {label: Liquid}
        imf:      {label: IMF-style (approx.)}
        gross:    {label: Gross}

  - id: bcra_assets
    topic: money
    hidden: true        # history charts off for now; the weekly balance table replaces them
    kind: contributions
    measure: flow
    title: "BCRA Balance Sheet: Assets"
    short_title: BCRA assets
    description: >-
      What backs the central bank's liabilities, as a share of the total:
      reserves, other external items, credit to the government and credit to
      banks. Monthly, since 1940.
    source: derived
    source_label: BCRA (Balance del Banco Central, series since 1940)
    frequency: M
    units: "% of total"
    ranges: [10Y, 25Y, 50Y, Max]
    note: >-
      BCRA's analytical presentation, grouped and valued for monetary
      analysis. Other external items (net) are the exchange-rate valuation
      effect, contributions to international agencies, SDR allocations and
      loans from international agencies; they are mostly liabilities, so
      negative. Credit to the government includes temporary advances and
      Treasury securities (including the non-transferable letters).
    contributions:
      precomputed: true
      hide_total: true
      style: area
      units: "%"
      groups:
        - {key: gold,  label: Gold and foreign currency,  add: [gold],  color: copper}
        - {key: gov,   label: Credit to the government,   add: [gov],   color: sky}
        - {key: banks, label: Credit to banks,            add: [banks], color: sage}
        - {key: ext,   label: Other external items (net), add: [ext],   color: neutral}
    default: {variant: gold, transform: level, range: 50Y}
    derive:
      method: formula
      anchor: base
      vars: &bal {nea: "bcrabal:86", gold: "bcrabal:87", val: "bcrabal:88", contrib: "bcrabal:89", sdr: "bcrabal:3734", intl: "bcrabal:90",
            gov_ars: "bcrabal:92", adv: "bcrabal:94", gov_usd: "bcrabal:99", banks: "bcrabal:102", absorb: "bcrabal:103",
            dep: "bcrabal:104", gov_dep: "bcrabal:105", bank_usd: "bcrabal:111", liq: "bcrabal:112", notes: "bcrabal:113",
            misc: "bcrabal:114", base: "bcrabal:115", fx: "bcrabal:fx"}
      variants:
        gold:  {label: Gold and foreign currency, expr: "100 * gold / (absorb + base)"}
        gov:   {label: Credit to the government,  expr: "100 * (nz(gov_ars) + nz(gov_usd)) / (absorb + base)"}
        banks: {label: Credit to banks,           expr: "100 * nz(banks) / (absorb + base)"}
        ext:   {label: Other external items,      expr: "100 * (nz(val) + nz(contrib) + nz(sdr) + nz(intl)) / (absorb + base)"}

  - id: bcra_liabilities
    topic: money
    hidden: true        # history charts off for now; the weekly balance table replaces them
    kind: contributions
    measure: flow
    title: "BCRA Balance Sheet: Liabilities"
    short_title: BCRA liabilities
    description: >-
      What the central bank owes, as a share of the total: base money, its own
      notes, government deposits, banks' dollar deposits and other accounts.
      Monthly, since 1940.
    source: derived
    source_label: BCRA (Balance del Banco Central, series since 1940)
    frequency: M
    units: "% of total"
    ranges: [10Y, 25Y, 50Y, Max]
    note: >-
      BCRA notes: the central bank's own securities over time (LEBAC, NOBAC,
      LELIQ, NOTALIQ and others). Until April 2026, repos were netted within
      other lines; from May 2026 they follow the accounting treatment of the
      2025 financial statements. Other: remaining deposits and miscellaneous
      accounts, which include net worth. Before December 1996 some items were
      recorded gross in miscellaneous accounts (see BCRA's note 6), which
      inflates "Other" in those years.
    contributions:
      precomputed: true
      hide_total: true
      style: area
      units: "%"
      groups:
        - {key: base,     label: Base money,                 add: [base],     color: copper}
        - {key: notes,    label: BCRA notes,                 add: [notes],    color: sky}
        - {key: gov_dep,  label: Government deposits,        add: [gov_dep],  color: sage}
        - {key: bank_usd, label: Banks' dollar deposits,     add: [bank_usd], color: lavender}
        - {key: other,    label: Other (incl. net worth),    add: [other],    color: neutral}
    default: {variant: base, transform: level, range: 50Y}
    derive:
      method: formula
      anchor: base
      vars: *bal
      variants:
        base:     {label: Base money,             expr: "100 * base / (absorb + base)"}
        notes:    {label: BCRA notes,             expr: "100 * nz(notes) / (absorb + base)"}
        gov_dep:  {label: Government deposits,    expr: "100 * nz(gov_dep) / (absorb + base)"}
        bank_usd: {label: Banks' dollar deposits, expr: "100 * nz(bank_usd) / (absorb + base)"}
        other:    {label: Other,                  expr: "100 * (dep - nz(gov_dep) + nz(liq) + nz(misc)) / (absorb + base)"}

  - id: bcra_balance_sheet
    topic: money
    kind: balance_sheet
    wide: true
    title: "BCRA Balance Sheet"
    short_title: Balance sheet
    description: >-
      The central bank's balance sheet as the BCRA publishes it each week:
      assets on the left, liabilities and net equity on the right. Pick any
      weekly balance since 2002 and compare it with another.
    source: table
    source_label: BCRA (weekly summary balance of assets and liabilities)
    frequency: D
    units: Millions of pesos
    default: {}
    table:
      source: bcra_weekly
      status_id: "bcrawk:gross"
      source_url: https://www.bcra.gob.ar/en/weekly-summary-balances-of-assets-and-liabilities/
      guide:
        - >-
          <b>Both sides add up.</b> Assets equal liabilities plus net equity.
          Main lines are in bold; indented lines break them down, and lines
          under "Less:" are deducted from the line above.
        - >-
          <b>Money is a liability.</b> Base money (currency in circulation plus
          banks' peso current accounts at the BCRA) is on the right-hand side,
          next to the BCRA's other peso liabilities: its notes (LEBAC, LELIQ)
          and repos, which pay interest.
        - >-
          <b>Not all reserves are the BCRA's.</b> International reserves on the
          left are gross. Several liabilities on the right are matched by
          dollars inside them: banks' current accounts in foreign currency
          (reserve requirements on dollar deposits), repos with foreign banks,
          obligations with international agencies, and the China swap (in
          "Other liabilities" since December 2022, before that in the repo
          lines). See Net International Reserves.
        - >-
          <b>Claims on the Treasury.</b> Government securities, the Treasury's
          non-transferable bills (Letras Intransferibles) and temporary
          advances are claims on the Treasury, received in exchange for
          reserves or pesos. What they are worth depends on the Treasury's
          ability to pay and on how the BCRA values them, which has changed
          several times (see the note below the table).
        - >-
          <b>Net equity is a residual.</b> It moves with the peso value of
          reserves (a devaluation raises it) and with the valuation of the
          Treasury's bills, so it says little about the BCRA's economic
          solvency; it was negative in 2019.
        - >-
          <b>Comparing dates.</b> Peso amounts are in pesos of each date. Over
          long periods compare shares of total assets, or dollars at each
          balance's exchange rate. Line names and grouping are the BCRA's own
          for each year and change over time (the reserves block was
          restated in 2010, the China swap reclassified in December 2022,
          repos in May 2026); in a comparison, lines are matched by name.
      valuation_label: Nontransferable
      valuation_notes:
        - {from: "2006-01-01", to: "2018-07-15", text: "Letras Intransferibles at technical value: face value plus accrued interest."}
        - {from: "2018-07-23", to: "2019-12-23", text: "Letras Intransferibles at estimated present value (BCRA Board Resolution 209/18 of 5 July 2018, applied from the 2017 financial statements): cash flows discounted at the yields of comparable Argentine-law bonds. The switch cut their book value from about USD 49 bn to 37 bn; after the August 2019 primaries it fell to about USD 10 bn. During 2019 the BCRA also reported net equity with the bills at technical value."}
        - {from: "2019-12-31", to: "2024-04-30", text: "Letras Intransferibles back at technical value (Law 27,541, art. 62; Board Resolution 2/2020), justified by the intent to hold them to maturity; the reversal added about $2.1 trillion pesos at the end of 2019."}
        - {from: "2024-05-07", to: null, text: "Letras Intransferibles at amortized cost, capped at recoverable value (Board Resolution 128/24, recorded in the 2023 financial statements and in the weekly balance from 7 May 2024): their book value fell from about USD 69 bn to 18 bn. In April 2025 the Treasury repurchased bills with a face value of about USD 16.9 bn using IMF funds (Decree 179/25)."}

  - id: bcra_government
    topic: money
    wide: true
    kind: variants
    overlay: true
    measure: rate
    title: Central Bank Financing of the Government
    short_title: Government financing
    emphasis: total                       # drawn as a thick dark line
    composition: [advances, other]        # "Composition" view: shares of the total
    description: >-
      Credit to the government as a share of the BCRA's total assets: temporary
      advances and the rest (Treasury securities, including the
      non-transferable letters, and other credit). Monthly, since 1940.
    source: derived
    source_label: BCRA (Balance del Banco Central, series since 1940)
    frequency: M
    units: "% of total assets"
    transforms: [level, share, yoy]
    ranges: [10Y, 25Y, 50Y, Max]
    note: >-
      The December 2019 revaluation of the non-transferable letters (Law
      27,541) and the May 2024 change to amortized-cost valuation create
      breaks in these series. Total assets are the BCRA's analytical total, which nets
      external liabilities (SDR allocations, loans from international
      agencies), so the share can exceed 100%. Composition: advances and
      the rest as shares of total credit to the government.
    default: {variant: total, transform: level, range: 50Y}
    derive:
      method: formula
      anchor: base
      vars: *bal
      variants:
        total:    {label: Credit to the government, expr: "100 * (nz(gov_ars) + nz(gov_usd)) / (absorb + base)"}
        advances: {label: Temporary advances,       expr: "100 * nz(adv) / (absorb + base)"}
        other:    {label: Securities and other,     expr: "100 * (nz(gov_ars) - nz(adv) + nz(gov_usd)) / (absorb + base)"}

  # ---------------- Banks ----------------
  - id: bank_public_exposure
    topic: banks
    wide: true
    kind: variants
    overlay: true
    measure: rate
    emphasis: total
    title: Banks' Exposure to the Public Sector
    short_title: Public-sector exposure
    description: >-
      Claims of the financial system on the public sector as a share of its
      assets: on the Treasury and the rest of the non-financial public sector
      (securities, loans), and on the central bank (its notes and repos).
      Monthly, since December 2009.
    source: derived
    source_label: BCRA (Informe sobre Bancos, statistical annex)
    frequency: M
    units: "% of assets"
    transforms: [level, yoy]
    ranges: [5Y, 10Y, Max]
    note: >-
      Treasury and other public sector: the BCRA's indicator "credit to the
      public sector" (government securities, including the Treasury's LEFI,
      loans to the public sector, and other claims), excluding BCRA paper.
      BCRA: notes held in banks' own portfolio (LEBAC, NOBAC, LELIQ) plus net repos with the BCRA,
      measured as the difference between the BCRA's liquidity ratios with and
      without repos, times deposits. From July 2024 to June 2025 that
      difference was the Treasury's LEFI (already in the first line), so it
      is not counted as BCRA exposure in those months.
    default: {variant: total, transform: level, range: Max}
    derive:
      method: formula
      anchor: pub
      start: "2009-12-01"
      vars:
        pub: "bcrabk:ind|system|4_credito_al_sector_publico"
        l2: "bcrabk:ind|system|2_liquidez_con_pases_lefi"
        l3: "bcrabk:ind|system|3_liquidez"
        lel: "bcrabk:bal|system|titulos_publicos/tenencia_por_cartera_propia"
        act: "bcrabk:bal|system|activo"
        dep: "bcrabk:bal|system|depositos"
        lefi: lefi_period
      variants:
        total:    {label: Total public sector,              expr: "pub + 100 * (nz(lel) + (l2 - l3) / 100 * dep * (1 - nz(lefi))) / act"}
        treasury: {label: Treasury and other public sector, expr: "pub"}
        bcra:     {label: Central bank (BCRA),              expr: "100 * (nz(lel) + (l2 - l3) / 100 * dep * (1 - nz(lefi))) / act"}

