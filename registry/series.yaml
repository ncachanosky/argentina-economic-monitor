    default: {variant: summary, transform: level, range: Max}

  - id: inst_vdem
    topic: institutions
    wide: true
    kind: variants
    overlay: true
    overlay_default: [libdem, electdem, rol]
    plain_level: true
    measure: flow
    title: "Democracy and the Rule of Law in Argentina (V-Dem)"
    short_title: V-Dem, Argentina
    description: >-
      Six indices from the Varieties of Democracy project, 0 to 1, yearly:
      the quality of democracy, the constraints on the executive, the rule
      of law and corruption.
    source: vdem
    source_label: "V-Dem Institute, Varieties of Democracy dataset (v16), via Our World in Data"
    frequency: Y
    units: Index, 0-1
    transforms: [level]
    ranges: [Since 1983, Since 1946, Since 1900, Max]
    note: >-
      V-Dem's indices aggregate the ratings of several country experts per
      question with a measurement model; the line is the point estimate
      (the confidence intervals are not shown). Political corruption runs
      the other way: higher is more corrupt. Legislative constraints are
      blank in years without a sitting legislature (the military
      governments).
    method_links: [{anchor: vdem, label: "About the V-Dem indices"}]
    variants:
      libdem: {label: "Liberal democracy", id: "vdem:libdem:ARG"}
      electdem: {label: "Electoral democracy", id: "vdem:electdem:ARG"}
      judicial: {label: "Judicial constraints on the executive", id: "vdem:judicial:ARG"}
      legislative: {label: "Legislative constraints on the executive", id: "vdem:legislative:ARG"}
      rol: {label: "Rule of law", id: "vdem:rol:ARG"}
      corruption: {label: "Political corruption", id: "vdem:corruption:ARG"}
    default: {variant: libdem, transform: level, range: Since 1946}

