      groups:
        - {key: nacion, label: Banco Nación, add: [nacion], color: copper}
        - {key: provincia, label: Banco Provincia, add: [provincia], color: sky}
        - {key: galicia, label: Galicia, add: [galicia], color: sage}
        - {key: santander, label: Santander, add: [santander], color: lavender}
