    headline: {variant: ipi_sa, transform: mom, label: "IPI manufacturing", orig: ipi_orig, sub: "m/m, seasonally adjusted"}
    tiles: [{variant: isac_sa, transform: mom, label: "ISAC construction", orig: isac_orig, sub: "m/m, seasonally adjusted"}]

