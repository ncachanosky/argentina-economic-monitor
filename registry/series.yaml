      isac_sa:    {label: "Construction (ISAC), seasonally adjusted", id: 33.2_ISAC_SIN_EDAD_0_M_23_56}
      ipi_orig:   {label: "Manufacturing (IPI), original", id: 453.1_SERIE_ORIGNAL_0_0_14_46}
