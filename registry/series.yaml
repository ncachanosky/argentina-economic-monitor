        nontax_12m: {label: "Non-tax and capital revenue (12 months)", expr: "100 * (sum12((tot - vat - inc - ss - exd - deb - imd - fuel - exc - pa - oth) / cpi) - lag(sum12((tot - vat - inc - ss - exd - deb - imd - fuel - exc - pa - oth) / cpi), 12)) / lag(sum12((tot) / cpi), 12)"}

