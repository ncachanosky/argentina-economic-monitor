      bank reserve requirements in dollars, are estimates with no official
      definition; see Net International Reserves for three conventions.
    source: bcra
    source_label: BCRA
    frequency: D
    units: Millions of US dollars
    transforms: [level, yoy, mom]
    ranges: [2Y, 5Y, 10Y, Max]
