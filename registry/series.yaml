    source: derived
    source_label: INDEC (Intercambio Comercial Argentino), via datos.gob.ar
    frequency: M
    units: Millions of US dollars
    ranges: [2Y, 5Y, 10Y, Max]
    note: >-
      Capital goods and their parts and accessories move with investment;
      intermediate goods (inputs for production, the largest group) with
      activity; fuels with the energy balance and the weather; consumer
      goods and cars with household demand and with import restrictions.
    contributions:
      precomputed: true
      total: total
      total_label: Total imports
      units: "US$ m"
      suffix: " m"
      groups:
        - {key: bk,  label: Capital goods,          add: [bk],  color: copper}
        - {key: pz,  label: Parts for capital goods, add: [pz], color: gold}
        - {key: bi,  label: Intermediate goods,     add: [bi],  color: sky}
        - {key: cl,  label: Fuels and lubricants,   add: [cl],  color: slate}
        - {key: bc,  label: Consumer goods,         add: [bc],  color: sage}
        - {key: va,  label: Passenger vehicles,     add: [va],  color: lavender}
        - {key: re,  label: Other,                  add: [re],  color: neutral}
    yearly: {how: sum}
    default: {variant: bk, transform: level, range: 10Y}
    derive:
      method: formula
      anchor: m
      vars: {m: 74.3_IIT_0_M_25, bk: 74.3_IIBCA_0_M_32, pz: 74.3_IIPABC_0_M_50, bi: 74.3_IIBI_0_M_36, cl: 74.3_IICL_0_M_42, bc: 74.3_IIBCO_0_M_32, va: 74.3_IIVAP_0_M_49, re: 74.3_IIR_0_M_23}
      variants:
        bk: {label: Capital goods, expr: "bk"}
        pz: {label: Parts, expr: "pz"}
        bi: {label: Intermediate goods, expr: "bi"}
        cl: {label: Fuels, expr: "cl"}
        bc: {label: Consumer goods, expr: "bc"}
        va: {label: Vehicles, expr: "va"}
        re: {label: Other, expr: "re"}
        total: {label: Total, expr: "m"}

  - id: trade_imports_growth
    topic: trade
    release: ica
    wide: true
    kind: contributions
    measure: flow
    title: What Drives Import Growth
    short_title: Import growth
    description: >-
      Change in imports over the last twelve months against the twelve
      before, and the contribution of each use, in percentage points.
    source: derived
    source_label: INDEC (Intercambio Comercial Argentino), via datos.gob.ar
    frequency: M
    units: Percentage points
    ranges: [5Y, 10Y, Max]
    note: >-
      Twelve-month sums, as for exports. Contribution of a use: the change
      in its twelve-month imports over total imports in the previous twelve
      months. Capital goods include their parts and accessories here.
    contributions:
      precomputed: true
      total: total
      total_label: "Imports, last 12 months, change %"
      units: pp
      groups:
        - {key: bk,  label: Capital goods and parts, add: [bk], color: copper}
        - {key: bi,  label: Intermediate goods,     add: [bi],  color: sky}
        - {key: cl,  label: Fuels and lubricants,   add: [cl],  color: slate}
        - {key: bc,  label: Consumer goods and vehicles, add: [bc], color: sage}
        - {key: re,  label: Other,                  add: [re],  color: neutral}
    default: {variant: total, transform: level, range: 10Y}
    derive:
      method: formula
      anchor: m
      vars: {m: 74.3_IIT_0_M_25, bk: 74.3_IIBCA_0_M_32, pz: 74.3_IIPABC_0_M_50, bi: 74.3_IIBI_0_M_36, cl: 74.3_IICL_0_M_42, bc: 74.3_IIBCO_0_M_32, va: 74.3_IIVAP_0_M_49, re: 74.3_IIR_0_M_23}
      variants:
        total: {label: Total, expr: "100 * (sum12(m) / lag(sum12(m), 12) - 1)"}
        bk:    {label: Capital goods and parts, expr: "100 * (sum12(bk + pz) - lag(sum12(bk + pz), 12)) / lag(sum12(m), 12)"}
        bi:    {label: Intermediate goods, expr: "100 * (sum12(bi) - lag(sum12(bi), 12)) / lag(sum12(m), 12)"}
        cl:    {label: Fuels, expr: "100 * (sum12(cl) - lag(sum12(cl), 12)) / lag(sum12(m), 12)"}
        bc:    {label: Consumer goods and vehicles, expr: "100 * (sum12(bc + va) - lag(sum12(bc + va), 12)) / lag(sum12(m), 12)"}
        re:    {label: Other, expr: "100 * (sum12(re) - lag(sum12(re), 12)) / lag(sum12(m), 12)"}

  - id: trade_energy
    topic: trade
    release: ica
    wide: true
    kind: contributions
    measure: flow
    title: Energy Trade Balance
    short_title: Energy balance
    description: >-
      Exports of fuels and energy, imports of fuels and lubricants (below
      zero) and the balance between them, millions of US dollars, monthly
      since 1992.
    source: derived
    source_label: INDEC (Intercambio Comercial Argentino), via datos.gob.ar
    frequency: M
    units: Millions of US dollars
    ranges: [5Y, 10Y, Max]
    note: >-
      Energy imports peak in the southern winter, when gas and fuel demand
      for heating and power generation outruns local supply; use the yearly
      view for the trend. INDEC's export and import categories are not an
      exact match (exports include electricity and some petrochemicals), so
      the balance is a close approximation.
    contributions:
      precomputed: true
      total: balance
      total_label: Energy balance
      units: "US$ m"
      suffix: " m"
      groups:
        - {key: exports, label: Fuel and energy exports, add: [exports], color: copper}
        - {key: imports, label: Fuel imports (negative), add: [imports], color: slate}
    yearly: {how: sum}
    default: {variant: exports, transform: level, range: Max}
    derive:
      method: formula
      anchor: e
      vars: {e: 74.3_IECE_0_M_35, f: 74.3_IICL_0_M_42}
      variants:
        exports: {label: Exports, expr: "e"}
        imports: {label: Imports, expr: "-f"}
        balance: {label: Balance, expr: "e - f"}

  - id: trade_prices_exports
    topic: trade
    kind: contributions
    measure: flow
    title: "Exports: Prices against Volumes"
    short_title: Export prices and volumes
    description: >-
      Change in the dollar value of exports from the same quarter a year
      earlier, split into prices and quantities, percentage points.
    source: derived
    source_label: INDEC (índices de precios y cantidades), via datos.gob.ar
    frequency: Q
    units: Percentage points
    ranges: [5Y, 10Y, Max]
    note: >-
      Value = price × quantity, so with p and q the y/y changes in prices
      and quantities, value grows (1 + p)(1 + q) − 1. The split is
      symmetric: prices contribute p(2 + q)/2 and quantities q(2 + p)/2,
      which add up exactly to the change in value.
    method_links: [{anchor: trade-prices, label: "How value is split into prices and volumes"}]
    contributions:
      precomputed: true
      total: total
      total_label: "Export value, y/y %"
      units: pp
      groups:
        - {key: price, label: Prices,     add: [price], color: gold}
        - {key: qty,   label: Quantities, add: [qty],   color: sage}
    default: {variant: total, transform: level, range: 10Y}
    derive:
      method: formula
      anchor: p
      vars: {p: 80.2_IIPENG_0_T_45, q: 80.2_IICENG_0_T_47}
      variants:
        total: {label: Value, expr: "100 * (p * q / (lag(p, 4) * lag(q, 4)) - 1)"}
        price: {label: Prices, expr: "100 * (p / lag(p, 4) - 1) * (1 + q / lag(q, 4)) / 2"}
        qty:   {label: Quantities, expr: "100 * (q / lag(q, 4) - 1) * (1 + p / lag(p, 4)) / 2"}

  - id: trade_prices_imports
    topic: trade
    kind: contributions
    measure: flow
    title: "Imports: Prices against Volumes"
    short_title: Import prices and volumes
    description: >-
      Change in the dollar value of imports from the same quarter a year
      earlier, split into prices and quantities, percentage points.
    source: derived
    source_label: INDEC (índices de precios y cantidades), via datos.gob.ar
    frequency: Q
    units: Percentage points
    ranges: [5Y, 10Y, Max]
    note: >-
      The same split as for exports. Import volumes follow activity and
      investment closely; import prices follow world prices of fuels,
      inputs and manufactures.
    method_links: [{anchor: trade-prices, label: "How value is split into prices and volumes"}]
    contributions:
      precomputed: true
      total: total
      total_label: "Import value, y/y %"
      units: pp
      groups:
        - {key: price, label: Prices,     add: [price], color: gold}
        - {key: qty,   label: Quantities, add: [qty],   color: sky}
    default: {variant: total, transform: level, range: 10Y}
    derive:
      method: formula
      anchor: p
      vars: {p: 81.2_IIPING_0_T_45, q: 81.2_IICING_0_T_47}
      variants:
        total: {label: Value, expr: "100 * (p * q / (lag(p, 4) * lag(q, 4)) - 1)"}
        price: {label: Prices, expr: "100 * (p / lag(p, 4) - 1) * (1 + q / lag(q, 4)) / 2"}
        qty:   {label: Quantities, expr: "100 * (q / lag(q, 4) - 1) * (1 + p / lag(p, 4)) / 2"}

  - id: trade_terms
    topic: trade
    wide: true
    kind: variants
    overlay: true
    overlay_default: [terms]
    title: Terms of Trade
    short_title: Terms of trade
    description: >-
