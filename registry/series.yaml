      groups:
        - {key: vat, label: "VAT", add: [vat], color: copper}
        - {key: income, label: "Income tax", add: [income], color: sky}
        - {key: social, label: "Social security contributions", add: [social], color: sage}
        - {key: export, label: "Export duties", add: [export], color: gold}
        - {key: debits, label: "Tax on bank debits and credits", add: [debits], color: lavender}
        - {key: other_tax, label: "Other taxes (incl. import duties, fuel, PAIS)", add: [other_tax], color: rose}
        - {key: nontax, label: "Non-tax and capital revenue", add: [nontax], color: neutral}
    yearly: {how: december, suffix: _12m, total_label: "Real total revenue, change vs. previous year, %"}
    default: {variant: total, transform: level, range: 5Y}
    derive:
      method: formula
      anchor: tot
      start: "2017-12-01"
      vars:
        tot: 379.9_ING_ANTES_017__26_83
        vat: 452.2_IVA_NETO_RROS_0_T_19_67
        inc: 452.2_GANANCIASIAS_0_T_9_51
        ss: 452.2_APORTES_COIAL_0_T_39_29
        exd: 452.2_DERECHOS_EION_0_T_20_42
        imd: 452.2_DERECHOS_IION_0_T_20_60
        deb: 452.2_DEBITOS_CRTOS_0_T_16_22
        fuel: 452.2_COMBUSTIBLLES_0_T_12_97
        exc: 452.2_IMPUESTOS_NOS_0_T_18_87
        pa: 452.2_BIENES_PERLES_0_T_17_26
        oth: 452.2_RESTO_TRIBIOS_0_T_17_0
        cpi: 148.3_INIVELNAL_DICI_M_26
      variants:
        total: {label: Total, expr: "100 * (tot * lag(cpi, 12) / cpi - lag(tot, 12)) / lag(tot, 12)"}
        vat: {label: "VAT", expr: "100 * ((vat) * lag(cpi, 12) / cpi - lag((vat), 12)) / lag(tot, 12)"}
        income: {label: "Income tax", expr: "100 * ((inc) * lag(cpi, 12) / cpi - lag((inc), 12)) / lag(tot, 12)"}
        social: {label: "Social security contributions", expr: "100 * ((ss) * lag(cpi, 12) / cpi - lag((ss), 12)) / lag(tot, 12)"}
        export: {label: "Export duties", expr: "100 * ((exd) * lag(cpi, 12) / cpi - lag((exd), 12)) / lag(tot, 12)"}
        debits: {label: "Tax on bank debits and credits", expr: "100 * ((deb) * lag(cpi, 12) / cpi - lag((deb), 12)) / lag(tot, 12)"}
        other_tax: {label: "Other taxes (incl. import duties, fuel, PAIS)", expr: "100 * ((imd + fuel + exc + pa + oth) * lag(cpi, 12) / cpi - lag((imd + fuel + exc + pa + oth), 12)) / lag(tot, 12)"}
        nontax: {label: "Non-tax and capital revenue", expr: "100 * ((tot - vat - inc - ss - exd - deb - imd - fuel - exc - pa - oth) * lag(cpi, 12) / cpi - lag((tot - vat - inc - ss - exd - deb - imd - fuel - exc - pa - oth), 12)) / lag(tot, 12)"}
        total_12m: {label: "Total (12 months)", expr: "100 * (sum12((tot) / cpi) / lag(sum12((tot) / cpi), 12) - 1)"}
        vat_12m: {label: "VAT (12 months)", expr: "100 * (sum12((vat) / cpi) - lag(sum12((vat) / cpi), 12)) / lag(sum12((tot) / cpi), 12)"}
        income_12m: {label: "Income tax (12 months)", expr: "100 * (sum12((inc) / cpi) - lag(sum12((inc) / cpi), 12)) / lag(sum12((tot) / cpi), 12)"}
        social_12m: {label: "Social security contributions (12 months)", expr: "100 * (sum12((ss) / cpi) - lag(sum12((ss) / cpi), 12)) / lag(sum12((tot) / cpi), 12)"}
        export_12m: {label: "Export duties (12 months)", expr: "100 * (sum12((exd) / cpi) - lag(sum12((exd) / cpi), 12)) / lag(sum12((tot) / cpi), 12)"}
        debits_12m: {label: "Tax on bank debits and credits (12 months)", expr: "100 * (sum12((deb) / cpi) - lag(sum12((deb) / cpi), 12)) / lag(sum12((tot) / cpi), 12)"}
        other_tax_12m: {label: "Other taxes (incl. import duties, fuel, PAIS) (12 months)", expr: "100 * (sum12((imd + fuel + exc + pa + oth) / cpi) - lag(sum12((imd + fuel + exc + pa + oth) / cpi), 12)) / lag(sum12((tot) / cpi), 12)"}
        nontax_12m: {label: "Non-tax and capital revenue (12 months)", expr: "100 * (sum12((tot - vat - inc - ss - exd - deb - imd - fuel - exc - pa - oth) / cpi) - lag(sum12((tot - vat - inc - ss - exd - deb - imd - fuel - exc - pa - oth) / cpi), 12)) / lag(sum12((tot) / cpi), 12)"}

