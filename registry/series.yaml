# Episodes: dated shocks marked on charts (optional shading, off by default)
# and optionally left out of the presidency averages. Neutral descriptions;
# interpretation belongs in Economic Order posts, not here.
episodes:
  - {id: deval_2023, start: "2023-08-01", end: "2023-09-01", indicators: [cpi, cpi_long],
     label: "Post-primary devaluation",
     description: "The official exchange rate was raised about 22% the day after the August 2023 primaries"}
  - {id: platita, start: "2023-11-01", end: "2023-12-01", indicators: [cpi, cpi_long],
     label: "Plan Platita and the December devaluation",
     description: "Pre-election fiscal and monetary expansion; the official exchange rate then more than doubled on 13 December 2023"}
  - {id: correction_2024, start: "2024-01-01", end: "2024-04-01", indicators: [cpi, cpi_long],
     label: "Correction of relative prices",
     description: "Pass-through of the December devaluation and the adjustment of regulated prices"}

# Each topic is a page of the site at /<slug>/, in this order in the navbar.
topics:
  - id: real_sector
    slug: real-sector
    title: Real Sector
    description: >-
      Monthly economic activity: the activity estimator (EMAE) by sector,
      manufacturing, construction and capacity utilization.
  - id: gdp
    slug: gdp
    title: Real GDP
    description: >-
      Quarterly GDP at constant 2004 prices, and its growth by expenditure
      component and by industry.
  - id: prices
    slug: prices
    # Earlier page names, kept as redirects so shared links keep working.
    old_slugs: [prices-money]
    old_ids: [prices_money]
    title: Prices
    description: >-
      Consumer prices (headline, core, regulated, seasonal; by division and
      region), inflation since 1943 corrected for the 2007-2015 INDEC
      intervention, and wholesale prices.
  - id: money
    slug: money-central-bank
    old_slugs: [money-banking]
    title: Money & Central Bank
    description: >-
      Base money and what creates it, monetary aggregates, deposits and loans,
      interest rates, the official exchange rate, reserves and the central
      bank's balance sheet. From the BCRA. Peso amounts can be shown in real
      terms.

  - id: banks
    slug: banks
    title: Banks
    description: >-
      The financial system: exposure to the public sector, liquidity and
      reserve requirements, dollar deposits, loan quality, capital and
      profitability, concentration and the largest banks. From the BCRA's
      banking report and its monthly data on each institution.

  - id: fiscal
    slug: fiscal
    title: Fiscal & Debt
    description: >-
      The national government's accounts and its debt: the primary and
      financial balance, revenue and spending, interest paid and interest
      capitalized outside the budget, the debt stock, the maturity profile,
      payments, and Treasury placements and auctions.

indicators:
  - id: emae
    topic: real_sector
    wide: true
    kind: variants
    title: Monthly Economic Activity Estimator (EMAE)
    short_title: EMAE
    description: >-
      INDEC's monthly proxy for GDP. The seasonally adjusted series is the
      standard read on month-to-month momentum.
    release: emae
    source: datos_gob
    source_label: INDEC, via datos.gob.ar
    frequency: M
    units: Index, 2004 = 100
    variants:
      sa:       {label: Seasonally adjusted, id: 143.3_NO_PR_2004_A_31}
      original: {label: Original,            id: 143.3_NO_PR_2004_A_21}
      trend:    {label: Trend-cycle,         id: 143.3_NO_PR_2004_A_28}
    default: {variant: sa, transform: level, start: "2016-01"}
    headline: {variant: sa, transform: mom}
    # Yearly table: cumulative change of the year to date vs. the same months a
    # year earlier (original series, as INDEC reports it) and Dec-to-Dec (SA).
    annual_table: {accumulated: original, within_year: sa, carryover: true}

  - id: emae_sectors
    topic: real_sector
    kind: panel
    title: EMAE by Sector
    short_title: EMAE sectors
    description: >-
      Change by sector, original (not seasonally adjusted)
      series. Select sectors to compare their paths.
    release: emae
    source: datos_gob
    source_label: INDEC, via datos.gob.ar
    frequency: M
    units: Index, 2004 = 100
    variants:
      agro:          {label: Agriculture & livestock,        id: 11.3_ISOM_2004_M_39}
      fishing:       {label: Fishing,                        id: 11.3_VIPAA_2004_M_5}
      mining:        {label: Mining & quarrying,             id: 11.3_ISD_2004_M_26}
      manufacturing: {label: Manufacturing,                  id: 11.3_VMASD_2004_M_23}
      utilities:     {label: "Electricity, gas & water",       id: 11.3_ITC_2004_M_21}
