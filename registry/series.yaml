  - {id: "bcrabal:87", source: bcra_balance, frequency: M, measure: flow, allow_gaps: true, label: "BCRA balance: Gold and foreign currency (net)"}
  - {id: "bcrabal:88", source: bcra_balance, frequency: M, measure: flow, allow_gaps: true, label: "BCRA balance: Foreign exchange valuation effect"}
  - {id: "bcrabal:89", source: bcra_balance, frequency: M, measure: flow, allow_gaps: true, label: "BCRA balance: Contributions to international agencies"}
