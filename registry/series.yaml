# under the handover rule, and Duhalde's term starts Jan 2002.
presidencies:
  - {id: alfonsin,  name: Raúl Alfonsín,    short: Alfonsín,    start: "1983-12-10", end: "1989-07-08", party: ucr}
  - {id: menem1,    name: Carlos Menem (1st term), short: Menem I,  start: "1989-07-08", end: "1995-07-08", party: peronism}
  - {id: menem2,    name: Carlos Menem (2nd term), short: Menem II, start: "1995-07-08", end: "1999-12-10", party: peronism}
  - {id: delarua,   name: Fernando de la Rúa, short: De la Rúa, start: "1999-12-10", end: "2001-12-20", party: ucr}
  - {id: duhalde,   name: Eduardo Duhalde,  short: Duhalde,     start: "2002-01-01", end: "2003-05-25", party: peronism}
  - {id: nkirchner, name: Néstor Kirchner,  short: N. Kirchner, start: "2003-05-25", end: "2007-12-10", party: peronism}
  - {id: cfk1,      name: Cristina Fernández de Kirchner (1st term), short: CFK I,  start: "2007-12-10", end: "2011-12-10", party: peronism}
  - {id: cfk2,      name: Cristina Fernández de Kirchner (2nd term), short: CFK II, start: "2011-12-10", end: "2015-12-10", party: peronism}
