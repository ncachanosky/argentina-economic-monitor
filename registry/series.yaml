party_colors:
  peronism: {label: "Peronism (PJ / FpV / FdT)", light: "#4A9FDB", dark: "#6CB4E8"}
  ucr:      {label: "UCR / Alianza",        light: "#C0392B", dark: "#E57366"}
  pro:      {label: "PRO / Cambiemos",      light: "#D99B00", dark: "#F2BE3C"}
  lla:      {label: "La Libertad Avanza",   light: "#6A3FB5", dark: "#9A78D6"}

# Interim presidents between De la Rúa's resignation (20 Dec 2001) and
