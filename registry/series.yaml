    source_label: BCRA (factores de explicación de la base monetaria)
    frequency: M
    units: Percentage points of base money
    note: >-
      Sterilization: repos, LEBAC, LELIQ and LEFI (negative when the BCRA
      absorbs pesos). Treasury: net FX purchases from the Treasury, temporary
