  - id: bank_sovereign_capital
    topic: banks
    kind: variants
    overlay: true
    measure: rate
    title: Exposure to the State Relative to Capital
    short_title: Exposure / capital
    description: >-
      Banks' claims on the Treasury, the rest of the public sector and the
      BCRA as a percentage of their net equity, by group. At 300%, a 10%
      loss on those claims would cost 30% of capital. Monthly, since December
      2009.
    source: derived
    source_label: BCRA (Informe sobre Bancos, statistical annex)
    frequency: M
    units: "% of net equity"
    transforms: [level, yoy]
    ranges: [5Y, 10Y, Max]
    note: >-
      Claims on the state as in the exposure chart (Treasury and other
      public sector, BCRA notes in own portfolio, net repos with the BCRA),
      in pesos, over net equity. Book values; regulation gives most of these
      claims low risk weights, so capital ratios do not reflect them.
    default: {variant: public, transform: level, range: Max}
    derive:
      method: formula
      anchor: eq_s
      start: "2009-12-01"
      vars:
        lefi: lefi_period
        pub_s: "bcrabk:ind|system|4_credito_al_sector_publico"
        l2_s: "bcrabk:ind|system|2_liquidez_con_pases_lefi"
        l3_s: "bcrabk:ind|system|3_liquidez"
        lel_s: "bcrabk:bal|system|titulos_publicos/tenencia_por_cartera_propia"
        act_s: "bcrabk:bal|system|activo"
        dep_s: "bcrabk:bal|system|depositos"
        eq_s: "bcrabk:bal|system|patrimonio_neto"
        pub_p: "bcrabk:ind|private|4_credito_al_sector_publico"
        l2_p: "bcrabk:ind|private|2_liquidez_con_pases_lefi"
        l3_p: "bcrabk:ind|private|3_liquidez"
        lel_p: "bcrabk:bal|private|titulos_publicos/tenencia_por_cartera_propia"
        act_p: "bcrabk:bal|private|activo"
        dep_p: "bcrabk:bal|private|depositos"
        eq_p: "bcrabk:bal|private|patrimonio_neto"
        pub_g: "bcrabk:ind|public|4_credito_al_sector_publico"
        l2_g: "bcrabk:ind|public|2_liquidez_con_pases_lefi"
        l3_g: "bcrabk:ind|public|3_liquidez"
        lel_g: "bcrabk:bal|public|titulos_publicos/tenencia_por_cartera_propia"
        act_g: "bcrabk:bal|public|activo"
        dep_g: "bcrabk:bal|public|depositos"
        eq_g: "bcrabk:bal|public|patrimonio_neto"
      variants:
        public: {label: Public banks, expr: "100 * (pub_g / 100 * act_g + nz(lel_g) + (l2_g - l3_g) / 100 * dep_g * (1 - nz(lefi))) / eq_g"}
        private: {label: Private banks, expr: "100 * (pub_p / 100 * act_p + nz(lel_p) + (l2_p - l3_p) / 100 * dep_p * (1 - nz(lefi))) / eq_p"}
        system: {label: Financial system, expr: "100 * (pub_s / 100 * act_s + nz(lel_s) + (l2_s - l3_s) / 100 * dep_s * (1 - nz(lefi))) / eq_s"}

  - id: bank_liquidity
    topic: banks
    wide: true
    kind: contributions
    measure: flow
    title: "Bank Liquidity: What Backs Deposits"
    short_title: Liquidity
    description: >-
      Banks' liquid assets as a share of their deposits, by type: cash and
      accounts at the BCRA; repos with the BCRA (and, July 2024 to June 2025,
      the Treasury's LEFI); BCRA notes; and Treasury bonds that banks use to
      meet reserve requirements instead of cash. Monthly, since December 2009.
    source: derived
    source_label: BCRA (Informe sobre Bancos, statistical annex)
    frequency: M
    units: "% of deposits"
    ranges: [5Y, 10Y, Max]
    note: >-
      The BCRA's three liquidity ratios nest: liquidity (cash and current
      accounts at the BCRA), liquidity with repos and LEFI, and broad
      liquidity, which adds BCRA notes and Treasury bonds counted toward
      reserve requirements. Treasury bonds for reserve requirements are broad
      liquidity minus liquidity with repos and LEFI, minus BCRA notes held in
      banks' own portfolio (from the balance sheet). Before 2018 the
      difference is zero: the BCRA's data show no Treasury bonds counted
      toward reserve requirements. Reserve requirements on peso deposits can be
      met in part with Treasury bonds bought at primary auctions; all
      currencies together, as the BCRA reports the ratios.
    contributions:
      precomputed: true
      hide_total: true
      style: area
      units: "%"
      groups:
        - {key: cash,  label: Cash and BCRA current accounts,          add: [cash],  color: copper}
        - {key: repo,  label: "BCRA repos (LEFI Jul 2024 - Jun 2025)",  add: [repo],  color: sky}
        - {key: notes, label: BCRA notes,                               add: [notes], color: lavender}
        - {key: bonds, label: Treasury bonds for reserve requirements,  add: [bonds], color: sage}
    default: {variant: cash, transform: level, range: Max}
    derive:
      method: formula
      anchor: l1
      start: "2009-12-01"
      vars:
        l1: "bcrabk:ind|system|1_liquidez_amplia"
        l2: "bcrabk:ind|system|2_liquidez_con_pases_lefi"
        l3: "bcrabk:ind|system|3_liquidez"
        lel: "bcrabk:bal|system|titulos_publicos/tenencia_por_cartera_propia"
        dep: "bcrabk:bal|system|depositos"
      variants:
        cash:  {label: Cash and BCRA current accounts, expr: "l3"}
        repo:  {label: BCRA repos and LEFI,            expr: "l2 - l3"}
        notes: {label: BCRA notes,                     expr: "100 * nz(lel) / dep"}
        bonds: {label: Treasury bonds for reserve requirements, expr: "l1 - l2 - 100 * nz(lel) / dep"}

  - id: bank_dollars
    topic: banks
    kind: variants
    overlay: true
    measure: rate
    title: Where Dollar Deposits Go
    short_title: Dollar deposits
    description: >-
      Banks' dollars held as cash or at the BCRA, and dollar loans, as a
      share of dollar deposits. Monthly, since December 2012.
    source: derived
    source_label: BCRA (Informe sobre Bancos, statistical annex)
    frequency: M
    units: "% of dollar deposits"
    transforms: [level, yoy]
    ranges: [5Y, 10Y, Max]
    note: >-
      Foreign-currency items are total minus peso-only balance-sheet lines.
      Dollars held at the BCRA (bank reserve requirements) are part of the
      BCRA's gross reserves; see Net International Reserves.
    default: {variant: cash, transform: level, range: Max}
    derive:
      method: formula
      anchor: dep
      start: "2012-12-01"
      vars:
        disp: "bcrabk:bal|system|disponibilidades"
        disp_ars: "bcrabk:bal_ars|system|disponibilidades"
        dep: "bcrabk:bal|system|depositos"
        dep_ars: "bcrabk:bal_ars|system|depositos"
        loans: "bcrabk:bal|system|prestamos"
        loans_ars: "bcrabk:bal_ars|system|prestamos"
      variants:
        cash:  {label: "Cash and BCRA accounts, % of dollar deposits", expr: "100 * (disp - disp_ars) / (dep - dep_ars)"}
        loans: {label: "Dollar loans, % of dollar deposits",            expr: "100 * (loans - loans_ars) / (dep - dep_ars)"}

  - id: bank_npl
    topic: banks
    kind: variants
    half: true
    overlay: true
    measure: rate
    title: Non-Performing Loans
    short_title: Non-performing loans
    description: >-
      Loans to the private sector in arrears of more than 90 days or
      otherwise irregular, as a share of loans: households, firms and total.
      Monthly, since January 2010.
    source: bcra_banks
    source_label: BCRA (Informe sobre Bancos, statistical annex)
    frequency: M
    validate_as: flow
    units: "% of loans"
    transforms: [level, yoy]
    ranges: [5Y, 10Y, Max]
    note: >-
      Irregular portfolio: debtors classified in situations 3 to 6 of the
      BCRA's debtor classification. Households: loans to individuals except
      for commercial purposes; firms: loans to companies and commercial loans
      to individuals.
    variants:
      households: {label: Households, id: "bcrabk:npl_lines|system|2_familias_total/ratio_de_irregularidad/cartera_irregular_total"}
      firms:      {label: Firms,      id: "bcrabk:npl_lines|system|3_empresas_total/ratio_de_irregularidad/cartera_irregular_total"}
      total:      {label: Private sector, id: "bcrabk:npl_lines|system|1_total_sector_privado/ratio_de_irregularidad/cartera_irregular_total"}
    default: {variant: households, transform: level, range: Max}

  - id: bank_capital
    topic: banks
    kind: variants
    half: true
    overlay: true
    measure: rate
    title: Bank Capital
    short_title: Capital
    description: >-
      Regulatory capital as a share of risk-weighted assets (credit, market
      and operational risk), by bank group. Monthly, since February 2013.
    source: bcra_banks
    source_label: BCRA (Informe sobre Bancos, statistical annex)
    frequency: M
    validate_as: flow
    units: "% of risk-weighted assets"
    transforms: [level, yoy]
    ranges: [5Y, 10Y, Max]
    note: >-
      Basel III minimum: 8% (plus buffers). Sovereign exposures carry low
      risk weights, so banks heavy in government paper show high ratios.
    variants:
      system:  {label: Financial system, id: "bcrabk:ind|system|11a_integracion_de_capital"}
      private: {label: Private banks,    id: "bcrabk:ind|private|11a_integracion_de_capital"}
      public:  {label: Public banks,     id: "bcrabk:ind|public|11a_integracion_de_capital"}
    default: {variant: system, transform: level, range: Max}

  - id: bank_roe
    topic: banks
    kind: variants
    overlay: true
    measure: rate
    title: Bank Profitability
    short_title: Profitability
    description: >-
      Return on equity, inflation-adjusted, accumulated over the year and
      annualized, by bank group. Monthly, since January 2020.
    source: bcra_banks
    source_label: BCRA (Informe sobre Bancos, statistical annex)
    frequency: M
    validate_as: flow
    units: "% of equity, annualized"
    transforms: [level]
    ranges: [5Y, Max]
    view_start: "2020-01"
    note: >-
      Since January 2020 banks report in constant currency (IAS 29), so
      results are net of the loss of value of their peso positions.
      Year-to-date figures restart each January.
    variants:
      system:  {label: Financial system, id: "bcrabk:ind|system|9b_roe_acumulado_anual_considera_ajuste_por_inflacion"}
      private: {label: Private banks,    id: "bcrabk:ind|private|9b_roe_acumulado_anual_considera_ajuste_por_inflacion"}
      public:  {label: Public banks,     id: "bcrabk:ind|public|9b_roe_acumulado_anual_considera_ajuste_por_inflacion"}
    default: {variant: system, transform: level}

  - id: bank_profits
    topic: banks
    wide: true
    kind: contributions
    measure: flow
    title: Where Bank Profits Come From
    short_title: Profit sources
    description: >-
      The financial system's results by source, as a percentage of assets,
      averaged over the last twelve months: interest, inflation-indexed
      adjustments, securities and repos, fees, credit losses, costs, and the
      loss of value of peso positions to inflation. Monthly, since December
      2020.
    source: derived
    source_label: BCRA (Informe sobre Bancos, statistical annex)
    frequency: M
    units: "% of assets, annualized"
    ranges: [5Y, Max]
    note: >-
      The BCRA's monthly annualized results as a percentage of netted assets,
      in constant currency (IAS 29), averaged over twelve months. Net
      interest: interest income minus interest expense. CER adjustments:
      indexation of inflation-linked loans and bonds. Securities and repos:
      results on securities (mostly government paper) and premiums on repos
      (mostly with the BCRA). Inflation: the monetary result, the loss on net
      peso positions. Costs: administrative expenses and taxes other than
      income tax. Other: other financial results, miscellaneous and income
      tax. With inflation above 200% (2023-24), nominal interest and gains
      on securities were very large and mostly offset by the inflation loss;
      the total result is what is left.
    contributions:
      precomputed: true
      total: total
      total_label: Total result
      style: bars
      units: "% of assets"
      groups:
        - {key: interest,   label: Net interest,           add: [interest],   color: copper}
        - {key: cer,        label: CER adjustments,        add: [cer],        color: sky}
        - {key: securities, label: Securities and repos,   add: [securities], color: sage}
        - {key: fx,         label: Exchange-rate gains,    add: [fx],         color: lavender}
        - {key: fees,       label: Net fees,               add: [fees],       color: gold}
        - {key: losses,     label: Credit losses,          add: [losses],     color: rose}
        - {key: costs,      label: Costs,                  add: [costs],      color: slate}
        - {key: inflation,  label: Inflation (monetary result), add: [inflation], color: teal}
        - {key: other,      label: Other,                  add: [other],      color: neutral}
    default: {variant: total, transform: level, range: Max}
    derive:
      method: formula
      anchor: tot
      start: "2020-12-01"
      vars:
        ii: "bcrabk:res|system|ingresos_por_intereses_2"
        ie: "bcrabk:res|system|egresos_por_intereses_2"
        cer: "bcrabk:res|system|ajustes_cer_y_cvs_2"
        fx: "bcrabk:res|system|diferencias_de_cotizacion_2"
        sec: "bcrabk:res|system|resultado_por_titulos_valores_2"
        rep: "bcrabk:res|system|primas_por_pases_2"
        ofin: "bcrabk:res|system|otros_resultados_financieros_2"
        fees: "bcrabk:res|system|resultado_por_servicios_2"
        loss: "bcrabk:res|system|cargos_por_incobrabilidad_2"
        adm: "bcrabk:res|system|gastos_de_administracion_2"
        tax: "bcrabk:res|system|cargas_impositivas_2"
        div: "bcrabk:res|system|diversos_2"
        mon: "bcrabk:res|system|resultado_monetario_2"
        inc: "bcrabk:res|system|impuesto_a_las_ganancias_2"
        tot: "bcrabk:res|system|resultado_total_2"
      variants:
        total:      {label: Total result,         expr: "avg12(tot)"}
        interest:   {label: Net interest,         expr: "avg12(ii + ie)"}
        cer:        {label: CER adjustments,      expr: "avg12(cer)"}
        securities: {label: Securities and repos, expr: "avg12(sec + rep)"}
        fx:         {label: Exchange-rate gains,  expr: "avg12(fx)"}
        fees:       {label: Net fees,             expr: "avg12(fees)"}
        losses:     {label: Credit losses,        expr: "avg12(loss)"}
        costs:      {label: Costs,                expr: "avg12(adm + tax)"}
        inflation:  {label: Inflation (monetary result), expr: "avg12(mon)"}
        other:      {label: Other,                expr: "avg12(ofin + div + inc)"}

  - id: bank_concentration
    topic: banks
    kind: variants
    overlay: true
    measure: rate
    title: Concentration of the Financial System
    short_title: Concentration
    description: >-
      Combined share of the ten largest institutions in the system's assets,
      deposits and loans. Monthly, since June 1996.
    source: bcra_entities
    source_label: BCRA (Información de Entidades Financieras, monthly data on each institution)
    frequency: M
    validate_as: flow
    units: "% of the system"
    plain_level: true
    transforms: [level]
    ranges: [10Y, 25Y, Max]
    note: >-
      Ten largest by each measure, from each institution's balance sheet
      (unconsolidated). The Herfindahl-Hirschman index (sum of squared
      shares, 0 to 10,000) is in the next chart. Number of institutions:
      149 in June 1996, 73 in 2026. Before June 1996 the BCRA's archive
      omits the public banks, so the series start then.
    variants:
      assets:   {label: Assets,   id: "bcraef:top10_assets"}
      deposits: {label: Deposits, id: "bcraef:top10_deposits"}
      loans:    {label: Loans,    id: "bcraef:top10_loans"}
    default: {variant: assets, transform: level, range: Max}

  - id: bank_concentration_hhi
    topic: banks
    kind: variants
    overlay: true
    title: Concentration Index and Number of Institutions
    short_title: HHI
    description: >-
      Herfindahl-Hirschman index of assets, deposits and loans, and of the
      banks' claims on the Treasury and on the BCRA (sum of squared shares,
      0 to 10,000). Monthly, since June 1996.
    source: bcra_entities
    source_label: BCRA (Información de Entidades Financieras, monthly data on each institution)
    frequency: M
    validate_as: flow
    plain_level: true
    units: "HHI, 0 to 10,000"
    transforms: [level]
