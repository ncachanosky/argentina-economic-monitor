    variants:
      terms:   {label: Terms of trade,  id: 82.2_ITI_2004_T_27}
      exports: {label: Export prices,   id: 82.2_IPE_2004_T_26}
      imports: {label: Import prices,   id: 82.2_IPI_2004_T_26}
    default: {variant: terms, transform: level, range: Max}

  - id: trade_partners_exports
    topic: trade
    release: ica
