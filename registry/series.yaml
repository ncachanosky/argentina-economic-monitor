  - {id: "bcra:96",  source: bcra, frequency: D, measure: flow, label: "Time deposits, not CER/UVA-adjusted, private (pesos)"}
  - {id: "bcra:97",  source: bcra, frequency: D, measure: flow, label: "Time deposits, CER/UVA-adjusted, private (pesos)"}
  - {id: "bcra:108", source: bcra, frequency: D, measure: flow, label: "Dollar deposits, private non-financial sector (USD)"}
  - {id: "bcra:110", source: bcra, frequency: D, measure: flow, label: "Loans to the private sector: overdrafts (pesos)"}
  - {id: "bcra:111", source: bcra, frequency: D, measure: flow, label: "Loans to the private sector: promissory notes (pesos)"}
