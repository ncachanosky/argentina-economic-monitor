  # Net reserves. The weekly summary balance (2002-) gives most liabilities;
  # values are millions of dollars at each balance's exchange rate. Balances
  # are weekly and published with a lag, hence allow_gaps and stale_days.
  - {id: "bcrawk:gross",    source: bcra_weekly, frequency: D, measure: flow, allow_gaps: true, stale_days: 21, label: "BCRA weekly balance: gross international reserves (USD m)"}
  - {id: "bcrawk:encaje",   source: bcra_weekly, frequency: D, measure: flow, allow_gaps: true, stale_days: 21, label: "BCRA weekly balance: banks' current accounts in foreign currency (USD m)"}
