  - id: cpi_newbasket
    topic: prices_money
    wide: true
    kind: variants
    overlay: true
    title: CPI with the 2017/18 Basket (Estimate)
    short_title: CPI, new basket
    description: >-
      INDEC was to replace the 2004/05 basket with weights from the 2017/18
      household spending survey starting with January 2026 data; the change
      was postponed. This estimate applies the new division weights to the
      published division indices.
    release: ipc
    source: derived
    source_label: "INDEC, via datos.gob.ar; reweighting by AEM"
    frequency: M
    units: Index, Dec 2016 = 100
    transforms: [mom, ytd]
    view_start: "2026-01"
    note: >-
      Only the shift in weights across the twelve divisions is captured. The
      new index would also change items and weights within divisions and by
      region, which this estimate cannot reproduce. The current basket's
      weights are recovered from the index itself and price-updated to Dec
      2025; the new weights are taken as applying in Dec 2025.
    summary_windows:
      - {label: "since Dec 2025", base: "2025-12-01", end: null}
    default: {variant: reweighted, transform: mom, base: "2025-12-01"}
    derive:
      method: reweight
      link: "2025-12-01"
      headline: 148.3_INIVELNAL_DICI_M_26
      components: cpi_divisions
      new_weights_reference: link     # or [first, last] survey month to price-update, e.g. ["2017-07-01", "2018-06-01"]
      new_weights: {food: 22.7, alcohol: 1.9, clothing: 6.8, housing: 14.5, household: 5.4, health: 6.4,
                    transport: 14.3, comms: 5.2, recreation: 8.6, education: 3.1, restaurants: 6.6, misc: 4.3}
      variants:
        official:   {label: "Official (2004/05 basket)"}
        reweighted: {label: "2017/18 basket (estimate)"}

