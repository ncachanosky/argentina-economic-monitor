        tot: "bcrabk:npl_lines|system|1_total_sector_privado/saldo_total_de_financiaciones/cartera_total"
        huva: "bcrabk:npl_lines|system|2_1_familias_en_uva/saldo_total_de_financiaciones/cartera_total"
        htot: "bcrabk:npl_lines|system|2_familias_total/saldo_total_de_financiaciones/cartera_total"
      variants:
