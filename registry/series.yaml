  # ---------------- International trade ----------------
  - id: trade_balance
    topic: trade
    wide: true
    kind: contributions
    measure: flow
    title: Exports, Imports and the Trade Balance
    short_title: Trade balance
    description: >-
      Exports and imports of goods each month (imports shown below zero) and
      the trade balance, millions of US dollars, since 1992.
    source: derived
    source_label: INDEC (Intercambio Comercial Argentino), via datos.gob.ar
    frequency: M
    units: Millions of US dollars
    ranges: [2Y, 5Y, 10Y, Max]
    note: >-
      Exports FOB, imports CIF (including freight and insurance), as INDEC
      records them at customs. Trade is very seasonal (the harvest ships in
      the second quarter), so compare a month with the same month a year
      earlier, or use the yearly view (calendar-year totals; the current
      year is partial).
    contributions:
      precomputed: true
      total: balance
      total_label: Trade balance
      units: "US$ m"
      suffix: " m"
      groups:
        - {key: exports, label: Exports, add: [exports], color: copper}
        - {key: imports, label: Imports (negative), add: [imports], color: sky}
    yearly: {how: sum}
    default: {variant: exports, transform: level, range: 10Y}
    derive:
      method: formula
      anchor: x
      vars: {x: 74.3_IET_0_M_16, m: 74.3_IIT_0_M_25, b: 74.3_ISC_0_M_19}
      variants:
        exports: {label: Exports,  expr: "x"}
        imports: {label: Imports,  expr: "-m"}
        balance: {label: Balance,  expr: "b"}

  - id: trade_long
    topic: trade
    wide: true
    kind: variants
    overlay: true
    log_level: true
    plain_level: true
    title: Trade since 1910
    short_title: Trade since 1910
    description: >-
      Exports and imports of goods by year since 1910, millions of current
      US dollars, on a log scale.
    source: datos_gob
    source_label: INDEC, via datos.gob.ar
    frequency: Y
    units: Millions of US dollars
    transforms: [level]
    ranges: [25Y, 50Y, Max]
    note: >-
      Current dollars: the long-run rise includes US inflation. On a log
      scale equal distances are equal percentage changes, so the gap between
      the lines is the ratio of exports to imports. The last year shown is
      the last complete one INDEC has added to this series.
    variants:
      exports: {label: Exports, id: 74.1_IET_0_A_16}
      imports: {label: Imports, id: 74.1_IIT_0_A_25}
    default: {variant: exports, transform: level, range: Max}

  - id: trade_exports_type
    topic: trade
    wide: true
    kind: contributions
    measure: flow
    title: What Argentina Exports
    short_title: Exports by type
    description: >-
      Exports of goods by INDEC's four broad types, millions of US dollars,
      monthly since 1992.
    source: derived
    source_label: INDEC (Intercambio Comercial Argentino), via datos.gob.ar
    frequency: M
    units: Millions of US dollars
    ranges: [2Y, 5Y, 10Y, Max]
    note: >-
      Primary products: grains, oilseeds, fresh fruit, fish, minerals and
      the like. Manufactures of agricultural origin (MOA): soybean meal and
      oil, meat, dairy, wine and other processed farm products. Manufactures
      of industrial origin (MOI): vehicles, chemicals, metals, machinery,
      gold and other industrial goods. Fuels and energy: crude oil, gas,
      fuels and electricity.
    contributions:
      precomputed: true
      total: total
      total_label: Total exports
      units: "US$ m"
      suffix: " m"
      groups:
        - {key: pp,  label: Primary products, add: [pp],  color: sage}
        - {key: moa, label: Agricultural manufactures (MOA), add: [moa], color: gold}
        - {key: moi, label: Industrial manufactures (MOI), add: [moi], color: sky}
        - {key: cye, label: Fuels and energy, add: [cye], color: copper}
    yearly: {how: sum}
    default: {variant: pp, transform: level, range: 10Y}
    derive:
      method: formula
      anchor: x
      vars: {x: 74.3_IET_0_M_16, pp: 74.3_IEPP_0_M_35, moa: 74.3_IEMOA_0_M_48, moi: 74.3_IEMOI_0_M_46, cye: 74.3_IECE_0_M_35}
      variants:
        pp:    {label: Primary products, expr: "pp"}
        moa:   {label: MOA,              expr: "moa"}
        moi:   {label: MOI,              expr: "moi"}
        cye:   {label: Fuels and energy, expr: "cye"}
        total: {label: Total,            expr: "x"}

  - id: trade_exports_growth
    topic: trade
    wide: true
    kind: contributions
    measure: flow
    title: What Drives Export Growth
    short_title: Export growth
    description: >-
      Change in exports over the last twelve months against the twelve
      before, and the contribution of each type, in percentage points.
    source: derived
    source_label: INDEC (Intercambio Comercial Argentino), via datos.gob.ar
    frequency: M
    units: Percentage points
    ranges: [5Y, 10Y, Max]
    note: >-
      Twelve-month sums remove the seasonality of monthly trade. Contribution
      of a type: the change in its twelve-month exports over total exports
      in the previous twelve months, so the bars add up to the change in the
      total. In US dollars, so it mixes prices and volumes (see Prices
      against Volumes below).
    contributions:
      precomputed: true
      total: total
      total_label: "Exports, last 12 months, change %"
      units: pp
      groups:
        - {key: pp,  label: Primary products, add: [pp],  color: sage}
        - {key: moa, label: Agricultural manufactures (MOA), add: [moa], color: gold}
        - {key: moi, label: Industrial manufactures (MOI), add: [moi], color: sky}
        - {key: cye, label: Fuels and energy, add: [cye], color: copper}
    default: {variant: total, transform: level, range: 10Y}
    derive:
      method: formula
      anchor: x
      vars: {x: 74.3_IET_0_M_16, pp: 74.3_IEPP_0_M_35, moa: 74.3_IEMOA_0_M_48, moi: 74.3_IEMOI_0_M_46, cye: 74.3_IECE_0_M_35}
      variants:
        total: {label: Total, expr: "100 * (sum12(x) / lag(sum12(x), 12) - 1)"}
        pp:    {label: Primary products, expr: "100 * (sum12(pp) - lag(sum12(pp), 12)) / lag(sum12(x), 12)"}
        moa:   {label: MOA,              expr: "100 * (sum12(moa) - lag(sum12(moa), 12)) / lag(sum12(x), 12)"}
        moi:   {label: MOI,              expr: "100 * (sum12(moi) - lag(sum12(moi), 12)) / lag(sum12(x), 12)"}
        cye:   {label: Fuels and energy, expr: "100 * (sum12(cye) - lag(sum12(cye), 12)) / lag(sum12(x), 12)"}

  - id: trade_imports_use
    topic: trade
    wide: true
    kind: contributions
