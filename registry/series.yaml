  - {id: "bcra:15",  source: bcra, frequency: D, measure: index, label: "Base money"}
  - {id: "bcra:17",  source: bcra, frequency: D, measure: index, label: "Currency held by the public"}
  - {id: "bcra:85",  source: bcra, frequency: D, measure: flow, label: "Current accounts, public and private non-financial sectors (pesos)"}
