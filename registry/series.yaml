  - id: inst_efw
    topic: institutions
    wide: true
    kind: variants
    overlay: true
    overlay_default: [arg, chl, ury, bra, latam]
    muted: [latam]
    emphasis: arg
    term_colored: true
    secondary_bar: {variant: rank, of: count, label: "Argentina's world rank (bars, right axis)", axis: "World rank (1 = most free)"}
    plain_level: true
    measure: flow
    title: Economic Freedom of the World
    short_title: Economic freedom
    description: >-
      The Fraser Institute's summary rating of economic freedom, 0 (least
      free) to 10: Argentina, colored by presidency, and comparison
      countries; the bars are Argentina's world rank. 1970-2000 every five
      years, annual since. Add countries with the buttons below the chart.
    source: efw
    source_label: "Fraser Institute, Economic Freedom of the World: 2026 Annual Report"
    frequency: Y
    units: Rating, 0-10
    transforms: [level]
    ranges: [Since 2000, Max]
    note: >-
      The summary rating is the average of five areas (size of government,
      legal system and property rights, sound money, freedom to trade
      internationally, regulation), built from about 45 components drawn from
      the IMF, the World Bank, the World Economic Forum and other sources.
      Each edition revises earlier years. The Latin American median is taken
      over the countries rated each year (fewer before 2000). The number of
      countries ranked grew from about 100 in 1970 to 165, so ranks far apart
      in time are not strictly comparable (hover shows "rank of N").
    method_links: [{anchor: efw, label: "About the EFW index"}]
    variants:
      arg: {label: "Argentina", id: "efw:ARG:summary"}
      chl: {label: "Chile", id: "efw:CHL:summary"}
      ury: {label: "Uruguay", id: "efw:URY:summary"}
      bra: {label: "Brazil", id: "efw:BRA:summary"}
      latam: {label: "Latin America (median)", id: "efw:LATAM:summary"}
      mex: {label: "Mexico", id: "efw:MEX:summary"}
      col: {label: "Colombia", id: "efw:COL:summary"}
      per: {label: "Peru", id: "efw:PER:summary"}
      ven: {label: "Venezuela", id: "efw:VEN:summary"}
      ecu: {label: "Ecuador", id: "efw:ECU:summary"}
      pan: {label: "Panama", id: "efw:PAN:summary"}
      slv: {label: "El Salvador", id: "efw:SLV:summary"}
      aus: {label: "Australia", id: "efw:AUS:summary"}
      can: {label: "Canada", id: "efw:CAN:summary"}
      esp: {label: "Spain", id: "efw:ESP:summary"}
      rank: {label: "Argentina's world rank", id: "efw:ARG:rank"}
      count: {label: "Countries ranked", id: "efw:ALL:count"}
    default: {variant: arg, transform: level, range: Max}

  - id: inst_efw_areas
    topic: institutions
    wide: true
    kind: variants
    overlay: true
    emphasis: summary
    plain_level: true
    measure: flow
    title: "Economic Freedom: Argentina by Area"
    short_title: EFW areas
    description: >-
      Argentina's summary rating and the five areas it averages, 0 to 10.
    source: efw
    source_label: "Fraser Institute, Economic Freedom of the World: 2026 Annual Report"
    frequency: Y
    units: Rating, 0-10
    transforms: [level]
    ranges: [Since 2000, Max]
