      suffix: " m"
      groups:
        - {key: brazil, label: Brazil,           add: [brazil], color: sage}
        - {key: merco,  label: Rest of Mercosur, add: [merco],  color: teal}
        - {key: china,  label: China,            add: [china],  color: rose}
        - {key: us,     label: United States,    add: [us],     color: sky}
        - {key: eu,     label: European Union,   add: [eu],     color: lavender}
        - {key: rest,   label: Rest of the world, add: [rest],  color: neutral}
    yearly: {how: sum}
    default: {variant: brazil, transform: level, range: 10Y}
    derive:
      method: formula
      anchor: t
      vars: {t: 77.3_IET_0_A_25, br: 77.3_IEB_0_A_24, me: 77.3_IETM_0_A_32, cn: 77.3_IEC_0_A_23, us: 77.3_IEEU_0_A_32, eu: 77.3_IERU_0_A_29_20}
      variants:
