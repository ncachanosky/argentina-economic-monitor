  - id: cpi_long
    topic: prices
    wide: true
    kind: variants
    overlay: true
    log_level: true
    title: Consumer Prices since 1943, Corrected for the INDEC Intervention
    short_title: CPI, long run
    description: >-
      From January 2007 to October 2015, the last figure published before the
      change of government, INDEC's CPI understated inflation. The new INDEC
      then suspended the CPI until it was rebuilt (no data for November 2015 to
      April 2016). The corrected series uses a composite of private estimates
      for both periods; the official series is the CPI as INDEC published it.
    release: ipc
    source: derived
    source_label: "INDEC; IPC Congreso (Jan 2007 - Apr 2016)"
    frequency: M
    units: "Index, corrected series: Dec 2016 = 100"
    transforms: [yoy, mom, level]
    ranges: [10Y, 25Y, 50Y, Max]
    note: >-
      Official: INDEC's historical CPI to Dec 2006, CPI-GBA (2007-2013),
      IPC-NU (Jan 2014 - Oct 2015), CPI-GBA (May - Dec 2016) and the national
      CPI from Jan 2017. INDEC published no CPI from Nov 2015 to Apr 2016; the
      official level carries on through that gap with the corrected series'
      changes. Both series are equal through Dec 2006, so in levels the
      distance between them is the inflation the official figures left out.
      Corrected: the same, with the "IPC Congreso" from Jan 2007 to Apr 2016,
      a composite of private estimates published by members of Congress while
      INDEC was intervened. The private sources were kept confidential
      to shield them from the fines and lawsuits the Secretariat of Domestic
      Trade under Guillermo Moreno brought against private estimators.
    # Two different periods, drawn differently and explained in a key above
    # the chart: manipulated figures (shaded) and no figures at all (outlined).
    bands:
      - {start: "2007-01-01", end: "2015-10-01", key: "INDEC intervention: official figures understated (Jan 2007 - Oct 2015)"}
      - {start: "2015-11-01", end: "2016-04-01", style: outline, key: "Statistical emergency: no official CPI published (Nov 2015 - Apr 2016)"}
    summary_windows:
      - {label: "Jan 2007 - Oct 2015", base: "2006-12-01", end: "2015-10-01"}
    default: {variant: corrected, transform: yoy, range: 25Y, base: "2006-12-01"}
    derive:
      method: splice
      anchor: {id: 148.3_INIVELNAL_DICI_M_26, date: "2016-12-01"}
      variants:
        corrected:
          label: Corrected
          segments:
            - {id: 178.1_NL_GENERAL_0_0_13, as: index, to: "2006-12-01"}
            - {id: cpi_private_composite, as: index, from: "2007-01-01", to: "2016-04-01"}
            - {id: 103.1_I2N_2016_M_19, as: index, from: "2016-05-01", to: "2016-12-01"}
            - {id: 148.3_INIVELNAL_DICI_M_26, as: index, from: "2017-01-01"}
        official:
          label: Official (as published)
          fill_gaps_from: corrected
          align: {variant: corrected, date: "2006-12-01"}
          segments:
            - {id: 178.1_NL_GENERAL_0_0_13, as: index, to: "2006-12-01"}
            - {id: 96.3_INGV_2008_M_20, as: mom, from: "2007-01-01", to: "2013-12-01"}
            - {id: 98.3_INNG_2013_0_20, as: index, from: "2014-01-01", to: "2015-10-01"}
            - {id: 103.1_I2N_2016_M_19, as: index, from: "2016-05-01", to: "2016-12-01"}
            - {id: 148.3_INIVELNAL_DICI_M_26, as: index, from: "2017-01-01"}

