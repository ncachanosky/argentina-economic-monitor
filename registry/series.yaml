      variants:
        total:    {label: Total,        sum_of: ["bcra:46"]}
        fx:       {label: FX purchases, sum_of: ["bcra:47"]}
        treasury: {label: Treasury,     sum_of: ["bcra:48", "bcra:49", "bcra:50", "bcra:51"]}
