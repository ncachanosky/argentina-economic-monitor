  - {id: "bcrawk:repo_line", source: bcra_weekly, frequency: D, measure: flow, allow_gaps: true, stale_days: 21, label: "BCRA weekly balance: obligations from repo transactions (USD m)"}
  - {id: "bcrawk:fx",       source: bcra_weekly, frequency: D, measure: flow, allow_gaps: true, stale_days: 21, label: "BCRA weekly balance: exchange rate (pesos per USD)"}
  - {id: "bcracot:CNY",     source: bcra_fx, frequency: D, measure: index, label: "BCRA quote: US dollars per yuan"}
  # Hand-kept files (data/manual/*.csv, with sources): the China swap amount
