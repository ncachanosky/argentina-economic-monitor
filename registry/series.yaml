  - id: fiscal_interest
    topic: fiscal
    wide: true
    kind: contributions
    measure: flow
    title: Interest on the Debt, Paid and Capitalized
    short_title: Interest, paid and capitalized
    description: >-
      Interest the budget records (paid in cash, net of interest between
      public agencies) and the interest it does not: interest capitalized
      into the principal of peso letters and bonds (LECAP, BONCAP). As a
      share of GDP, last twelve months. Since December 2021.
    source: derived
    source_label: Secretaría de Hacienda (IMIG); Secretaría de Finanzas (monthly debt bulletin); BCRA; INDEC
    frequency: M
    units: "% of GDP, last 12 months"
    ranges: [5Y, Max]
    note: >-
      The budget is on a cash basis. A capitalizing letter (LECAP, BONCAP)
      pays its accrued interest at maturity together with the principal, and
      that payment is recorded as amortization, below the line, so it never
      appears as interest. Capitalized interest, estimated: the stock of
      LECAP and BONCAP at the end of the previous month (monthly debt
      bulletin), in pesos, times the average monthly yield (TEM) at which
      fixed-rate LECAP and BONCAP were placed in the last six months
      (implied by their issue prices, weighted by cash raised). The
      Finance Secretariat's own "capitalization" line is not used: it also
      books the interest already accrued on securities sold in reopenings,
      which the buyer paid for in cash (large in 2025, with the end of the
      LEFI). See Inflation Adjustment of CER-Linked Debt for the indexed debt.
      Biases: it covers gross debt, including securities
      held by the BCRA, the pension fund (FGS) and Banco Nación, which
      overstates what is owed outside the public sector; TAMAR-linked
      BONCAP are taken at the fixed-rate average; and the interest on the
      LEFI (July 2024 - July 2025) and on letters sold at a discount is
      left out, which understates it.
    contributions:
      precomputed: true
      total_label: Accrual-adjusted interest
      units: "% of GDP"
      suffix: "% GDP"
      groups:
        - {key: cash,        label: Paid (in the budget),   add: [cash],        color: slate}
        - {key: capitalized, label: Capitalized interest (estimate), add: [capitalized], color: copper}
    yearly: {how: december}
    method_links: [{anchor: capitalized-interest, label: "How capitalized interest is estimated"}]
    default: {variant: cash, transform: level, range: Max}
    derive:
      method: formula
      anchor: cerstock
      start: "2021-12-01"
      vars: &interest
        intr: 379.9_GTOS_CORR_017__40_84
        fin: 379.9_RESULTADO_017__18_38
        cap: "fin:a1|lecap"
        bcap: "fin:a1|boncap"
        tem: "fin:col|tem_fixed"
        po: "fin:a3|pesos_other"
        adv: "fin:a1|advances"
        cerstock: "fin:a3|pesos_cer"
        fx: "bcra:5"
        cer: "bcra:30"
        gdp: 4.4_OGP_2004_T_17
        cpi: 148.3_INIVELNAL_DICI_M_26
      variants:
        cash:        {label: Paid,           expr: "100 * sum12(intr) / gdp12(gdp, cpi)"}
        capitalized: {label: Capitalized,    expr: "100 * sum12(lag((nz(cap) + nz(bcap)) * fx, 1) * nz(tem) / 100) / gdp12(gdp, cpi)"}

  - id: fiscal_balance_adjusted
    topic: fiscal
    kind: variants
    overlay: true
    measure: rate
    validate_as: flow
    title: "Financial Balance: Cash, Accrual and Operational"
    short_title: Adjusted balance
    description: >-
      The official financial balance (cash); the balance if capitalized
      interest were recorded when it accrues; and the operational balance,
      which also credits the government with the erosion of its fixed-rate
      peso debt by inflation. Share of GDP, last twelve months.
    source: derived
    source_label: Secretaría de Hacienda (IMIG); Secretaría de Finanzas; BCRA; INDEC
    frequency: M
    units: "% of GDP, last 12 months"
    transforms: [level]
    ranges: [5Y, Max]
    note: >-
      Estimates, not official measures. Accrual: the official balance minus
      capitalized interest (see Interest on the Debt, Paid and Capitalized).
      Operational: the accrual balance plus the inflation component of
      interest on peso debt that is not indexed (each month's CPI inflation
      times the stock at the end of the previous month, excluding the BCRA's
      temporary advances); the CER adjustment of indexed debt is left out of
      both, as compensation for inflation. In high inflation the operational
      balance can show a surplus while the cash balance shows a deficit: the
      difference is the inflation tax paid by holders of peso debt, not
      fiscal effort.
    method_links: [{anchor: capitalized-interest, label: "How capitalized interest is estimated"}, {anchor: operational-balance, label: "The operational balance"}]
    default: {variant: official, transform: level, range: Max}
    derive:
      method: formula
      anchor: cerstock
      start: "2021-12-01"
      vars: *interest
      variants:
        official: {label: Official (cash),                expr: "100 * sum12(fin) / gdp12(gdp, cpi)"}
        adjusted: {label: Minus capitalized interest,     expr: "100 * (sum12(fin) - sum12(lag((nz(cap) + nz(bcap)) * fx, 1) * nz(tem) / 100)) / gdp12(gdp, cpi)"}
        operational: {label: "Operational (inflation-corrected)", expr: "100 * (sum12(fin) - sum12(lag((nz(cap) + nz(bcap)) * fx, 1) * nz(tem) / 100) + sum12(lag((po - nz(adv)) * fx, 1) * (cpi / lag(cpi, 1) - 1))) / gdp12(gdp, cpi)"}

  - id: fiscal_cer_adjustment
    topic: fiscal
    kind: variants
    measure: rate
    validate_as: flow
    plain_level: true
    title: Inflation Adjustment of CER-Linked Debt
    short_title: CER adjustment
    description: >-
      The increase in the principal of inflation-indexed (CER) peso debt from
      the CER adjustment, which is paid at maturity and never recorded as
      interest. Share of GDP, last twelve months. Since December 2019.
    source: derived
    source_label: Secretaría de Finanzas (monthly debt bulletin); BCRA; INDEC
    frequency: M
    units: "% of GDP, last 12 months"
    transforms: [level]
    ranges: [5Y, Max]
    note: >-
      The CER-linked stock at the end of the previous month, in pesos, times
      the month's change in the CER. Mostly compensation for inflation, not a
      real cost: with inflation above 200% (2023-24) it was well over 10% of
      GDP, while inflation eroded the real value of fixed-rate peso debt by
      a comparable order. It belongs in an inflation-corrected (operational)
      balance only together with that erosion, so it is shown apart from
      interest. Covers gross debt, including bonds held by the BCRA, the
      pension fund (FGS) and Banco Nación.
    method_links: [{anchor: cer-adjustment, label: "How the CER adjustment is calculated"}]
    default: {variant: cer, transform: level, range: Max}
    derive:
      method: formula
      anchor: cerstock
      start: "2019-12-01"
      vars: *interest
      variants:
        cer: {label: CER adjustment, expr: "100 * sum12(lag(cerstock * fx, 1) * (cer / lag(cer, 1) - 1)) / gdp12(gdp, cpi)"}

  - id: debt_stock
    topic: fiscal
    wide: true
    kind: contributions
    measure: flow
    title: Gross Debt by Currency
    short_title: Debt by currency
    description: >-
      Gross debt of the central administration in normal payment status, by
      currency, billions of US dollars at each month's exchange rates.
      Monthly, since January 2019.
    source: derived
    source_label: Secretaría de Finanzas (monthly debt bulletin)
    frequency: M
    units: Billions of US dollars
    ranges: [5Y, Max]
    note: >-
      Includes debt held by the BCRA, the pension fund (FGS) and other public
      agencies (non-transferable letters, temporary advances). Peso debt in
      dollars moves with the exchange rate: a devaluation lowers it. SDR debt
      is mostly with the IMF. Excludes debt not presented to the 2005, 2010
      and 2020 exchanges.
    contributions:
      precomputed: true
      hide_total: true
      style: area
      units: "US$ bn"
      suffix: " bn"
      groups:
        - {key: pesos_other, label: "Pesos, not indexed", add: [pesos_other], color: copper}
        - {key: pesos_cer,   label: "Pesos, CER-linked",  add: [pesos_cer],   color: gold}
        - {key: usd,         label: US dollars,           add: [usd],         color: sky}
        - {key: sdr,         label: SDR (mostly IMF),     add: [sdr],         color: rose}
        - {key: other,       label: Euros and other,      add: [other],       color: neutral}
    default: {variant: usd, transform: level, range: Max}
    derive:
      method: formula
      anchor: usd
      vars:
        po: "fin:a3|pesos_other"
        pc: "fin:a3|pesos_cer"
        usd: "fin:a3|usd"
        eur: "fin:a3|eur"
        jpy: "fin:a3|jpy"
        sdr: "fin:a3|sdr"
        oth: "fin:a3|other"
      variants:
        pesos_other: {label: "Pesos, not indexed", expr: "po / 1000"}
        pesos_cer:   {label: "Pesos, CER-linked",  expr: "pc / 1000"}
        usd:         {label: US dollars,           expr: "usd / 1000"}
        sdr:         {label: SDR,                  expr: "sdr / 1000"}
        other:       {label: Other currencies,     expr: "(nz(eur) + nz(jpy) + nz(oth)) / 1000"}

  - id: debt_gdp
    topic: fiscal
    wide: true
    kind: contributions
    measure: flow
    title: Gross Debt as a Share of GDP
    short_title: Debt / GDP
    description: >-
      Gross debt of the central administration in normal payment status, by
      currency, as a share of GDP: the stock at the end of each month, at
      that month's exchange rate, over GDP of the last twelve months.
      Monthly, since January 2019.
    source: derived
    source_label: Secretaría de Finanzas (monthly debt bulletin); BCRA; INDEC
    frequency: M
    units: "% of GDP"
    ranges: [5Y, Max]
    note: >-
      Debt valued at the wholesale exchange rate of the last day of the
      month (the Finance Secretariat's own convention, "TC fin del
      período"), so a devaluation raises the ratio at once while GDP adjusts
      over the following year (early 2024). Gross debt includes debt held by
      the BCRA, the pension fund (FGS) and other public agencies; see Who
      Holds the Debt. Excludes debt not presented to the 2005, 2010 and 2020
      exchanges.
    method_links: [{anchor: debt-gdp, label: "How debt / GDP is calculated"}]
    contributions:
      precomputed: true
      total_label: Gross debt
      units: "% of GDP"
      suffix: "% GDP"
      groups:
        - {key: pesos_other, label: "Pesos, not indexed", add: [pesos_other], color: copper}
        - {key: pesos_cer,   label: "Pesos, CER-linked",  add: [pesos_cer],   color: gold}
        - {key: fx,          label: Foreign currency,     add: [fx],          color: sky}
    yearly: {how: december}
    default: {variant: fx, transform: level, range: Max}
    derive:
      method: formula
      anchor: usd
      vars: &debtgdp
        po: "fin:a3|pesos_other"
        pc: "fin:a3|pesos_cer"
        usd: "fin:a3|usd"
        eur: "fin:a3|eur"
        jpy: "fin:a3|jpy"
        sdr: "fin:a3|sdr"
        oth: "fin:a3|other"
        pub: "fin:hold|public"
        prv: "fin:hold|private"
        tot: "fin:hold|total"
        fx: "bcra:5"
        gdp: 4.4_OGP_2004_T_17
        cpi: 148.3_INIVELNAL_DICI_M_26
      variants:
        pesos_other: {label: "Pesos, not indexed", expr: "100 * po * fx / gdp12(gdp, cpi)"}
        pesos_cer:   {label: "Pesos, CER-linked",  expr: "100 * pc * fx / gdp12(gdp, cpi)"}
        fx:          {label: Foreign currency,     expr: "100 * (usd + nz(eur) + nz(jpy) + nz(sdr) + nz(oth)) * fx / gdp12(gdp, cpi)"}

  - id: debt_holders
    topic: fiscal
    wide: true
    kind: contributions
    measure: flow
    title: Who Holds the Debt
    short_title: Debt by holder
    description: >-
      Gross debt by holder as a share of GDP, at the end of each quarter:
      public-sector agencies (the BCRA, the pension fund and others), the
      private sector, and multilateral and bilateral lenders. Since 2019.
    source: derived
    source_label: Secretaría de Finanzas (quarterly debt presentation); BCRA; INDEC
    frequency: M
    units: "% of GDP"
    ranges: [5Y, Max]
    note: >-
      Public-sector agencies: securities, loans and advances held by
      national public bodies (the BCRA's non-transferable letters and
      advances, the pension fund's bonds, Banco Nación and others). Private
      sector: as the Finance Secretariat computes it, the rest after
      public agencies and multilateral and bilateral lenders. Multilateral
      and bilateral: the IMF, IDB, World Bank, CAF and others and the Paris
      Club. Excludes about US$2.4 billion of debt eligible for but not
      presented to the restructurings. Only the private and multilateral
      parts are owed outside the state. Quarter ends; valued at the exchange
      rate of the quarter's last day. A few quarters are missing where the
      presentation's table could not be read.
    method_links: [{anchor: debt-gdp, label: "How debt / GDP is calculated"}]
    contributions:
      precomputed: true
      total_label: Gross debt
      units: "% of GDP"
      suffix: "% GDP"
      groups:
        - {key: public,  label: Public-sector agencies,          add: [public],  color: slate}
        - {key: private, label: Private sector,                  add: [private], color: copper}
        - {key: multi,   label: Multilateral and bilateral,      add: [multi],   color: sage}
    yearly: {how: december}
    default: {variant: private, transform: level, range: Max}
    derive:
      method: formula
      anchor: tot
      vars: *debtgdp
      variants:
        public:  {label: Public-sector agencies,     expr: "100 * pub * fx / gdp12(gdp, cpi)"}
        private: {label: Private sector,             expr: "100 * prv * fx / gdp12(gdp, cpi)"}
        multi:   {label: Multilateral and bilateral, expr: "100 * (tot - pub - prv) * fx / gdp12(gdp, cpi)"}

  - id: treasury_deposits
    topic: fiscal
    kind: variants
    overlay: true
    measure: flow
    plain_level: true
    title: Treasury Deposits at the BCRA
    short_title: Treasury deposits
    description: >-
      Deposits of the Treasury and other official accounts at the central
      bank, in pesos and in foreign currency (valued in pesos), at the end
      of each month. The cash the Treasury draws on when it pays maturities
      without rolling them over. Can be shown in pesos of the latest month.
    source: derived
    source_label: BCRA (balance sheet, monthly)
    frequency: M
    units: Millions of pesos
    transforms: [level]
    ranges: [2Y, 5Y, 10Y, Max]
    deflate_with: {indicator: cpi_long, variant: corrected, label: CPI}
    yearly: {how: december}
    note: >-
      Official deposits in the BCRA's balance sheet (the Treasury's accounts
      and those of other national public bodies); foreign currency: the
      Treasury's deposits in dollars, at the balance sheet's exchange rate;
      pesos: the rest. End of month. Compare with peso maturities in Debt
      Maturities and with the rollover ratio.
    default: {variant: pesos, transform: level, range: 5Y}
    derive:
      method: formula
      anchor: tot
      vars:
        tot: "bcrabal:105"
        fxd: "bcrabal:107"
      variants:
        pesos: {label: In pesos,            expr: "(tot - nz(fxd)) / 1000"}
        fx:    {label: In foreign currency, expr: "nz(fxd) / 1000"}

  - id: debt_schedule
    topic: fiscal
    kind: schedule
    wide: true
    title: Debt Maturities
    short_title: Maturities
    description: >-
      Capital and interest falling due in each of the next eighteen months
      and each year ahead, by type of debt, millions of US dollars. From the
      Finance Secretariat's latest quarterly report.
    source: table
    source_label: Secretaría de Finanzas (quarterly debt report)
    frequency: Q
    units: Millions of US dollars
    default: {}
    table:
      source: finanzas
      file: schedule.json
      status_id: "fin:a5|total"
      source_url: https://www.argentina.gob.ar/economia/finanzas/datos-trimestrales-de-la-deuda
    note: >-
      Debt in normal payment status at the report's date, valued at that
      date's exchange rates, with peso debt converted to dollars (a later
      depreciation shrinks it). Capitalizing peso letters (LECAP, BONCAP) pay
      their interest with the principal, so it shows as capital. Most peso
      maturities are rolled over at auctions, and the BCRA's advances and
      non-transferable letters are owed within the public sector; foreign-
      currency bonds and the IMF are the payments that need dollars.
      Projected interest on floating-rate and CER-linked debt uses the rates
      and index of the report's date. Debt issued after that date (new
      short-term letters, above all) is not in the profile, so what is
      actually paid in the first months usually exceeds it; months already
      past show what was paid (all debt, monthly bulletin).

  - id: debt_service_fx
    topic: fiscal
    wide: true
    kind: contributions
    measure: flow
    title: Debt Payments in Foreign Currency
    short_title: FX debt payments
    description: >-
      Capital and interest the central administration paid in foreign
      currency each month: bonds and other debt, the IMF, and other
      multilaterals (IDB, World Bank, CAF). Millions of US dollars, since
      January 2019.
    source: derived
    source_label: Secretaría de Finanzas (monthly debt bulletin)
    frequency: M
    units: Millions of US dollars
    ranges: [2Y, 5Y, Max]
    note: >-
      Payments as recorded, including those to public agencies (interest on
      the BCRA's non-transferable letters). The big months are January and
      July, when the Globales and Bonares issued in the 2020 restructuring
      pay. Most of the May 2025 spike is the Treasury's redemption of
      non-transferable letters held by the BCRA. Other multilaterals: the IDB, the World Bank (IBRD) and CAF;
      smaller lenders are in "Bonds and other".
    contributions:
      precomputed: true
      total_label: Total paid in foreign currency
      units: "US$ m"
      suffix: " m"
      groups:
        - {key: bonds_cap, label: "Bonds and other: capital",  add: [bonds_cap], color: sky}
        - {key: bonds_int, label: "Bonds and other: interest", add: [bonds_int], color: lavender}
        - {key: imf,       label: IMF,                         add: [imf],       color: rose}
        - {key: ifis,      label: Other multilaterals,         add: [ifis],      color: sage}
    default: {variant: bonds_cap, transform: level, range: 5Y}
    derive:
      method: formula
      anchor: fc
      vars:
        fc: "fin:a5|fx_capital"
        fi: "fin:a5|fx_interest"
        ic: "fin:a5|imf_capital"
        ii: "fin:a5|imf_interest"
        bc: "fin:a5|idb_capital"
        bi: "fin:a5|idb_interest"
        wc: "fin:a5|wb_capital"
        wi: "fin:a5|wb_interest"
        cc: "fin:a5|caf_capital"
        ci: "fin:a5|caf_interest"
      variants:
        bonds_cap: {label: "Bonds and other: capital",  expr: "fc - nz(ic) - nz(bc) - nz(wc) - nz(cc)"}
        bonds_int: {label: "Bonds and other: interest", expr: "fi - nz(ii) - nz(bi) - nz(wi) - nz(ci)"}
        imf:       {label: IMF,                         expr: "nz(ic) + nz(ii)"}
        ifis:      {label: Other multilaterals,         expr: "nz(bc) + nz(bi) + nz(wc) + nz(wi) + nz(cc) + nz(ci)"}

  - id: debt_rollover
    topic: fiscal
    kind: variants
    measure: rate
    validate_as: flow
    title: Rollover of Peso Debt
    short_title: Rollover
    description: >-
      Peso marketable securities issued over those falling due, percent:
      above 100, the Treasury raised net financing in pesos; below 100, it
      paid down peso debt with its own cash. Monthly, since January 2019.
    source: derived
    source_label: Secretaría de Finanzas (monthly debt bulletin)
    frequency: M
    units: "% of maturities"
    transforms: [level]
    plain_level: true
    ranges: [2Y, 5Y, Max]
    note: >-
      Issuance and amortization of peso-denominated bonds and letters (LECAP,
      BONCAP, BONCER, LECER, BONTE, duals and others), valued in dollars on
      the day of each operation. Excludes letters placed with public agencies,
      the LEFI (a BCRA liquidity operation, July 2024 - July 2025) and dollar
      and dollar-linked instruments. Swaps count on both sides, pulling the
      ratio toward 100. Amortizations include the capitalized interest paid
      at maturity. Peso debt bought by public agencies counts as issuance.
    yearly: {how: december, variants: [y12]}
    ref_line: 100
    default: {variant: m3, transform: level, range: 5Y}
    derive:
      method: formula
      anchor: amo
      vars:
        iss: "fin:a4|peso_mkt_issued"
        amo: "fin:a4|peso_mkt_amortized"
      variants:
        monthly: {label: Single month,           expr: "100 * iss / amo", max: "1000 + 0 * amo"}
        m3:      {label: Last three months,      expr: "100 * (iss + lag(iss, 1) + lag(iss, 2)) / (amo + lag(amo, 1) + lag(amo, 2))"}
        y12:     {label: Last twelve months,     expr: "100 * sum12(iss) / sum12(amo)"}

  - id: placements_mix
    topic: fiscal
    wide: true
    kind: contributions
    measure: flow
    title: What the Treasury Places
    short_title: Placements by type
    description: >-
      Cash raised each month in Treasury bonds and letters, by type of
      instrument, as a share of the month's total. Since January 2021.
    source: derived
    source_label: Secretaría de Finanzas (colocaciones de deuda)
    frequency: M
    units: "% of cash raised"
    ranges: [2Y, 5Y, Max]
    note: >-
      Market placements of bonds and letters (auctions and their second
      rounds, and direct placements), at their cash value; dollar and
      dollar-linked placements converted at the month's average wholesale
      rate. Excludes letters placed with public agencies, swaps and
      conversions. Dual: bonds that pay the better of two adjustments (CER
      or the official exchange rate in 2022-2023; a fixed rate or TAMAR
      since 2025).
    contributions:
      precomputed: true
      hide_total: true
      style: area
      units: "%"
      groups:
        - {key: fixed,    label: Fixed-rate pesos,              add: [fixed],    color: copper}
        - {key: cer,      label: CER-linked,                    add: [cer],      color: gold}
        - {key: floating, label: "Floating (TAMAR, BADLAR)",    add: [floating], color: sage}
        - {key: dual,     label: Dual,                          add: [dual],     color: lavender}
        - {key: dlinked,  label: Dollar-linked (paid in pesos), add: [dlinked],  color: teal}
        - {key: usd,      label: Hard dollar,                   add: [usd],      color: sky}
    default: {variant: fixed, transform: level, range: Max}
    derive:
      method: formula
      anchor: fx_
      vars:
        fx_: "fin:col|fixed"
        cr: "fin:col|cer"
        fl: "fin:col|floating"
        du: "fin:col|dual"
        dl: "fin:col|dlinked"
        hd: "fin:col|usd"
        dla: "fin:col|dlinked_ars"
        hda: "fin:col|usd_ars"
        fxa: "@fx_official:wholesale:avg"
      variants:
        fixed:    {label: Fixed-rate pesos, expr: "100 * nz(fx_) / (nz(fx_) + nz(cr) + nz(fl) + nz(du) + (nz(dl) + nz(hd)) * fxa + nz(dla) + nz(hda))"}
        cer:      {label: CER-linked,       expr: "100 * nz(cr) / (nz(fx_) + nz(cr) + nz(fl) + nz(du) + (nz(dl) + nz(hd)) * fxa + nz(dla) + nz(hda))"}
        floating: {label: Floating,         expr: "100 * nz(fl) / (nz(fx_) + nz(cr) + nz(fl) + nz(du) + (nz(dl) + nz(hd)) * fxa + nz(dla) + nz(hda))"}
        dual:     {label: Dual,             expr: "100 * nz(du) / (nz(fx_) + nz(cr) + nz(fl) + nz(du) + (nz(dl) + nz(hd)) * fxa + nz(dla) + nz(hda))"}
        dlinked:  {label: Dollar-linked,    expr: "100 * (nz(dl) * fxa + nz(dla)) / (nz(fx_) + nz(cr) + nz(fl) + nz(du) + (nz(dl) + nz(hd)) * fxa + nz(dla) + nz(hda))"}
        usd:      {label: Hard dollar,      expr: "100 * (nz(hd) * fxa + nz(hda)) / (nz(fx_) + nz(cr) + nz(fl) + nz(du) + (nz(dl) + nz(hd)) * fxa + nz(dla) + nz(hda))"}

  - id: placements_life
    topic: fiscal
    kind: variants
    measure: flow
    title: Average Life of New Peso Placements
    short_title: Life of placements
    description: >-
      Average life of the peso bonds and letters placed each month, in
      years, weighted by cash raised. A longer life spreads out future
      maturities. Since January 2021.
    source: finanzas
    source_label: Secretaría de Finanzas (colocaciones de deuda)
    frequency: M
    units: Years
    transforms: [level]
    plain_level: true
    ranges: [2Y, 5Y, Max]
    note: >-
      Peso instruments (fixed-rate, CER-linked, floating and dual); average
      life as the Finance Secretariat reports it for amortizing bonds, time
      to maturity for bullet bonds and letters. One long bond placed in a
      month can move the average a lot.
    variants:
      life: {label: Average life, id: "fin:col|life"}
    default: {variant: life, transform: level, range: Max}

  - id: treasury_placements
    topic: fiscal
    kind: placements
    wide: true
    title: Treasury Auctions and Placements
    short_title: Auction results
    description: >-
      Every bond and letter placed on each settlement date: instrument, type,
      amounts, issue price and the yield implied by the price (nominal for
      fixed-rate letters and bonds, real for CER-linked ones). Since January
      2021.
    source: table
    source_label: Secretaría de Finanzas (colocaciones de deuda)
    frequency: D
    units: Millions of pesos (US$ for dollar instruments)
    default: {}
    table:
      source: finanzas
      file: placements/index.json
      status_id: "fin:col|fixed"
      source_url: https://www.argentina.gob.ar/economia/finanzas/deudapublica/colocacionesdedeuda
    note: >-
      One settlement date usually is one auction (with its second round a
      day later). The file lists what was placed, not what was offered or
      what fell due, so it does not give each auction's rollover; see Rollover
      of Peso Debt for the monthly ratio. Implied yield for capitalizing
      fixed-rate instruments (LECAP, BONCAP) and discount letters: the
      payoff at maturity (face value capitalized at the instrument's monthly
      rate, actual days / 30) over the issue price, as an effective monthly
      rate (TEM) and an effective annual rate (TEA). Real yield, for
      zero-coupon CER-linked letters and bonds: the effective annual yield
      over inflation implied by the issue price and the CER from issue to
      settlement. Recent months are preliminary.


  # ---------------- Exchange rate ----------------

  - id: fx_market_rates
    topic: fx
    wide: true
    kind: variants
    overlay: true
    log_level: true
    title: Official and Market Exchange Rates
    short_title: Market rates
    description: >-
      Pesos per US dollar: the official wholesale rate, the MEP and CCL
      rates implied by bond trades, the informal ("blue") rate, the card
      rate and the crypto dollar. Daily, selling prices.
    source: derived
    source_label: BCRA (official); ArgentinaDatos and DolarAPI (market rates, unofficial)
    frequency: D
    units: Pesos per US dollar
    transforms: [level, yoy]
    ranges: [2Y, 5Y, 10Y, Max]
    caveat: >-
      Market rates other than the official one are unofficial: they are
      compiled from quotes in the financial press by two community data
      projects (ArgentinaDatos and DolarAPI), checked against each other on
      each update. Treat single days with care.
    note: >-
      MEP (mercado electrónico de pagos): pesos per dollar implied by buying
      a bond in pesos and selling it for dollars in Argentina; CCL (contado
      con liquidación): the same with dollars delivered abroad. Blue: the
      informal street market. Card (tarjeta): the official retail rate plus
      the taxes on card purchases abroad. Crypto: dollar stablecoins bought
      with pesos. Gaps between them were large while exchange controls
      (cepo) were in force (September 2011 - December 2015 and September
      2019 - April 2025).
    method_links: [{anchor: fx-market, label: "About market exchange rates"}]
    default: {variant: official, transform: level, range: 5Y}
    derive:
      method: formula
      vars: {ofx: "bcra:5", mep: "dolar:mep", ccl: "dolar:ccl", blue: "dolar:blue", card: "dolar:tarjeta", cry: "dolar:cripto"}
      variants:
        official: {label: Official (wholesale), expr: "ofx"}
        mep:      {label: MEP,                  expr: "mep"}
        ccl:      {label: CCL,                  expr: "ccl"}
        blue:     {label: Blue (informal),      expr: "blue"}
        card:     {label: Card (tarjeta),       expr: "card"}
        crypto:   {label: Crypto,               expr: "cry"}

  - id: fx_band_room
    topic: fx
    kind: variants
    measure: rate
    validate_as: flow
    plain_level: true
    title: Room to the Band's Ceiling
    short_title: Room to ceiling
    description: >-
      How much the official rate could rise before reaching the ceiling of
      the band, where the BCRA must sell dollars: the ceiling over the
      official wholesale rate, minus one, percent. Daily.
    source: derived
    source_label: BCRA
    frequency: D
    units: "% below the ceiling"
    transforms: [level]
    ranges: [2Y, Max]
    ref_line: 0
    note: >-
      Zero means the rate is at the ceiling. The room grows by itself as the
      band widens; it shrinks when the peso depreciates faster than the
      ceiling rises.
    method_links: [{anchor: fx-band, label: "About the band"}]
    default: {variant: room, transform: level, range: Max}
    derive:
      method: formula
      anchor: ofx
      vars: {ofx: "bcra:5", hi: "bcra:1188"}
      start: "2025-04-14"
      variants:
        room: {label: Room to the ceiling, expr: "100 * (hi / ofx - 1)"}

  - id: fx_gaps
    topic: fx
    wide: true
    kind: variants
    overlay: true
    measure: rate
    validate_as: flow
    plain_level: true
    title: Gaps Over the Official Rate
    short_title: Exchange-rate gaps
    description: >-
      How much more pesos the MEP, CCL and informal dollars cost than the
      official wholesale rate, percent. Daily.
    source: derived
    source_label: BCRA; ArgentinaDatos and DolarAPI (unofficial)
    frequency: D
    units: "% over the official rate"
    transforms: [level]
    ranges: [2Y, 5Y, 10Y, Max]
    yearly: {how: december}
    ref_line: 0
    note: >-
      Each rate over the official wholesale rate (Communication A 3500) of
      the same day, minus one. The gap measures how binding exchange controls
      are and how far the market expects the official rate to move. Market
      rates are unofficial (see Official and Market Exchange Rates). Yearly
      view: the last day of each year.
    default: {variant: ccl, transform: level, range: 10Y}
    derive:
      method: formula
      vars: {ofx: "bcra:5", mep: "dolar:mep", ccl: "dolar:ccl", blue: "dolar:blue"}
      variants:
        ccl:  {label: CCL,             expr: "100 * (ccl / ofx - 1)"}
        mep:  {label: MEP,             expr: "100 * (mep / ofx - 1)"}
        blue: {label: Blue (informal), expr: "100 * (blue / ofx - 1)"}

  - id: fx_carry
    topic: fx
    kind: variants
    overlay: true
    measure: rate
    validate_as: flow
    plain_level: true
    title: Carry Trade Return in Dollars
    short_title: Carry trade
    description: >-
      What a dollar earned by being converted to pesos, held in 30-day time
      deposits rolled over each month, and converted back: the return over
      the last twelve months, in dollars, percent. Monthly.
    source: derived
    source_label: BCRA; ArgentinaDatos and DolarAPI (MEP, unofficial)
    frequency: M
    units: "% in dollars, last 12 months"
    transforms: [level]
    ranges: [5Y, 10Y, Max]
    yearly: {how: december}
    ref_line: 0
    note: >-
      Each month: the 30-day time-deposit rate at the end of the previous
      month (annual nominal rate, accrued for 30 days) times the change in
      the exchange rate over the month (end of month to end of month),
      compounded over twelve months. Official: in and out at the wholesale
      rate, which most savers could not do under exchange controls. MEP: in
      and out at the MEP rate, a route open to individuals. Before taxes and
      fees. Positive: pesos paid more than the depreciation.
    default: {variant: official, transform: level, range: Max}
    derive:
      method: formula
      anchor: dep
      start: "2003-12-01"
      vars: {dep: "bcra:12", ofx: "bcra:5", mep: "dolar:mep"}
      variants:
        official: {label: Official rate, expr: "cum12(100 * ((1 + lag(dep, 1) / 100 * 30 / 365) * lag(ofx, 1) / ofx - 1))"}
        mep:      {label: MEP rate,      expr: "cum12(100 * ((1 + lag(dep, 1) / 100 * 30 / 365) * lag(mep, 1) / mep - 1))"}

  - id: fx_devaluation
    topic: fx
    wide: true
    kind: variants
    overlay: true
    measure: rate
    validate_as: flow
    plain_level: true
    title: Expected and Actual Devaluation
    short_title: Expected devaluation
    description: >-
      Four estimates of the depreciation of the official rate expected over
      the next twelve months, against what then happened: the BCRA's survey
      of analysts, the devaluation priced in Treasury auctions, interest
      parity and dollar futures. Annual %, monthly.
    source: derived
    source_label: BCRA (REM, exchange rate); Secretaría de Finanzas (placements); US Treasury; A3 Mercados (futures)
    frequency: M
    units: "% over 12 months"
    transforms: [level]
    ranges: [5Y, Max]
    note: >-
      Survey: the median expected official rate twelve months ahead in the
      BCRA's market expectations survey (REM) over the month's average
      official rate. Auctions: on days the Treasury sells a fixed-rate peso
      letter and a dollar-linked one of similar maturity, the devaluation
      that makes both pay the same, annualized (month's average). Interest
      parity: the month's average yield on fixed-rate Treasury letters (TEA)
      over the US Treasury 52-week bill yield; it includes any risk premium,
      so it overstates expected devaluation when holding pesos is risky.
      Futures: the twelve-month dollar-futures price over the official rate
      at the end of the month (A3 Mercados, from 2020).
      Actual: the change in the official rate over the following twelve
      months, known only a year later.
    method_links: [{anchor: fx-devaluation, label: "How devaluation expectations are measured"}]
    default: {variant: survey, transform: level, range: 5Y}
    derive:
      method: formula
      vars: {rem: "rem:fx12", offa: "@fx_official:wholesale:avg", ofx: "bcra:5", f12: "a3:f12", be: "fin:col|breakeven", tea: "fin:col|tea_fixed_m", ust: "ust:52w"}
      variants:
        survey:   {label: Survey (REM),          expr: "100 * (rem / offa - 1)"}
        auctions: {label: Auctions (breakeven),  expr: "be"}
        parity:   {label: Interest parity,       expr: "100 * ((1 + tea / 100) / (1 + ust / 100) - 1)"}
        futures:  {label: Futures (A3),          expr: "100 * (f12 / ofx - 1)"}
        actual:   {label: "Actual, next 12 months", expr: "100 * (lag(offa, -12) / offa - 1)"}

  - id: fx_futures_curve
    topic: fx
    kind: curve
    wide: true
    title: Dollar Futures Curve
    short_title: Futures curve
    description: >-
      The price of the dollar for each future month as traded on the
      exchange (settlement prices of the DLR contracts), today and one and
      three months earlier, against today's official rate and the band's
      ceiling.
      Pesos per US dollar.
    source: table
    source_label: A3 Mercados (market data, not an official statistic)
    frequency: D
    units: Pesos per US dollar
    default: {}
    table:
      source: a3
      file: curve.json
      status_id: "a3:f6"
      source_url: https://www.a3mercados.com.ar/
    note: >-
      Each contract settles at the BCRA's wholesale rate (Communication A
      3500) of its expiry month's last business day, in pesos, so its price
      is the market's expected rate for that date plus a risk premium. The
      band's ceiling is projected at the pace of its last three months: an
      illustration, not the BCRA's announced path. The floor, far below, is
      left out of the chart.
    method_links: [{anchor: fx-futures, label: "About dollar futures"}]

  - id: fx_futures_implied
    topic: fx
    kind: variants
    overlay: true
    measure: rate
    validate_as: flow
    plain_level: true
    title: Devaluation Priced in Futures
    short_title: Futures devaluation
    description: >-
      The depreciation of the official rate implied by dollar futures: the
      futures price six and twelve months ahead over today's official rate,
      annual %, daily.
    source: derived
    source_label: A3 Mercados (market data); BCRA
    frequency: D
    units: "% a year"
    transforms: [level]
    ranges: [2Y, 5Y, Max]
    note: >-
      Each day the curve of settlement prices is interpolated (log-linearly
      in days to expiry) at 182 and 365 days. Six months: annualized by
      compounding. Twelve months: extrapolated from the two longest contracts
      when the curve stops short of a year (empty if it stops before ten
      months).
      Futures prices include a risk premium, so they are an upper estimate
      of the expected rate. Compounding six months to a year overstates the
      annual figure when the market expects a one-off jump (late 2023).
    method_links: [{anchor: fx-futures, label: "About dollar futures"}]
    default: {variant: m12, transform: level, range: 2Y}
    derive:
      method: formula
      anchor: ofx
      vars: {ofx: "bcra:5", f6: "a3:f6", f12: "a3:f12"}
      start: "2020-01-01"
      variants:
        m6:  {label: "6 months, annualized", expr: "100 * ((f6 / ofx) ** (365 / 182) - 1)"}
        m12: {label: "12 months",            expr: "100 * (f12 / ofx - 1)"}

  - id: fx_futures_oi
    topic: fx
    kind: variants
    title: Dollar Futures Open Interest
    short_title: Futures open interest
    description: >-
      Contracts outstanding across all dollar-futures maturities, millions
      of US dollars (US$1,000 a contract), daily.
    source: a3
    source_label: A3 Mercados (market data, not an official statistic)
    frequency: D
    units: Millions of US dollars
    transforms: [level, yoy]
    ranges: [2Y, 5Y, Max]
    note: >-
      The size of the market's open bets on the peso. The BCRA has at times
      sold futures itself to hold down expectations (in late 2015 and again
      in 2025, for instance); its positions are part of this total.
    method_links: [{anchor: fx-futures, label: "About dollar futures"}]
    variants:
      oi: {label: Open interest, id: "a3:oi"}
    default: {variant: oi, transform: level, range: 2Y}

  - id: fx_bcra_purchases
    topic: fx
    wide: true
    kind: contributions
    measure: flow
    title: BCRA Purchases of Foreign Currency
    short_title: BCRA purchases
    description: >-
      The central bank's net purchases of foreign currency in the market,
      millions of US dollars, by month. Daily data summed.
    source: derived
    source_label: BCRA
    frequency: M
    units: Millions of US dollars
    ranges: [2Y, 5Y, 10Y, Max]
    note: >-
      The change in international reserves from the BCRA's purchases and
      sales of foreign currency (net purchases from the private sector and
      others; negative: net sales). Not included: the Treasury's own
      purchases in the market (block trades), published only as
      announcements, and the BCRA's positions in dollar futures. The current
      month is partial.
    contributions:
      precomputed: true
      hide_total: true
      units: "US$ m"
      suffix: " m"
      groups:
        - {key: purchases, label: Net purchases, add: [purchases], color: sky}
    yearly: {how: sum}
    default: {variant: purchases, transform: level, range: 5Y}
    derive:
      method: monthly
      variants:
        purchases: {label: Net purchases, sum_of: ["bcra:78"], how: sum}

  - id: fx_balance_cambiario
    topic: fx
    wide: true
    kind: contributions
    measure: flow
    title: Foreign-Exchange Market Flows (Balance Cambiario)
    short_title: Balance cambiario
    description: >-
      What moved through the foreign-exchange market each month, and the
      change in reserves it left: trade, services, income, purchases of
      dollars for holding by individuals and firms, official lenders and
      other financial flows. Millions of US dollars, since 2003.
    source: derived
    source_label: BCRA (Informe de Evolución del Mercado de Cambios y Balance Cambiario)
    frequency: M
    units: Millions of US dollars
    ranges: [2Y, 5Y, 10Y, Max]
    note: >-
      Cash flows through the foreign-exchange market (when dollars change
      hands, not when goods ship), as the BCRA records them. Goods: export
      receipts minus import payments. Income: interest, profits, dividends
      and transfers. Dollars for holding: net purchases of banknotes and
      foreign currency "with no specific purpose" (formation of external
      assets by individuals and firms; negative: net purchases). Official
      lenders: the IMF and other international and bilateral lenders. Other:
      the rest of the capital and financial accounts (direct and portfolio
      investment, loans and debt, government and other operations). The bars
      add up to the change in reserves from these transactions (the line).
    method_links: [{anchor: balance-cambiario, label: "About the balance cambiario"}]
    contributions:
      precomputed: true
      total: reserves
      total_label: Change in reserves from transactions
      units: "US$ m"
      suffix: " m"
      groups:
        - {key: goods,    label: Goods,                add: [goods],    color: copper}
        - {key: services, label: Services,             add: [services], color: sky}
        - {key: income,   label: Income,               add: [income],   color: lavender}
        - {key: holding,  label: Dollars for holding,  add: [holding],  color: rose}
        - {key: official, label: Official lenders,     add: [official], color: sage}
        - {key: other,    label: Other,                add: [other],    color: neutral}
    yearly: {how: sum}
    default: {variant: goods, transform: level, range: 5Y}
    derive:
      method: formula
      anchor: res
      vars: {goods: "bcrabc:goods", serv: "bcrabc:services", prim: "bcrabc:primary", sec: "bcrabc:secondary", cap: "bcrabc:capital",
             fin: "bcrabc:financial", hold: "bcrabc:cash_purchases", imf: "bcrabc:imf", ifis: "bcrabc:ifis", res: "bcrabc:reserves"}
      variants:
        goods:    {label: Goods,               expr: "goods"}
        services: {label: Services,            expr: "serv"}
        income:   {label: Income,              expr: "prim + sec"}
        holding:  {label: Dollars for holding, expr: "hold"}
        official: {label: Official lenders,    expr: "nz(imf) + nz(ifis)"}
        other:    {label: Other,               expr: "cap + fin - hold - nz(imf) - nz(ifis)"}
        reserves: {label: Change in reserves,  expr: "res"}
