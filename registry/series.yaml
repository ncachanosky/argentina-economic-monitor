  # ---------------- GDP & Demand (quarterly) ----------------
  - id: gdp
    topic: gdp
    wide: true
    kind: variants
    title: Gross Domestic Product (GDP)
    short_title: GDP
    description: >-
      Real GDP at constant 2004 prices. The seasonally adjusted series is the
      standard read on quarter-to-quarter momentum.
    release: pib
    source: datos_gob
    source_label: INDEC, via datos.gob.ar
    frequency: Q
    units: Index, 2004 = 100
    index_base: "2004"
    source_units: millions of 2004 pesos
    note: >-
      Levels shown as an index (2004 average = 100); source data are in
      millions of 2004 pesos ("All data" downloads them as published).
    variants:
      sa:       {label: Seasonally adjusted, id: 3.2_OGP_D_2004_T_17}
      original: {label: Original,            id: 4.2_OGP_2004_T_17}
    default: {variant: sa, transform: level, start: "2016-01"}
    headline: {variant: sa, transform: mom}
    # Yearly table: annual growth (average of the year's quarters, original
    # series), Q4/Q4 and the carryover into the next year (seasonally adjusted).
    annual_table: {accumulated: original, within_year: sa, carryover: true}

  - id: gdp_tracker
    topic: gdp
    wide: true
    kind: variants
    overlay: true
    title: Tracking the Current Quarter
    short_title: Quarter tracker
    description: >-
      Monthly activity (EMAE) averaged by quarter, next to quarterly GDP. The
      months already published show where the current quarter is heading
      before INDEC releases GDP.
    release: emae
    source: derived
    source_label: INDEC, via datos.gob.ar
    frequency: Q
    units: Index, 2004 = 100
    index_base: "2004"
    transforms: [mom, yoy, level]
    note: >-
      Seasonally adjusted series. The latest quarter's EMAE bar uses only the
      months published so far. INDEC reconciles EMAE with quarterly GDP, so
      once GDP is published the two agree; before that, EMAE is the earliest
      official reading of the quarter, and it is revised with each release.
    default: {variant: emae, transform: mom, start: "2024-07"}
    forecast:
      - {variant: gdp, rem: gdp, transform: mom, label: "REM expectation, GDP q/q s.a. (median)"}
    derive:
      method: tracker
      monthly_sa: 143.3_NO_PR_2004_A_31
      monthly_original: 143.3_NO_PR_2004_A_21
      quarterly: 3.2_OGP_D_2004_T_17
      variants:
        emae: {label: "EMAE, quarterly average"}
        gdp:  {label: GDP}

  - id: gdp_long
    topic: gdp
    wide: true
    kind: variants
    title: Real GDP since 1993
    short_title: GDP, long run
    description: >-
      INDEC's national accounts at 1993 prices (1993-2003) and 2004 prices
      (from 2004), chain-linked by their quarterly growth rates into one
      series. Original (not seasonally adjusted) data.
    release: pib
    source: derived
    source_label: INDEC, via datos.gob.ar (1993 and 2004 bases, chain-linked)
    frequency: Q
    units: Index, 2004 = 100
    index_base: "2004"
    transforms: [yoy, level]
    ranges: [10Y, 25Y, Max]
    yearly: {how: mean, growth: true}
    note: >-
      Growth through Q1 2004 comes from the 1993-base accounts and from Q2
      2004 from the 2004-base accounts; the level is that of the 2004 base.
      Rebasing changed measured growth in the overlapping years, so the
      splice is a growth-rate splice, not a revision of the 1993-2003 data.
    annual_table: {accumulated: original, within_year: original}
    default: {variant: original, transform: yoy, range: Max}
    derive:
      method: splice
      anchor: {id: 4.2_OGP_2004_T_17, date: "2004-01-01"}
      variants:
        original:
          label: Original
          segments:
            - {id: 2.2_OGP_1993_T_17, as: index, to: "2004-01-01"}
            - {id: 4.2_OGP_2004_T_17, as: index, from: "2004-04-01"}

  - id: gdp_demand
