# Argentina Economic Monitor — series registry
#
# Single source of truth for everything the site shows. To add a series,
# add an entry here; the pipeline, exports, and front end all read from it.
#
# Concepts
#   topic      a site section (Real Sector, Monetary, Trade, ...)
#   indicator  one chart card. It has one or more `variants` (original,
#              seasonally adjusted, trend-cycle, or sector components),
#              each mapped to a source series id.
#   kind       `variants`: mutually exclusive views of the same series
#              (toggle between them); `panel`: several components shown
#              together (e.g. EMAE by sector).
#
# Source ids for `datos_gob` were taken from the API's own search and
# metadata endpoints (apis.datos.gob.ar/series/api). Run
# `python -m pipeline.verify` to re-check every id against the live API.

site:
  title: Argentina Economic Monitor
  publisher: Economic Order
  publisher_url: ""   # TODO: Economic Order Substack URL (used for header link and subscribe button)
  repo_url: https://github.com/ncachanosky/argentina-economic-monitor

# Presidential terms, used to color charts by presidency, compute per-term
# statistics, and rebase indices to the start of a term.
# Convention: the handover month belongs to the outgoing president. A term
# starts in the first full month after inauguration, and the month before
# that is the base month (Milei, inaugurated 10 Dec 2023: base Dec 2023 = 100,
# first month Jan 2024). `party` picks the line color from `party_colors`.
#
# Party colors (light mode / dark mode). Checked for color-blind separation;
# the gold is darkened from PRO yellow so it stays visible on white.
# Source series fetched and versioned like any other, but not shown on their
# own: they feed derived indicators (`source: derived`, see pipeline/derive.py).
# `static: true` marks discontinued or hand-maintained history, which is never
# flagged stale. `source: manual` reads data/manual/<id>.csv.
inputs:
  - {id: cpi_private_composite, source: manual, frequency: M, measure: index, static: true,
     label: "Private CPI composite (replaces INDEC, Jan 2007 - Apr 2016)"}
  - {id: 178.1_NL_GENERAL_0_0_13, source: datos_gob, frequency: M, measure: index, static: true,
     label: "INDEC historical CPI, 1943-2008"}
  - {id: 96.3_INGV_2008_M_20, source: datos_gob, frequency: M, measure: flow, static: true,
     label: "INDEC CPI-GBA (base Apr 2008), m/m %, 1993-2013"}
  - {id: 98.3_INNG_2013_0_20, source: datos_gob, frequency: M, measure: index, static: true,
     label: "INDEC IPC-NU (national urban), Dec 2013 - Oct 2015"}
  - {id: 103.1_I2N_2016_M_19, source: datos_gob, frequency: M, measure: index,
     label: "INDEC CPI-GBA (base Apr 2016)"}

party_colors:
  peronism: {label: "Peronism (FpV / FdT)", light: "#4A9FDB", dark: "#6CB4E8"}
  pro:      {label: "PRO / Cambiemos",      light: "#D99B00", dark: "#F2BE3C"}
  lla:      {label: "La Libertad Avanza",   light: "#6A3FB5", dark: "#9A78D6"}

presidencies:
  - {id: nkirchner, name: Néstor Kirchner,  short: N. Kirchner, start: "2003-05-25", end: "2007-12-10", party: peronism}
  - {id: cfk1,      name: Cristina Fernández de Kirchner (1st term), short: CFK I,  start: "2007-12-10", end: "2011-12-10", party: peronism}
  - {id: cfk2,      name: Cristina Fernández de Kirchner (2nd term), short: CFK II, start: "2011-12-10", end: "2015-12-10", party: peronism}
  - {id: macri,     name: Mauricio Macri,   short: Macri,       start: "2015-12-10", end: "2019-12-10", party: pro}
  - {id: afernandez, name: Alberto Fernández, short: A. Fernández, start: "2019-12-10", end: "2023-12-10", party: peronism}
  - {id: milei,     name: Javier Milei,     short: Milei,       start: "2023-12-10", end: null,         party: lla}

topics:
  - id: real_sector
    title: Real Sector
    description: >-
      Economic activity: the monthly activity estimator (EMAE) by sector,
      manufacturing, construction and capacity utilization, plus quarterly
      GDP by expenditure and by industry.
  - id: prices_money
    title: Prices & Money
    description: >-
      Consumer prices (headline, core, regulated, seasonal; by division and
      region) and wholesale prices. National CPI starts in December 2016.

indicators:
  - id: emae
    topic: real_sector
    wide: true
    kind: variants
    title: Monthly Economic Activity Estimator (EMAE)
    short_title: EMAE
    description: >-
      INDEC's monthly proxy for GDP. The seasonally adjusted series is the
      standard read on month-to-month momentum.
    release: emae
    source: datos_gob
    source_label: INDEC, via datos.gob.ar
    frequency: M
    units: Index, 2004 = 100
    variants:
      sa:       {label: Seasonally adjusted, id: 143.3_NO_PR_2004_A_31}
      original: {label: Original,            id: 143.3_NO_PR_2004_A_21}
      trend:    {label: Trend-cycle,         id: 143.3_NO_PR_2004_A_28}
    default: {variant: sa, transform: level, start: "2016-01"}
    headline: {variant: sa, transform: mom}

  - id: emae_sectors
    topic: real_sector
    kind: panel
    title: EMAE by Sector
    short_title: EMAE sectors
    description: >-
      Year-over-year change by sector, original (not seasonally adjusted)
      series. Select sectors to compare their paths.
    release: emae
    source: datos_gob
    source_label: INDEC, via datos.gob.ar
    frequency: M
    units: Index, 2004 = 100
    variants:
      agro:          {label: Agriculture & livestock,        id: 11.3_ISOM_2004_M_39}
      fishing:       {label: Fishing,                        id: 11.3_VIPAA_2004_M_5}
      mining:        {label: Mining & quarrying,             id: 11.3_ISD_2004_M_26}
      manufacturing: {label: Manufacturing,                  id: 11.3_VMASD_2004_M_23}
      utilities:     {label: "Electricity, gas & water",       id: 11.3_ITC_2004_M_21}
      construction:  {label: Construction,                   id: 11.3_VMATC_2004_M_12}
      trade:         {label: Wholesale & retail trade,       id: 11.3_AGCS_2004_M_41}
      hotels:        {label: Hotels & restaurants,           id: 11.3_P_2004_M_20}
      transport:     {label: Transport & communications,     id: 11.3_EMC_2004_M_25}
      finance:       {label: Financial intermediation,       id: 11.3_IM_2004_M_25}
      real_estate:   {label: Real estate & business services, id: 11.3_SEGA_2004_M_48}
      public_admin:  {label: Public administration,          id: 11.3_C_2004_M_60}
      education:     {label: Education,                      id: 11.3_CMMR_2004_M_10}
      health:        {label: Health & social services,       id: 11.3_HR_2004_M_24}
      other_services: {label: Other community services,      id: 11.3_TAC_2004_M_60}
      net_taxes:     {label: Net taxes on products,          id: 11.3_IF_2004_M_25}
    default: {variant: [manufacturing, construction, agro], transform: yoy, start: "2016-01"}
    # Sector weights = shares of 2004 GDP at constant prices, from the quarterly
    # value added by industry (gdp_supply). Net taxes take the remainder.
    # With these, incidences reproduce INDEC's published figures.
    weights:
      from: gdp_supply
      year: "2004"
      residual: net_taxes          # weight = 100 - all sector shares
      exclude_from_residual: [net_taxes]
      map: {agro: agro, fishing: fishing, mining: mining, manufacturing: manufacturing,
            utilities: utilities, construction: construction, trade: trade, hotels: hotels,
            transport: transport, finance: finance, real_estate: real_estate,
            public_admin: public_admin, education: education, health: health,
            other_services: other_services}

  - id: ipi
    topic: real_sector
    kind: variants
    title: Manufacturing Production Index (IPI)
    short_title: IPI manufacturing
    description: >-
      INDEC's index of manufacturing output. Published since 2016.
    release: ipi_manufacturero
    source: datos_gob
    source_label: INDEC, via datos.gob.ar
    frequency: M
    units: Index
    variants:
      sa:       {label: Seasonally adjusted, id: 453.1_SERIE_DESEADA_0_0_24_58}
      original: {label: Original,            id: 453.1_SERIE_ORIGNAL_0_0_14_46}
    default: {variant: sa, transform: level, start: "2016-01"}
    headline: {variant: sa, transform: mom}

  - id: isac
    topic: real_sector
    kind: variants
    title: Construction Activity Index (ISAC)
    short_title: ISAC construction
    description: >-
      INDEC's synthetic indicator of construction activity, built from
      input demand (cement, steel, asphalt, and others).
    release: construccion
    source: datos_gob
    source_label: INDEC, via datos.gob.ar
    frequency: M
    units: Index, 2004 = 100
    variants:
      sa:       {label: Seasonally adjusted, id: 33.2_ISAC_SIN_EDAD_0_M_23_56}
      original: {label: Original,            id: 33.2_ISAC_NIVELRAL_0_M_18_63}
      trend:    {label: Trend-cycle,         id: 33.2_ISAC_CICLOCIA_0_M_20_62}
    default: {variant: sa, transform: level, start: "2016-01"}
    headline: {variant: sa, transform: mom}

  - id: ucii
    topic: real_sector
    wide: true
    kind: variants
    measure: rate
    transforms: [level, yoy]
    title: Industrial Capacity Utilization (UCII)
    short_title: Capacity utilization
    description: >-
      Share of installed manufacturing capacity in use, from INDEC's monthly
      survey. Not seasonally adjusted, so compare against the same month of
      earlier years. Changes are in percentage points.
    release: ucii
    source: datos_gob
    source_label: INDEC, via datos.gob.ar
    frequency: M
    units: "% of installed capacity"
    variants:
      total: {label: Total manufacturing, id: 31.3_UNG_2004_M_18}
    default: {variant: total, transform: level, start: "2016-01"}
    headline: {variant: total, transform: level}

  - id: ucii_blocks
    topic: real_sector
    kind: panel
    measure: rate
    transforms: [level, yoy]
    component_noun: industries
    title: Capacity Utilization by Industry
    short_title: UCII by industry
    description: >-
      Capacity utilization in each of INDEC's twelve industry blocks, latest
      month. Select industries to compare their paths.
    release: ucii
    source: datos_gob
    source_label: INDEC, via datos.gob.ar
    frequency: M
    units: "% of installed capacity"
    variants:
      food:        {label: Food & beverages,               id: 31.3_UPAB_2004_M_35}
      tobacco:     {label: Tobacco,                        id: 31.3_UPT_2004_M_21}
      textiles:    {label: Textiles,                       id: 31.3_UPT_2004_M_23}
      paper:       {label: Paper & cardboard,              id: 31.3_UPC_2004_M_17}
      printing:    {label: Publishing & printing,          id: 31.3_UEI_2004_M_22}
      refining:    {label: Oil refining,                   id: 31.3_URP_2004_M_24}
      chemicals:   {label: Chemicals,                      id: 31.3_USPQ_2004_M_34}
      plastics:    {label: Rubber & plastics,              id: 31.3_UCP_2004_M_20}
      minerals:    {label: Non-metallic minerals,          id: 31.3_UMNM_2004_M_27}
      metals:      {label: Basic metals,                   id: 31.3_UIMB_2004_M_33}
      autos:       {label: Motor vehicles,                 id: 31.3_UV_2004_M_25}
      metalwork:   {label: Metalworking (excl. autos),     id: 31.3_UMNIA_2004_M_42}
    default: {variant: [food, autos, metals], transform: level, start: "2016-01"}

  # ---------------- GDP & Demand (quarterly) ----------------
  - id: gdp
    topic: real_sector
    wide: true
    kind: variants
    title: Gross Domestic Product (GDP)
    short_title: GDP
    description: >-
      Real GDP at constant 2004 prices. The seasonally adjusted series is the
      standard read on quarter-to-quarter momentum.
    release: pib
    source: datos_gob
    source_label: INDEC, via datos.gob.ar
    frequency: Q
    units: Index, 2004 = 100
    index_base: "2004"
    source_units: millions of 2004 pesos
    note: >-
      Levels shown as an index (2004 average = 100); source data are in
      millions of 2004 pesos ("All data" downloads them as published).
    variants:
      sa:       {label: Seasonally adjusted, id: 3.2_OGP_D_2004_T_17}
      original: {label: Original,            id: 4.2_OGP_2004_T_17}
    default: {variant: sa, transform: level, start: "2016-01"}
    headline: {variant: sa, transform: mom}

  - id: gdp_demand
    topic: real_sector
    kind: contributions
    measure: flow
    title: What Drives GDP Growth
    short_title: GDP contributions
    description: >-
      Contribution of each expenditure component to GDP growth versus the same
      quarter a year earlier, in percentage points. Bars add up to GDP growth
      (the marker).
    release: pib
    source: datos_gob
    source_label: INDEC, via datos.gob.ar
    frequency: Q
    units: Percentage points
    source_units: millions of 2004 pesos
    note: >-
      Computed from original (not seasonally adjusted) series at constant 2004
      prices. Inventories & discrepancy is the residual that closes the gap to
      GDP growth.
    variants:
      gdp:  {label: GDP,                              id: 4.2_OGP_2004_T_17}
      c:    {label: Private consumption,              id: 4.2_MGCP_2004_T_25}
      g:    {label: Public consumption,               id: 4.2_DGCP_2004_T_30}
      i:    {label: Investment (gross fixed capital), id: 4.2_DGIT_2004_T_25}
      x:    {label: Exports,                          id: 4.2_DGE_2004_T_26}
      m:    {label: Imports,                          id: 4.2_OGI_2004_T_25}
      ve:   {label: Change in inventories,            id: 4.2_VE_2004_T_21}
      de:   {label: Statistical discrepancy,          id: 4.2_DE_2004_T_24}
    contributions:
      total: gdp
      groups:
        - {key: c,  label: Private consumption, add: [c], color: copper}
        - {key: g,  label: Public consumption,  add: [g], color: sky}
        - {key: i,  label: Investment,          add: [i], color: sage}
        - {key: nx, label: Net exports,         add: [x], subtract: [m], color: lavender}
        - {key: other, label: Inventories & discrepancy, residual: true, color: neutral}
      lines: [c, g, i, x, m]
      line_colors: {c: copper, g: sky, i: sage, x: lavender, m: neutral}
      default_lines: [c, i, x]
      lines_title: Demand components, year-over-year change
    default: {variant: gdp, transform: yoy, start: "2016-01"}

  - id: gdp_supply
    topic: real_sector
    kind: contributions
    measure: flow
    title: Which Industries Drive GDP Growth
    short_title: GDP by industry
    description: >-
      Contribution of each group of industries to GDP growth versus the same
      quarter a year earlier, in percentage points. Bars add up to GDP growth
      (the marker).
    release: pib
    source: datos_gob
    source_label: INDEC, via datos.gob.ar
    frequency: Q
    units: Percentage points
    source_units: millions of 2004 pesos
    note: >-
      Value added by industry at constant 2004 prices (original series).
      Goods: agriculture, fishing, mining, manufacturing, utilities and
      construction. "Other services & net taxes" (other community services,
      domestic service, and taxes net of subsidies on products) is the residual
      that closes the gap to GDP growth.
    variants:
      gdp:          {label: GDP,                                id: 6.2_PIBPM_2004_T_38}
      agro:         {label: Agriculture & livestock,            id: 6.2_AGCS_2004_T_39}
      fishing:      {label: Fishing,                            id: 6.2_P_2004_T_5}
      mining:       {label: Mining & quarrying,                 id: 6.2_EMC_2004_T_26}
      manufacturing: {label: Manufacturing,                     id: 6.2_IM_2004_T_23}
      utilities:    {label: "Electricity, gas & water",           id: 6.2_SEGA_2004_T_32}
      construction: {label: Construction,                       id: 6.2_C_2004_T_12}
      trade:        {label: Wholesale & retail trade,           id: 6.2_CMMR_2004_T_41}
      hotels:       {label: Hotels & restaurants,               id: 6.2_HR_2004_T_20}
      transport:    {label: Transport & communications,         id: 6.2_TAC_2004_T_40}
      finance:      {label: Financial intermediation,           id: 6.2_IF_2004_T_25}
      real_estate:  {label: Real estate & business services,    id: 6.2_AIEA_2004_T_48}
      public_admin: {label: Public administration,              id: 6.2_APDPSSAO_2004_T_60}
      education:    {label: Education,                          id: 6.2_E_2004_T_10}
      health:       {label: Health & social services,           id: 6.2_SSS_2004_T_24}
      other_services: {label: Other community services,         id: 6.2_OASCSP_2004_T_60}
      households:   {label: Domestic service,                   id: 6.2_HPSD_2004_T_32}
      net_taxes:    {label: Net taxes on products,              id: 6.2_IPNS_2004_T_35}
    contributions:
      total: gdp
      groups:
        - {key: goods,    label: Goods,                         color: copper,   add: [agro, fishing, mining, manufacturing, utilities, construction]}
        - {key: trade,    label: Trade & transport,             color: sky,      add: [trade, hotels, transport]}
        - {key: business, label: Finance & business services,   color: sage,     add: [finance, real_estate]}
        - {key: public,   label: "Public admin, education & health", color: lavender, add: [public_admin, education, health]}
        - {key: other,    label: Other services & net taxes,    color: neutral,  residual: true}
      lines: groups
      lines_title: Industry groups, year-over-year change
    default: {variant: gdp, transform: yoy, start: "2016-01"}

  # ======================= PRICES & MONEY =======================
  - id: cpi
    topic: prices_money
    wide: true
    kind: variants
    title: Consumer Price Index (CPI)
    short_title: CPI
    description: >-
      INDEC's national consumer price index. Monthly inflation is the m/m
      change; rebase to a presidential term to read cumulative inflation since
      it began.
    release: ipc
    source: datos_gob
    source_label: INDEC, via datos.gob.ar
    frequency: M
    units: Index, Dec 2016 = 100
    variants:
      headline:  {label: Headline,  id: 148.3_INIVELNAL_DICI_M_26}
      core:      {label: Core,      id: 148.3_INUCLEONAL_DICI_M_19}
      regulated: {label: Regulated, id: 148.3_IREGULANAL_DICI_M_22}
      seasonal:  {label: Seasonal,  id: 148.3_IESTACINAL_DICI_M_25}
    default: {variant: headline, transform: mom, start: "2017-01"}
    headline: {variant: headline, transform: mom}

  - id: cpi_long
    topic: prices_money
    wide: true
    kind: variants
    overlay: true
    log_level: true
    title: Consumer Prices since 1943, Corrected for the INDEC Intervention
    short_title: CPI, long run
    description: >-
      From January 2007 until the statistical emergency of late 2015, INDEC's
      CPI understated inflation. The corrected series replaces January 2007 to
      April 2016 with a composite of private estimates; the official series
      is the CPI as INDEC published it.
    release: ipc
    source: derived
    source_label: "INDEC; composite of private estimates for Jan 2007 - Apr 2016"
    frequency: M
    units: Index, Dec 2016 = 100
    transforms: [yoy, mom, level]
    ranges: [10Y, 25Y, 50Y, Max]
    note: >-
      Official: INDEC's historical CPI to Dec 2006, CPI-GBA (2007-2013),
      IPC-NU (Jan 2014 - Oct 2015), CPI-GBA (May - Dec 2016) and the national
      CPI from Jan 2017. INDEC published no CPI from Nov 2015 to Apr 2016; the
      official level carries on through that gap with the corrected series'
      changes. Both series are equal through Dec 2006, so in levels the
      distance between them is the inflation the official figures left out.
      Corrected: the same, with the private composite from Jan 2007 to Apr 2016.
    bands:
      - {start: "2007-01-01", end: "2015-10-01", label: INDEC intervention}
      - {start: "2015-11-01", end: "2016-04-01", label: No official CPI}
    summary_windows:
      - {label: "Jan 2007 - Oct 2015", base: "2006-12-01", end: "2015-10-01"}
    default: {variant: corrected, transform: yoy, range: 25Y, base: "2006-12-01"}
    derive:
      method: splice
      anchor: {id: 148.3_INIVELNAL_DICI_M_26, date: "2016-12-01"}
      variants:
        corrected:
          label: Corrected
          segments:
            - {id: 178.1_NL_GENERAL_0_0_13, as: index, to: "2006-12-01"}
            - {id: cpi_private_composite, as: index, from: "2007-01-01", to: "2016-04-01"}
            - {id: 103.1_I2N_2016_M_19, as: index, from: "2016-05-01", to: "2016-12-01"}
            - {id: 148.3_INIVELNAL_DICI_M_26, as: index, from: "2017-01-01"}
        official:
          label: Official (as published)
          fill_gaps_from: corrected
          align: {variant: corrected, date: "2006-12-01"}
          segments:
            - {id: 178.1_NL_GENERAL_0_0_13, as: index, to: "2006-12-01"}
            - {id: 96.3_INGV_2008_M_20, as: mom, from: "2007-01-01", to: "2013-12-01"}
            - {id: 98.3_INNG_2013_0_20, as: index, from: "2014-01-01", to: "2015-10-01"}
            - {id: 103.1_I2N_2016_M_19, as: index, from: "2016-05-01", to: "2016-12-01"}
            - {id: 148.3_INIVELNAL_DICI_M_26, as: index, from: "2017-01-01"}

  - id: cpi_categories
    topic: prices_money
    kind: panel
    component_noun: categories
    bar_transform: mom
    transforms: [mom, yoy, level]
    title: CPI by Category
    short_title: CPI categories
    description: >-
      Core, regulated and seasonal prices. Incidence shows how many points of
      monthly inflation each category contributed.
    release: ipc
    source: datos_gob
    source_label: INDEC, via datos.gob.ar
    frequency: M
    units: Index, Dec 2016 = 100
    variants:
      core:      {label: Core,      id: 148.3_INUCLEONAL_DICI_M_19}
      regulated: {label: Regulated, id: 148.3_IREGULANAL_DICI_M_22}
      seasonal:  {label: Seasonal,  id: 148.3_IESTACINAL_DICI_M_25}
    default: {variant: [core, regulated, seasonal], transform: mom, start: "2017-01"}
    # Weights recovered from the index itself: a fixed-base Laspeyres CPI is
    # sum_i w_i * I_i,t, so least squares on headline vs. components returns w.
    weights: {fit_to: {indicator: cpi, variant: headline}}

  - id: cpi_divisions
    topic: prices_money
    kind: panel
    component_noun: divisions
    bar_transform: mom
    transforms: [mom, yoy, level]
    title: CPI by Division
    short_title: CPI divisions
    description: >-
      The twelve COICOP divisions of the national CPI. Select divisions to
      compare their paths.
    release: ipc
    source: datos_gob
    source_label: INDEC, via datos.gob.ar
    frequency: M
    units: Index, Dec 2016 = 100
    variants:
      food:       {label: Food & non-alcoholic beverages, id: 146.3_IALIMENNAL_DICI_M_45}
      alcohol:    {label: Alcoholic beverages & tobacco,  id: 146.3_IBEBIDANAL_DICI_M_39}
      clothing:   {label: Clothing & footwear,            id: 146.3_IPRENDANAL_DICI_M_35}
      housing:    {label: "Housing, water, electricity & fuels", id: 146.3_IVIVIENNAL_DICI_M_52}
      household:  {label: Household equipment,            id: 146.3_IEQUIPANAL_DICI_M_46}
      health:     {label: Health,                         id: 146.3_ISALUDNAL_DICI_M_18}
      transport:  {label: Transport,                      id: 146.3_ITRANSPNAL_DICI_M_23}
      comms:      {label: Communication,                  id: 146.3_ICOMUNINAL_DICI_M_27}
      recreation: {label: Recreation & culture,           id: 146.3_IRECREANAL_DICI_M_31}
      education:  {label: Education,                      id: 146.3_IEDUCACNAL_DICI_M_22}
      restaurants: {label: Restaurants & hotels,          id: 146.3_IRESTAUNAL_DICI_M_33}
      misc:       {label: Miscellaneous goods & services, id: 146.3_IBIENESNAL_DICI_M_36}
    default: {variant: [food, housing, transport], transform: mom, start: "2017-01"}
