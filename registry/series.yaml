      - {variant: x, transform: yoy, label: "Exports", sub: "y/y, constant prices"}
      - {variant: m, transform: yoy, label: "Imports", sub: "y/y, constant prices", good: none}
    measure: flow
    title: What Drives GDP Growth
    short_title: GDP contributions
