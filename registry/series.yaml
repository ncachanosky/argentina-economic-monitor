        pledge: "bcrabk:npl_lines|system|1_total_sector_privado/saldo_total_de_financiaciones/con_garantia_prendaria"
        exports: "bcrabk:npl_lines|system|1_total_sector_privado/saldo_total_de_financiaciones/prefinanciacion_y_financiacion_de_exportaciones"
