  - id: trade_settlement
    topic: trade
    release: ica
    wide: true
    kind: variants
    secondary_bar: {variant: gap, label: "Gap: FX-market balance minus customs balance", axis: "Gap, US$ m (bars)"}
    line_styles:
      x:  {slot: 0}
      xr: {slot: 0, dash: dash}
      m:  {slot: 1}
      mp: {slot: 1, dash: dash}
    overlay: true
    measure: flow
    plain_level: true
    title: Goods Shipped against Dollars Settled
    short_title: Shipped vs. settled
    description: >-
      Exports and imports as recorded at customs, against the export
      receipts and import payments that went through the foreign-exchange
      market, twelve-month sums, millions of US dollars, since 2004.
    source: derived
    source_label: INDEC (customs), via datos.gob.ar; BCRA (balance cambiario)
    frequency: M
    units: Millions of US dollars, last 12 months
    transforms: [level]
    ranges: [5Y, 10Y, Max]
    note: >-
      Customs records goods when they ship; the foreign-exchange market
      records the dollars when they change hands, which can be months
      earlier (prefinancing, advance payments) or later (supplier credit,
      deferred payment). Receipts above shipments mean exporters are
      settling ahead or bringing in financing; payments below imports mean
      importers are running up commercial debt abroad, as when access to
      the market is rationed. Receipts also include prefinancing and other
      items INDEC does not count as exports.
    method_links: [{anchor: balance-cambiario, label: "About the balance cambiario"}]
    default: {variant: x, transform: level, range: 10Y}
    derive:
      method: formula
      anchor: xc
      start: "2003-12-01"
      vars: {xc: 74.3_IET_0_M_16, mc: 74.3_IIT_0_M_25, xr: 183.1_COBROS_EXPNES_0_M_27, mp: 183.1_PAGOS_IMPONES_0_M_26}
      variants:
        x:  {label: Exports (customs),         expr: "sum12(xc)"}
        xr: {label: Export receipts (FX market), expr: "sum12(xr)"}
        m:  {label: Imports (customs),         expr: "sum12(mc)"}
        mp: {label: Import payments (FX market), expr: "sum12(mp)"}
        gap: {label: "Gap: FX-market balance minus customs balance", expr: "(sum12(xr) - sum12(mp)) - (sum12(xc) - sum12(mc))"}

  # ---------------- Fiscal & Debt ----------------
  # Fiscal flows: national non-financial public sector, cash basis (IMIG,
  # Secretaría de Hacienda). Ratios to GDP: the last twelve months over the
  # nominal GDP of the same twelve months (gdp12 in pipeline/derive.py).

  # ---------------- Balance of payments ----------------
  - id: bop_statement
    topic: bop
    release: bop
    wide: true
    kind: statement
    measure: flow
    title: Balance of Payments
    short_title: BoP statement
    description: >-
      The balance of payments as a statement, millions of US dollars: a
      quarter, the last four quarters, the year to date or a calendar year,
      against the same period a year earlier.
    source: derived
    source_label: INDEC (Balance de pagos, BPM6), via datos.gob.ar
    frequency: Q
    units: Millions of US dollars
    note: >-
      Sixth edition of the IMF's Balance of Payments Manual (BPM6). In the
      financial account a positive figure is net lending to the rest of the
      world: residents acquired more foreign assets than the liabilities
      they incurred (assets and liabilities are each shown as net flows, a
      positive liability being an inflow). The current and capital accounts
      plus net errors and omissions equal the financial account. Investment
      income from reserve assets and items INDEC does not break out are in
      "Reserve assets and other".
    method_links: [{anchor: bop, label: "Reading the balance of payments"}]
    statement:
      rows:
        - {key: ca,  bold: true}
        - {key: gs,  indent: 1}
        - {key: gd,  indent: 2}
        - {key: gx,  indent: 3}
        - {key: gm,  indent: 3}
        - {key: sv,  indent: 2}
        - {key: sx,  indent: 3}
        - {key: sm,  indent: 3}
        - {key: pi,  indent: 1}
        - {key: cw,  indent: 2}
        - {key: ii,  indent: 2}
        - {key: id,  indent: 3}
        - {key: ip,  indent: 3}
        - {key: io,  indent: 3}
        - {key: ir,  indent: 3}
        - {key: si,  indent: 1}
        - {key: ka,  bold: true}
        - {key: nl,  bold: true, rule: true}
        - {key: fa,  bold: true}
        - {key: di,  indent: 1}
        - {key: da,  indent: 2}
        - {key: dl,  indent: 2}
        - {key: pf,  indent: 1}
        - {key: pa,  indent: 2}
        - {key: pl,  indent: 2}
        - {key: dv,  indent: 1}
        - {key: oi,  indent: 1}
        - {key: ra,  indent: 1}
        - {key: eo,  bold: true, rule: true}
    default: {variant: ca}
    derive:
      method: formula
      anchor: ca
      vars: {ca: 160.2_TL_CUENNTE_0_T_22, gs: 160.2_CTA_CORIOS_0_T_39, gd: 160.2_CTA_CORNES_0_T_46, gx: 160.2_CTA_CORFOB_0_T_59, gm: 160.2_CTA_CORRFOB_0_T_59, sv: 160.2_CTA_CORIOS_0_T_49, sx: 160.2_CTA_CORIOS_0_T_52, sm: 160.2_CTA_CORIOS_0_T_51, pi: 160.2_CTA_CORIOS_0_T_41, cw: 160.2_CTA_CORDOS_0_T_49, ii: 160.2_CTA_CORION_0_T_58, id: 160.2_CCTE_INCTA_0_T_51, ip: 160.2_IESOS_PERA_0_T_53, io: 160.2_CTA_CORION_0_T_57, si: 160.2_CTA_CORIOS_0_T_37, ka: 160.2_TL_CUENTAL_0_T_20, fa: 160.2_TL_CUENERA_0_T_23, di: 160.2_CTA_FINCTA_0_T_41, dae: 160.2_CFIN_INTAL_0_T_57, dad: 160.2_CTA_FINUDA_0_T_59, dle: 160.2_CFIN_PASINTAL_0_T_57, dld: 160.2_CFIN_INUDA_0_T_52, pf: 160.2_CTA_FINERA_0_T_41, pae: 160.2_CFIN_INTAL_AC_0_T_57, pad: 160.2_CTA_ACFINUDA_0_T_59, ple: 160.2_CFIN_PAINTAL_0_T_57, pld: 160.2_CTA_PAFINUDA_0_T_59, dv: 160.2_CTA_FINROS_0_T_36, oi: 160.2_CTA_FINION_0_T_38, ra: 160.2_AVOS_RERVA_0_T_15, eo: 160.2_ERES_OMTOS_0_T_23}
      variants:
        ca: {label: Current account, expr: "ca"}
        gs: {label: Goods and services, expr: "gs"}
        gd: {label: Goods, expr: "gd"}
        gx: {label: "Exports (FOB)", expr: "gx"}
        gm: {label: "Imports (FOB)", expr: "gm"}
        sv: {label: Services, expr: "sv"}
        sx: {label: Credits (exports), expr: "sx"}
        sm: {label: Debits (imports), expr: "sm"}
        pi: {label: Primary income, expr: "pi"}
        cw: {label: Compensation of employees, expr: "cw"}
        ii: {label: Investment income, expr: "ii"}
        id: {label: Direct investment, expr: "id"}
        ip: {label: Portfolio investment, expr: "ip"}
        io: {label: Other investment, expr: "io"}
        ir: {label: Reserve assets and other, expr: "ii - id - ip - io"}
        si: {label: Secondary income, expr: "si"}
        ka: {label: Capital account, expr: "ka"}
        nl: {label: "Net lending (+) / borrowing (−), current and capital accounts", expr: "ca + ka"}
        fa: {label: "Financial account (net lending +)", expr: "fa"}
        di: {label: Direct investment, expr: "di"}
        da: {label: Net acquisition of assets, expr: "dae + dad"}
        dl: {label: Net incurrence of liabilities, expr: "dle + dld"}
        pf: {label: Portfolio investment, expr: "pf"}
        pa: {label: Net acquisition of assets, expr: "pae + pad"}
        pl: {label: Net incurrence of liabilities, expr: "ple + pld"}
        dv: {label: Financial derivatives, expr: "dv"}
        oi: {label: Other investment, expr: "oi"}
        ra: {label: Reserve assets, expr: "ra"}
        eo: {label: Net errors and omissions, expr: "eo"}

  - id: bop_current_account
    topic: bop
    release: bop
    wide: true
    kind: contributions
    measure: flow
    title: The Current Account and Its Parts
    short_title: Current account
    description: >-
      Goods, services, primary income (interest, profits and dividends) and
      secondary income (transfers), and the current-account balance,
      millions of US dollars, quarterly since 2006.
    source: derived
    source_label: INDEC (Balance de pagos), via datos.gob.ar
    frequency: Q
    units: Millions of US dollars
    ranges: [5Y, 10Y, Max]
    note: >-
      Accrual basis: transactions when they happen, not when they are paid
      (for the cash view, see the balance cambiario on the Exchange Rate
      page). Goods here are valued FOB on both sides, so the goods balance
      differs from the customs trade balance, which values imports CIF.
    method_links: [{anchor: bop, label: "Reading the balance of payments"}]
    contributions:
      precomputed: true
      total: ca
      total_label: Current account
      units: "US$ m"
      suffix: " m"
      groups:
        - {key: gd, label: Goods,            add: [gd], color: copper}
        - {key: sv, label: Services,         add: [sv], color: sky}
        - {key: pi, label: Primary income,   add: [pi], color: lavender}
        - {key: si, label: Secondary income, add: [si], color: sage}
    yearly: {how: sum}
    default: {variant: gd, transform: level, range: Max}
    derive:
      method: formula
      anchor: ca
      vars: {ca: 160.2_TL_CUENNTE_0_T_22, gd: 160.2_CTA_CORNES_0_T_46, sv: 160.2_CTA_CORIOS_0_T_49, pi: 160.2_CTA_CORIOS_0_T_41, si: 160.2_CTA_CORIOS_0_T_37}
      variants:
        gd: {label: Goods, expr: "gd"}
        sv: {label: Services, expr: "sv"}
        pi: {label: Primary income, expr: "pi"}
        si: {label: Secondary income, expr: "si"}
        ca: {label: Current account, expr: "ca"}

  - id: bop_ca_gdp
    topic: bop
    release: bop
    kind: variants
    overlay: true
    measure: rate
    validate_as: flow
    plain_level: true
    title: Current Account, % of GDP
    short_title: Current account, % GDP
    description: >-
      The current-account balance of the last four quarters as a share of
      GDP in dollars, and the goods-and-services balance.
    source: derived
    source_label: INDEC (balance of payments, GDP); BCRA (exchange rate)
    frequency: Q
    units: "% of GDP"
    transforms: [level]
    ranges: [10Y, Max]
    ref_line: 0
    note: >-
      GDP in dollars: each quarter's GDP at current prices converted at that
      quarter's average official (wholesale) exchange rate. When the
      official rate is held far below the market rate (2011-2015, 2019-2025)
      this overstates dollar GDP and so understates the ratios.
    method_links: [{anchor: bop, label: "Reading the balance of payments"}]
    default: {variant: ca, transform: level, range: Max}
    derive:
      method: formula
      anchor: ca
      vars: {ca: 160.2_TL_CUENNTE_0_T_22, gs: 160.2_CTA_CORIOS_0_T_39, gdp: 4.4_OGP_2004_T_17, fx: "bcra:5"}
      vars_how: {fx: mean}
      variants:
        ca: {label: Current account,    expr: "100 * sum4(ca) / sum4(gdp / 4 / fx)"}
        gs: {label: Goods and services, expr: "100 * sum4(gs) / sum4(gdp / 4 / fx)"}

  - id: bop_financing
    topic: bop
    release: bop
    wide: true
    kind: contributions
    measure: flow
    title: How the Current Account Was Financed
    short_title: Financing
    description: >-
      The balance of the current and capital accounts (the line) and where
      it went: the financial account by type of flow, and errors and
      omissions, millions of US dollars, quarterly since 2006.
    source: derived
    source_label: INDEC (Balance de pagos), via datos.gob.ar
    frequency: Q
    units: Millions of US dollars
    ranges: [5Y, 10Y, Max]
    note: >-
      Above zero: net lending to the rest of the world (residents acquiring
      more foreign assets than they borrow: capital outflow, or reserves
      rising). Below zero: net borrowing (capital inflow, or reserves
      falling). A current-account deficit (line below zero) must be matched
      by bars below zero. Other investment includes residents' purchases of
      foreign currency and deposits abroad and trade credit; errors and
      omissions are shown with the sign that closes the identity.
    method_links: [{anchor: bop, label: "Reading the balance of payments"}]
    contributions:
      precomputed: true
      total: nl
      total_label: Current and capital accounts
      units: "US$ m"
      suffix: " m"
      groups:
        - {key: di, label: Direct investment,    add: [di], color: copper}
        - {key: pf, label: Portfolio investment, add: [pf], color: sky}
        - {key: oi, label: Other investment,     add: [oi], color: sage}
        - {key: dv, label: Derivatives,          add: [dv], color: slate}
        - {key: ra, label: Reserve assets,       add: [ra], color: gold}
        - {key: eo, label: Errors and omissions, add: [eo], color: neutral}
    yearly: {how: sum}
    default: {variant: di, transform: level, range: Max}
    derive:
      method: formula
      anchor: fa
      vars: {fa: 160.2_TL_CUENERA_0_T_23, ca: 160.2_TL_CUENNTE_0_T_22, ka: 160.2_TL_CUENTAL_0_T_20, di: 160.2_CTA_FINCTA_0_T_41, pf: 160.2_CTA_FINERA_0_T_41, oi: 160.2_CTA_FINION_0_T_38, dv: 160.2_CTA_FINROS_0_T_36, ra: 160.2_AVOS_RERVA_0_T_15, eo: 160.2_ERES_OMTOS_0_T_23}
      variants:
        di: {label: Direct investment, expr: "di"}
        pf: {label: Portfolio investment, expr: "pf"}
        oi: {label: Other investment, expr: "oi"}
        dv: {label: Derivatives, expr: "dv"}
        ra: {label: Reserve assets, expr: "ra"}
        eo: {label: Errors and omissions, expr: "-eo"}
        nl: {label: Current and capital accounts, expr: "ca + ka"}

  - id: bop_income
    topic: bop
    release: bop
    wide: true
    kind: contributions
    measure: flow
    title: Interest, Profits and Dividends
    short_title: Primary income
    description: >-
      Primary income by type: what Argentina earns on its foreign assets
      minus what it pays on its foreign liabilities, millions of US dollars,
      quarterly since 2006.
    source: derived
    source_label: INDEC (Balance de pagos), via datos.gob.ar
    frequency: Q
    units: Millions of US dollars
    ranges: [5Y, 10Y, Max]
    note: >-
      Direct investment income: profits and dividends of foreign-owned
      firms (paid out or reinvested) net of those of Argentine firms abroad.
      Portfolio income: interest and dividends on securities, including the
      government's bonds. Other investment: interest on loans (the IMF and
      other official lenders among them) and deposits. Reserve assets and
      other: what INDEC does not break out, mainly the return on reserves.
    contributions:
      precomputed: true
      total: pi
      total_label: Primary income
      units: "US$ m"
      suffix: " m"
      groups:
        - {key: id, label: Direct investment,    add: [id], color: copper}
        - {key: ip, label: Portfolio investment, add: [ip], color: sky}
        - {key: io, label: Other investment,     add: [io], color: sage}
        - {key: ir, label: Reserve assets and other, add: [ir], color: gold}
        - {key: cw, label: Compensation of employees, add: [cw], color: neutral}
    yearly: {how: sum}
    default: {variant: id, transform: level, range: Max}
    derive:
      method: formula
      anchor: pi
      vars: {pi: 160.2_CTA_CORIOS_0_T_41, cw: 160.2_CTA_CORDOS_0_T_49, ii: 160.2_CTA_CORION_0_T_58, id: 160.2_CCTE_INCTA_0_T_51, ip: 160.2_IESOS_PERA_0_T_53, io: 160.2_CTA_CORION_0_T_57}
      variants:
        id: {label: Direct investment, expr: "id"}
        ip: {label: Portfolio investment, expr: "ip"}
        io: {label: Other investment, expr: "io"}
        ir: {label: Reserve assets and other, expr: "ii - id - ip - io"}
        cw: {label: Compensation of employees, expr: "cw"}
        pi: {label: Primary income, expr: "pi"}

  - id: bop_accrual_cash
    topic: bop
    release: bop
    kind: variants
    overlay: true
    measure: flow
    plain_level: true
    title: Accrual against Cash
    short_title: Accrual vs. cash
    description: >-
      The goods-and-services balance in the balance of payments against the
      same balance in the foreign-exchange market (balance cambiario), last
      four quarters, millions of US dollars.
    source: derived
    source_label: INDEC (balance of payments); BCRA (balance cambiario)
    frequency: Q
    units: Millions of US dollars, last 4 quarters
    transforms: [level]
    ranges: [10Y, Max]
    ref_line: 0
    note: >-
      The balance of payments records goods and services when they are
      traded; the balance cambiario records the dollars when they are paid.
      A cash balance below the accrual balance means exporters and importers
      are financing trade abroad (or holding export dollars out of the
      market); above it, they are bringing the dollars in early.
    method_links: [{anchor: balance-cambiario, label: "About the balance cambiario"}]
    default: {variant: bop, transform: level, range: Max}
    derive:
      method: formula
      anchor: gs
      vars: {gs: 160.2_CTA_CORIOS_0_T_39, cg: "bcrabc:goods", cs: "bcrabc:services"}
      vars_how: {cg: sum, cs: sum}
      variants:
        bop:  {label: Balance of payments (accrual), expr: "sum4(gs)"}
        cash: {label: Balance cambiario (cash),      expr: "sum4(cg + cs)"}

  - id: iip_statement
    topic: bop
    release: bop
    wide: true
    kind: statement
    measure: flow
    title: International Investment Position
    short_title: Investment position
    description: >-
      What residents own abroad and owe to non-residents at the end of each
      quarter, millions of US dollars, against a quarter and a year earlier.
    source: derived
    source_label: INDEC (Posición de inversión internacional), via datos.gob.ar
    frequency: Q
    units: Millions of US dollars
    note: >-
      Stocks at market value at the end of the quarter, so they change with
      flows and also with prices and exchange rates. A positive net position
      means residents own more abroad than they owe: Argentina's is positive
      because the private sector's holdings abroad, largely foreign currency
      and deposits, exceed the government's foreign debt.
    method_links: [{anchor: bop, label: "Reading the balance of payments"}]
    statement:
      stock: true
      rows:
        - {key: net, bold: true}
        - {key: at,  bold: true, rule: true}
        - {key: adi, indent: 1}
        - {key: apf, indent: 1}
        - {key: aoi, indent: 1}
        - {key: acd, indent: 2}
        - {key: ara, indent: 1}
        - {key: lt,  bold: true, rule: true}
        - {key: ldi, indent: 1}
        - {key: lpf, indent: 1}
        - {key: ldv, indent: 1}
        - {key: loi, indent: 1}
        - {heading: Net position by sector, rule: true}
        - {key: ncb, indent: 1}
        - {key: ngg, indent: 1}
        - {key: ndc, indent: 1}
        - {key: nos, indent: 1}
    default: {variant: net}
    derive:
      method: formula
      anchor: net
      vars: {net: 144.2_PCIONETA_0_T_37, at: 144.2_AVOSCALES_0_T_24, adi: 144.2_IRSIONCTA_0_T_17, apf: 144.2_IRSIONERA_0_T_17, aoi: 144.2_OINVERRAL_0_T_25, acd: 144.2_MDADEPRAL_0_T_27, ara: 144.2_AVOSRELES_0_T_29, lt: 144.2_PVOSTRLES_0_T_20, ldi: 144.2_PVOSINLES_0_T_38, lpf: 144.2_PVOSINLESC_0_T_38, ldv: 144.2_PVOSDELES_0_T_42, loi: 144.2_PVOSOTION_0_T_22, ncb: 144.4_BOCENTRAL_0_T_19, ngg: 144.4_GERNOGRAL_0_T_22, ndc: 144.4_SEDADESTOS_0_T_31, nos: 144.4_OSSECTRES_0_T_14, ost: 144.4_AVOSOTLESIN_0_T_30, osd: 144.4_AVOSOTRAL_0_T_46, osp: 144.4_AVOSOTLES_0_T_48, oso: 144.4_AVOSOTUAL_0_T_54}
      variants:
        net: {label: Net international investment position, expr: "net"}
        at:  {label: Assets, expr: "at"}
        adi: {label: Direct investment, expr: "adi"}
        apf: {label: Portfolio investment, expr: "apf"}
        aoi: {label: Other investment, expr: "aoi"}
        acd: {label: of which currency and deposits, expr: "acd"}
        ara: {label: Reserve assets, expr: "ara"}
        lt:  {label: Liabilities, expr: "lt"}
        ldi: {label: Direct investment, expr: "ldi"}
        lpf: {label: Portfolio investment, expr: "lpf"}
        ldv: {label: Financial derivatives, expr: "ldv"}
        loi: {label: Other investment, expr: "loi"}
        ncb: {label: Central bank, expr: "ncb"}
        ngg: {label: General government, expr: "ngg"}
        ndc: {label: Banks (deposit-taking corporations), expr: "ndc"}
        nos: {label: Other sectors (firms and households), expr: "nos"}

  - id: iip_sectors
    topic: bop
    release: bop
    wide: true
    kind: contributions
    measure: flow
    title: Net Investment Position by Sector
    short_title: Net position by sector
    description: >-
      Each sector's foreign assets minus its foreign liabilities, and the
      country's net international investment position (the line), millions
      of US dollars, quarterly since 2016.
    source: derived
    source_label: INDEC (Posición de inversión internacional), via datos.gob.ar
    frequency: Q
    units: Millions of US dollars
    ranges: [5Y, Max]
    note: >-
      The general government is a large net debtor (bonds, the IMF and other
      official lenders); firms and households are a larger net creditor,
      through assets held abroad and foreign currency held at home. The
      central bank's position nets its reserves against its foreign
      liabilities (the China swap and repos among them).
    method_links: [{anchor: bop, label: "Reading the balance of payments"}]
    contributions:
      precomputed: true
      total: net
      total_label: Net international investment position
      units: "US$ m"
      suffix: " m"
      groups:
        - {key: nos, label: Other sectors (firms and households), add: [nos], color: sage}
        - {key: ncb, label: Central bank, add: [ncb], color: gold}
        - {key: ndc, label: Banks, add: [ndc], color: sky}
        - {key: ngg, label: General government, add: [ngg], color: copper}
    default: {variant: nos, transform: level, range: Max}
    derive:
      method: formula
      anchor: net
      vars: {net: 144.2_PCIONETA_0_T_37, ncb: 144.4_BOCENTRAL_0_T_19, ngg: 144.4_GERNOGRAL_0_T_22, ndc: 144.4_SEDADESTOS_0_T_31, nos: 144.4_OSSECTRES_0_T_14}
      variants:
        nos: {label: Other sectors, expr: "nos"}
        ncb: {label: Central bank, expr: "ncb"}
        ndc: {label: Banks, expr: "ndc"}
        ngg: {label: General government, expr: "ngg"}
        net: {label: Net position, expr: "net"}

  - id: iip_private_abroad
    topic: bop
    release: bop
    wide: true
    kind: contributions
    measure: flow
    title: What Firms and Households Hold Abroad
    short_title: Private assets abroad
    description: >-
      Foreign assets of the private non-financial sector by type, millions
      of US dollars, quarterly since 2016.
    source: derived
    source_label: INDEC (Posición de inversión internacional), via datos.gob.ar
    frequency: Q
    units: Millions of US dollars
    ranges: [5Y, Max]
    note: >-
      "Other sectors" in INDEC's terms: firms other than banks, and
      households. Other investment is mostly foreign currency and deposits:
      dollar banknotes kept outside the banking system ("in the mattress")
      and deposits in banks abroad, which INDEC estimates partly from
      purchases recorded in the foreign-exchange market. Portfolio
      investment: foreign securities. Direct investment: Argentine firms'
      stakes in companies abroad.
    contributions:
      precomputed: true
      total: tot
      total_label: Total foreign assets
      units: "US$ m"
      suffix: " m"
      groups:
        - {key: oso, label: Other investment (mostly currency and deposits), add: [oso], color: sage}
        - {key: osp, label: Portfolio investment, add: [osp], color: sky}
        - {key: osd, label: Direct investment, add: [osd], color: copper}
    default: {variant: oso, transform: level, range: Max}
    derive:
      method: formula
      anchor: tot
      vars: {tot: 144.4_AVOSOTLESIN_0_T_30, osd: 144.4_AVOSOTRAL_0_T_46, osp: 144.4_AVOSOTLES_0_T_48, oso: 144.4_AVOSOTUAL_0_T_54}
      variants:
        oso: {label: Other investment, expr: "oso"}
        osp: {label: Portfolio investment, expr: "osp"}
        osd: {label: Direct investment, expr: "osd"}
        tot: {label: Total, expr: "tot"}

  # ---------------- Labor & social ----------------
  - id: labor_rates
    topic: labor
    release: eph
    wide: true
    kind: variants
    overlay: true
    measure: rate
    title: Employment and Unemployment
    short_title: Labor market
    description: >-
      Activity, employment, unemployment and underemployment rates from
      INDEC's household survey (EPH), urban areas, quarterly since 2003.
    source: derived
    source_label: INDEC (Encuesta Permanente de Hogares), via datos.gob.ar
    frequency: Q
    units: "%"
    transforms: [level, yoy]
    ranges: [10Y, Max]
    bands:
      - {start: "2007-01-01", end: "2015-12-01", key: "INDEC intervention (2007-2015): survey figures to be used with caution"}
    note: >-
      Activity and employment rates: the labor force and the employed over
      total population (all ages) of the 31 urban areas surveyed.
      Unemployment and underemployment (working under 35 hours a week and
      wanting more): over the labor force. Original data, not seasonally
      adjusted: compare a quarter with the same quarter a year earlier. INDEC
      itself warned in 2016 that EPH figures for 2007-2015 should be used with
      caution (population projections and survey quality); the shaded period
      marks them.
    default: {variant: unemployment, transform: level, range: Max}
    forecast:
      - {variant: unemployment, rem: unemp, transform: level}
    derive:
      method: formula
      anchor: u
      vars: {a: 43.2_ECTAT_0_T_33, e: 44.2_ECTET_0_T_30, u: 45.2_ECTDT_0_T_33, s: 46.2_ECTST_0_T_36}
      variants:
        unemployment:    {label: Unemployment,    expr: "100 * u"}
        underemployment: {label: Underemployment, expr: "100 * s"}
        employment:      {label: Employment rate, expr: "100 * e"}
        activity:        {label: Activity rate,   expr: "100 * a"}

  - id: labor_registered
    topic: labor
    kind: variants
    overlay: true
    overlay_default: [private]
    title: Registered Employment
    short_title: Registered jobs
    description: >-
      Workers registered in the social security system (SIPA), by type:
      private and public wage earners, domestic workers, the self-employed
      (autónomos) and monotributistas. Seasonally adjusted, monthly since
      2012.
    source: datos_gob
    source_label: Ministerio de Capital Humano (SIPA), via datos.gob.ar
    frequency: M
    units: Thousands of workers
    transforms: [level, yoy, mom]
    ranges: [5Y, Max]
    note: >-
      Registered (formal) workers only: informal workers are not included.
      Each worker is counted once, so the categories add up to the total.
      The monthly series starts in 2012; it
      replaces the quarterly series of private wage earners since 1996, which
      datos.gob.ar publishes about two quarters later.
    variants:
      private:   {label: Private wage earners,       id: 151.1_AARIADOTAC_2012_M_26}
      public:    {label: Public wage earners,        id: 151.1_AARIADOTAC_2012_M_25}
      domestic:  {label: Domestic workers,           id: 151.1_AARIADOTAC_2012_M_40}
      autonomos: {label: Self-employed (autónomos),  id: 151.1_IPENDIETAC_2012_M_34}
      mono:      {label: Monotributo,                id: 151.1_IPENDIETAC_2012_M_36}
      mono_soc:  {label: Social monotributo,         id: 151.1_IPENDIETAC_2012_M_43}
      total:     {label: All registered workers,     id: 151.1_TL_SIN_TAC_2012_M_15}
    default: {variant: private, transform: level, range: Max}

  - id: labor_wages_real
    topic: labor
    release: salarios
    wide: true
    kind: variants
    overlay: true
    overlay_default: [private]
    title: Real Wages
    short_title: Real wages
    description: >-
      INDEC's wage index for registered private, public and unregistered
      workers, and the average taxable wage of stable workers (RIPTE), in
      real terms (deflated by the CPI). Monthly.
    source: datos_gob
    source_label: INDEC (Índice de salarios); Secretaría de Seguridad Social (RIPTE); via datos.gob.ar
    frequency: M
    units: Index and pesos
    transforms: [level, yoy, mom]
    ranges: [5Y, 10Y, Max]
    deflate_with: {indicator: cpi_long, variant: corrected, label: CPI}
    note: >-
      Real terms: deflated by the CPI (corrected for 2007-2016, see the
      long-run CPI). Use "Base = 100" to compare from the start of a
      presidency. The unregistered (informal) wage index is published with a
      five-month lag and moves in steps, as INDEC estimates it from the
      household survey. RIPTE is the average taxable wage of workers employed
      by the same firm for 13 months, before deductions, since 1994.
    variants:
      private:  {label: Registered private (index), id: 149.1_SOR_PRIADO_OCTU_0_25}
      public:   {label: Public (index),             id: 149.1_SOR_PUBICO_OCTU_0_14}
      informal: {label: Unregistered (index),       id: 149.1_SOR_PRIADO_OCTU_0_28}
      total:    {label: All workers (index),        id: 149.1_TL_INDIIOS_OCTU_0_21}
      ripte:    {label: RIPTE (pesos),              id: 158.1_REPTE_0_0_5}
    default: {variant: private, transform: level, range: 10Y, real: true, base: "2023-11-01"}

  - id: labor_minimum_wage
    topic: labor
    wide: true
    kind: variants
    log_level: false
    title: Minimum Wage and Minimum Pension since 1965
    short_title: Minimum wage
    description: >-
      The legal minimum wage (salario mínimo, vital y móvil, since 1965) and
      the minimum pension (since 1971), monthly, in current pesos, converted
      across Argentina's four currency changes; in real terms by default.
    source: derived
    source_label: Ministerio de Capital Humano and ANSES, via datos.gob.ar; deflated by the long-run CPI
    frequency: M
    units: Pesos per month
    transforms: [level, yoy]
    ranges: [10Y, 25Y, 50Y, Max]
    deflate_with: {indicator: cpi_long, variant: corrected, label: CPI}
    note: >-
      Amounts in pesos moneda nacional, pesos ley 18.188, pesos argentinos
      and australes are converted to today's pesos (1 peso = 10,000 australes
      = 10 million pesos argentinos = 10^11 pesos ley = 10^13 pesos moneda
      nacional). Real terms: deflated by the CPI since 1943 corrected for the
      2007-2015 INDEC intervention, in pesos of the latest month. The minimum
      wage was not updated for long stretches (1993-2003 among them), so
      inflation eroded it in real terms. Future months show increases already
      decreed.
    default: {variant: smvm, transform: level, range: Max, real: true}
    derive:
      method: formula
      anchor: w
      vars: {w: 57.1_SMVMM_0_M_34, p: 58.1_MP_0_M_24}
      variants:
        smvm:    {label: Minimum wage,    expr: "ars(w)"}
        pension: {label: Minimum pension, expr: "ars(p)"}

  - id: labor_wages_usd
    topic: labor
    kind: variants
    overlay: true
    measure: flow
    plain_level: true
    title: Wages in Dollars
    short_title: Dollar wages
    description: >-
      The average wage (RIPTE) converted to US dollars at the month's
      average official rate and at the CCL rate, US dollars per month,
      since 1994.
    source: derived
    source_label: Secretaría de Seguridad Social (RIPTE), via datos.gob.ar; BCRA; ArgentinaDatos and DolarAPI (CCL, unofficial)
    frequency: M
    units: US dollars per month
    transforms: [level]
    ranges: [10Y, Max]
    note: >-
      Another way to read the real exchange rate: what labor costs in
      dollars (before employer contributions). During convertibility
      (1994-2001) one peso was one dollar. At the CCL rate: the market rate
      under exchange controls; before November 2011 it equals the official
      rate, and there is no CCL series for November 2011 to December 2012.
      Not adjusted for US inflation.
    method_links: [{anchor: fx-rer, label: "About the real exchange rate"}]
    default: {variant: official, transform: level, range: Max}
    derive:
      method: formula
      anchor: r
      vars: {r: 158.1_REPTE_0_0_5, ofx: "bcra:5", ccl: "dolar:ccl"}
      vars_how: {ofx: mean, ccl: mean}
      variants:
        official: {label: At the official rate, expr: "fill(r / ofx, upto(r, \"2001-12-31\"))"}
        ccl:      {label: At the CCL rate,      expr: "fill(r / ccl, upto(fill(r / ofx, upto(r, \"2001-12-31\")), \"2011-10-31\"))"}

  - id: poverty
    topic: labor
    wide: true
    kind: variants
    overlay: true
    measure: rate
    plain_level: true
    title: Poverty and Indigence
    short_title: Poverty
    description: >-
      Share of people and households with incomes below the poverty line
      and the indigence (extreme poverty) line, urban areas, by semester,
      as published by INDEC since 2003.
    source: manual
    source_label: INDEC (Incidencia de la pobreza y la indigencia), from its reports; CEDLAS (UNLP); UCA-ODSA
    frequency: S
    units: "%"
    transforms: [level]
    ranges: [Max]
    bands:
      - {start: "2007-01-01", end: "2013-01-01", key: "INDEC intervention: lines deflated by the intervened CPI, poverty understated"}
      - {start: "2013-07-01", end: "2016-01-01", style: outline, key: "Not published (H2 2013 - H1 2016)"}
    note: >-
      Poverty: household income below the cost of the basic total basket
      (food and other goods and services) for its members; indigence: below
      the basic food basket. 2007-2013: INDEC kept publishing, but its baskets
      were priced with the intervened CPI, so the lines were far too low and
      poverty fell to implausible levels (4.7% in H1 2013); INDEC stopped
      publishing after that semester and, after the 2016 statistical
      emergency, resumed with a new method in H2 2016. The H2 2007 figure was
      never estimated. Figures before and after 2016 are not comparable: the
      2016 method uses new baskets and adult-equivalence scales. Two
      alternatives cover the intervention: CEDLAS's comparable series (INDEC's
      2016 method on the same survey, with baskets repriced by private price
      indices, to H1 2017; it matches INDEC from H2 2016) and the UCA's
      Observatorio de la Deuda Social, from its own annual survey (third
      quarter, shown at mid-year; before 2010 a reconstruction from INDEC's
      survey), whose level differs from INDEC's even in normal years.
    variants:
      persons:    {label: "Poverty, persons",      id: "indec_poverty"}
      households: {label: "Poverty, households",   id: "indec_poverty#households"}
      indigence:  {label: "Indigence, persons",    id: "indec_poverty#indigence"}
      indig_hh:   {label: "Indigence, households", id: "indec_poverty#indigence_households"}
      cedlas:     {label: "Poverty, persons: CEDLAS comparable (alternative)", id: "poverty_cedlas"}
      uca:        {label: "Poverty, persons: UCA-ODSA survey (alternative)",   id: "poverty_uca"}
    default: {variant: persons, transform: level, range: Max}

  - id: labor_purchasing
    topic: labor
    wide: true
    kind: variants
    overlay: true
    measure: flow
    plain_level: true
    title: How Many Poverty Lines an Income Covers
    short_title: Incomes vs. poverty line
    description: >-
      The minimum wage, the minimum pension and the average wage (RIPTE)
      as a multiple of the poverty line of a typical household (two adults,
      two children), monthly since 2016.
    source: derived
    source_label: INDEC (canastas básicas); Ministerio de Capital Humano; ANSES; via datos.gob.ar
    frequency: M
    units: Times the household poverty line
    transforms: [level]
    ranges: [5Y, Max]
    ref_line: 1
    note: >-
      Above 1: the income alone covers the basic total basket of a
      household of four in Greater Buenos Aires (INDEC's reference
      household: a man and a woman of 35 and 31, children of 6 and 8).
      Each income is a single person's, gross (RIPTE before deductions),
      while the household may have more earners and receive transfers, so
      this is not a poverty measure. The minimum pension excludes the fixed
      bonus paid on top of it (ARS 70,000 a month since March 2024), which
      matters for this comparison.
    default: {variant: smvm, transform: level, range: Max}
    derive:
      method: formula
      anchor: lp
      vars: {lp: 150.1_LA_POBREZA_0_D_13, w: 57.1_SMVMM_0_M_34, p: 58.1_MP_0_M_24, r: 158.1_REPTE_0_0_5}
      variants:
        smvm:    {label: Minimum wage,     expr: "w / lp"}
        pension: {label: Minimum pension,  expr: "p / lp"}
        ripte:   {label: Average wage (RIPTE), expr: "r / lp"}

  - id: labor_inequality
    topic: labor
    release: distribucion
    kind: variants
    plain_level: true
    measure: flow
    title: Income Inequality
    short_title: Gini
    description: >-
      Gini coefficient of per capita household income (0: everyone has the
      same income; 1: one household has everything), urban areas,
      quarterly since 2003.
    source: datos_gob
    source_label: INDEC (Encuesta Permanente de Hogares), via datos.gob.ar
    frequency: Q
    units: Gini coefficient
    transforms: [level]
    ranges: [10Y, Max]
    bands:
      - {start: "2007-01-01", end: "2015-12-01", key: "INDEC intervention (2007-2015): survey figures to be used with caution"}
    note: >-
      From INDEC's household survey, which under-reports income at the top,
      so the level is understated, as in most surveys. Quarters missing in
      2007-2015 were not published.
    variants:
      gini: {label: Gini (per capita household income), id: 65.1_CGI_0_0_21}
    default: {variant: gini, transform: level, range: Max}

  - id: labor_share
    topic: labor
    release: ingreso_generacion
    kind: contributions
    measure: flow
    title: Labor Share of Income
    short_title: Labor share
    description: >-
      Gross value added split into wages (employee compensation), mixed
      income of the self-employed, and operating surplus, % of GDP at
      factor cost, quarterly since 2016.
    source: derived
    source_label: INDEC (Cuenta generación del ingreso), via datos.gob.ar
    frequency: Q
    units: "% of GDP at factor cost"
    ranges: [Max]
    note: >-
      Mixed income: earnings of the self-employed and unincorporated
      businesses, part labor and part capital income. Operating surplus:
      the return to capital of firms (before interest and taxes on profits).
    contributions:
      precomputed: true
      total: total
      total_label: GDP at factor cost
      units: "%"
      groups:
        - {key: wages,   label: Employee compensation, add: [wages], color: copper}
        - {key: mixed,   label: Mixed income,          add: [mixed], color: gold}
        - {key: surplus, label: Operating surplus,     add: [surplus], color: sky}
    default: {variant: wages, transform: level, range: Max}
    derive:
      method: formula
      anchor: w
      vars: {w: 53.1_TRTA_0_0_37, m: 53.1_TIMB_0_0_25, s: 53.1_EBE_0_0_27}
      variants:
        wages:   {label: Employee compensation, expr: "100 * w"}
        mixed:   {label: Mixed income, expr: "100 * m"}
        surplus: {label: Operating surplus, expr: "100 * s"}
        total:   {label: Total, expr: "100 * (w + m + s)"}

  - id: fiscal_balance
    topic: fiscal
    wide: true
    kind: variants
    switch: {group: balance, label: "% of GDP, last 12 months"}
    overlay: true
    measure: rate
    validate_as: flow
    title: Primary and Financial Balance
    short_title: Fiscal balance
    description: >-
      The national non-financial public sector's balance before interest
      (primary) and after interest (financial), cash basis, as a share of GDP:
      the last twelve months. Monthly, since December 2015.
    source: derived
    source_label: Secretaría de Hacienda (IMIG), via datos.gob.ar; INDEC
    frequency: M
    units: "% of GDP, last 12 months"
    transforms: [level]
    ranges: [5Y, 10Y, Max]
    note: >-
      Sum of the last twelve months of each balance over nominal GDP of the
      same twelve months: quarterly GDP interpolated to months, and carried
      forward with the CPI for months the national accounts have not yet
      covered. Cash basis: interest that is capitalized rather than paid is
      not in the financial balance (see Interest on the Debt, Paid and
      Capitalized). Revenue includes BCRA profit transfers and, in some
      years, income from asset sales and debt operations.
    yearly: {how: december}
    default: {variant: financial, transform: level, range: Max}
    headline: {variant: financial, transform: level, label: "Financial balance", good: up}
    tiles: [{variant: primary, transform: level, label: "Primary balance", good: up}]
    derive:
      method: formula
      anchor: prim
      vars: &fiscal_gdp
        prim: 379.9_SUPERAVIT_017__23_94
        fin: 379.9_RESULTADO_017__18_38
        rev: 379.9_ING_ANTES_017__26_83
        tax: 379.9_ING_CORR_I017__29_10
        spend: 379.9_GTOS_PRIMA017__37_33
        intr: 379.9_GTOS_CORR_017__40_84
        gdp: 4.4_OGP_2004_T_17
        cpi: 148.3_INIVELNAL_DICI_M_26
      variants:
        primary:   {label: Primary balance,   expr: "100 * sum12(prim) / gdp12(gdp, cpi)"}
        financial: {label: Financial balance, expr: "100 * sum12(fin) / gdp12(gdp, cpi)"}

  - id: fiscal_balance_monthly
    topic: fiscal
    kind: variants
    switch: {group: balance, label: "Pesos, monthly"}
    overlay: true
    measure: flow
    title: Monthly Primary and Financial Balance
    short_title: Monthly balance
    description: >-
      The monthly primary and financial balance of the national
      non-financial public sector, cash basis. Can be shown in pesos of the
      latest month.
    source: datos_gob
    source_label: Secretaría de Hacienda (IMIG), via datos.gob.ar
    frequency: M
    units: Millions of pesos
    transforms: [level]
    plain_level: true
    ranges: [2Y, 5Y, 10Y, Max]
    deflate_with: {indicator: cpi_long, variant: corrected, label: CPI}
    note: >-
      Seasonal: June and December carry the half-yearly bonus (aguinaldo) on
      wages and pensions, and some months concentrate tax payments (income
      tax and personal assets in May-June). Compare a month with the same
      month a year earlier, or use the twelve-month ratios to GDP.
    variants:
      primary:   {label: Primary balance,   id: 379.9_SUPERAVIT_017__23_94}
      financial: {label: Financial balance, id: 379.9_RESULTADO_017__18_38}
    yearly: {how: sum}
    default: {variant: primary, transform: level, range: 5Y}

  - id: fiscal_budget
    topic: fiscal
    wide: true
    kind: statement
    measure: flow
    title: The National Budget, Month by Month
    short_title: Budget table
    description: >-
      Revenue, spending and the balance of the national non-financial public
      sector, cash basis, line by line as the Secretaría de Hacienda publishes
      it: a month, the year to date, the last twelve months or a calendar
      year, against the same period a year earlier, in nominal and real
      terms. Millions of pesos.
    source: derived
    source_label: Secretaría de Hacienda (Esquema Ahorro-Inversión-Financiamiento, base caja), via datos.gob.ar; Secretaría de Finanzas; BCRA
    frequency: M
    units: Millions of pesos
    deflate_with: {indicator: cpi_long, variant: corrected, label: CPI}
    note: >-
      The table above the line is as reported, with no accounting
      corrections; the lines below it are the monitor's, each a single,
      visible adjustment rather than one "true" balance. Property income
      includes the returns of the pension fund's assets (FGS); "primary
      balance excluding property income" is Hacienda's own figure. Since
      the 2017 methodology, profits the BCRA transfers to the Treasury are
      recorded as financing, not revenue; the memo line shows them, and the
      next line counts them as revenue, as the accounts did under the
      earlier methodology. Net interest leaves out
      interest paid to other parts of the national public sector (mostly
      the BCRA and the FGS); the memo line shows it. Capitalized interest is
      the monitor's estimate for fixed-rate peso letters and bonds (LECAP,
      BONCAP), which pay interest at maturity and so never appear as
      interest in the cash accounts; from December 2021. Other current
      spending includes small property rents other than interest, which
      Hacienda deducts before the primary balance.
    method_links: [{anchor: capitalized-interest, label: "How capitalized interest is estimated"}]
    statement:
      pct_change: true
      rows:
        - {key: rev, bold: true}
        - {key: tax, indent: 1}
        - {key: ss, indent: 1}
        - {key: ntax, indent: 1}
        - {key: prop, indent: 1}
        - {key: sales, indent: 1}
        - {key: trc, indent: 1}
        - {key: orev, indent: 1}
        - {key: capr, indent: 1}
        - {key: psp, bold: true}
        - {key: cur, indent: 1}
        - {key: pen, indent: 2}
        - {key: tpriv, indent: 2}
        - {key: wag, indent: 2}
        - {key: gs, indent: 2}
        - {key: tprov, indent: 2}
        - {key: tuni, indent: 2}
        - {key: tpub, indent: 2}
        - {key: deps, indent: 2}
        - {key: ocurr, indent: 2}
        - {key: capx, indent: 1}
        - {key: ird, indent: 2}
        - {key: tcprov, indent: 2}
        - {key: tcot, indent: 2}
        - {key: prim, bold: true, rule: true}
        - {key: intn, indent: 1}
        - {key: fin, bold: true, rule: true}
        - {heading: "Adjustments by the monitor (not in the official accounts)", rule: true}
        - {key: psr}
        - {key: bcra}
        - {key: prim_bcra}
        - {key: intra}
        - {key: fin_intra}
        - {key: capi}
        - {key: fin_capi}
    default: {variant: rev}
    derive:
      method: formula
      anchor: rev
      vars:
        rev: "aif:ing_antes_figurativos_2017"
        icor: "aif:ing_corr_2017"
        tax: "aif:ing_corr_ing_tributarios_2017"
        ss: "aif:ing_corr_aportes_contrib_seg_soc_2017"
        ntax: "aif:ing_corr_ing_no_tributarios_2017"
        sales: "aif:ing_corr_ventas_bs_ser_adm_pub_2017"
        oper: "aif:ing_corr_ing_operacion_2017"
        bcra: "aif:ing_corr_ren_prop_ren_percidas_bcra_2017"
        prop: "aif:ing_corr_ren_prop_ren_prop_netas_2017"
        trc: "aif:ing_corr_transf_corr_2017"
        capr: "aif:recursos_cap_total_recursos_cap_2017"
        psp: "aif:gtos_primario_antes_figurativos_2017"
        wag: "aif:gtos_corr_gtos_cons_operacion_remuneraciones_2017"
        gs: "aif:gtos_corr_gtos_cons_operacion_bienes_servicios_2017"
        oop: "aif:gtos_corr_gtos_cons_operacion_ots_gtos_2017"
        pen: "aif:gtos_corr_prestaciones_seg_soc_2017"
        tpriv: "aif:gtos_corr_transf_corr_sec_priv_total_sec_priv_2017"
        tprov: "aif:gtos_corr_transf_corr_sect_pub_caba_total_caba_2017"
        tuni: "aif:gtos_corr_transf_corr_sec_pub_uni_2017"
        tpub: "aif:gtos_corr_transf_corr_sec_pub_ot_2017"
        text: "aif:gtos_corr_transf_corr_sec_ext_2017"
        ocur: "aif:gtos_corr_ots_gtos_corr_2017"
        ocur2: "aif:gtos_corr_ots_gtos_2017"
        deps: "aif:gtos_corr_deficit_operativo_empresas_pub_2017"
        capx: "aif:gtos_cap_2017"
        ird: "aif:gtos_cap_inversion_real_directa_2017"
        tcprov: "aif:gtos_cap_transf_cap_prov_caba_total_prov_caba_2017"
        tcot: "aif:gtos_cap_transf_cap_ot_2017"
        crest: "aif:gtos_cap_resto_2017"
        prim: "aif:superavit_primario_2017"
        intn: "aif:gtos_corr_int_ot_ren_prop_int_netos_2017"
        orent: "aif:gtos_corr_int_ot_ren_prop_ot_ren_2017"
        fin: "aif:resultado_fin_2017"
        psr: "aif:resultados_primarios_sin_rentas"
        intra: "aif:gtos_corr_int_ot_ren_prop_int_pag_intra_stor_pub_2017"
        cap: fin:a1|lecap
        bcap: fin:a1|boncap
        tem: fin:col|tem_fixed
        fx: bcra:5
      variants:
        rev:    {label: Total revenue, expr: "rev"}
        tax:    {label: Tax revenue, expr: "tax"}
        ss:     {label: Social security contributions, expr: "ss"}
        ntax:   {label: Non-tax revenue, expr: "ntax"}
        prop:   {label: "Property income (incl. FGS returns)", expr: "prop"}
        bcra:   {label: "Memo: BCRA profits transferred to the Treasury (recorded as financing)", expr: "bcra"}
        sales:  {label: Sales of goods and services, expr: "sales"}
        trc:    {label: Current transfers received, expr: "trc"}
        orev:   {label: Other current revenue, expr: "icor - tax - ss - ntax - prop - sales - trc - nz(oper)"}
        capr:   {label: Capital revenue, expr: "capr"}
        psp:    {label: Primary spending, expr: "psp + nz(orent)"}
        cur:    {label: Current primary spending, expr: "psp + nz(orent) - capx"}
        pen:    {label: Pensions and social security benefits, expr: "pen"}
        tpriv:  {label: "Transfers to the private sector (subsidies, social programs)", expr: "tpriv"}
        wag:    {label: Wages, expr: "wag"}
        gs:     {label: Goods and services, expr: "gs + nz(oop)"}
        tprov:  {label: Transfers to provinces and CABA, expr: "tprov"}
        tuni:   {label: Transfers to universities, expr: "tuni"}
        tpub:   {label: Other transfers to the public sector, expr: "tpub"}
        deps:   {label: Operating deficit of public enterprises, expr: "deps"}
        ocurr:  {label: Other current spending, expr: "nz(ocur) + nz(ocur2) + nz(text) + nz(orent)"}
        capx:   {label: Capital spending, expr: "capx"}
        ird:    {label: Direct investment (public works), expr: "ird"}
        tcprov: {label: Capital transfers to provinces and CABA, expr: "tcprov"}
        tcot:   {label: Other capital spending, expr: "tcot + nz(crest)"}
        prim:   {label: Primary balance, expr: "prim"}
        intn:   {label: Net interest, expr: "intn"}
        fin:    {label: Financial balance, expr: "fin"}
        psr:    {label: "Primary balance excluding property income (Hacienda)", expr: "psr"}
        prim_bcra: {label: Primary balance counting BCRA profit transfers as revenue, expr: "prim + nz(bcra)"}
        intra:  {label: "Memo: interest paid within the public sector", expr: "intra"}
        fin_intra: {label: Financial balance including interest within the public sector, expr: "fin - nz(intra)"}
        capi:   {label: "Memo: interest capitalized on LECAP and BONCAP (estimate)", expr: "lag((nz(cap) + nz(bcap)) * fx, 1) * nz(tem) / 100"}
        fin_capi: {label: Financial balance including capitalized interest, expr: "fin - lag((nz(cap) + nz(bcap)) * fx, 1) * nz(tem) / 100"}

  - id: fiscal_revenue_spending
    topic: fiscal
    kind: variants
    line_styles:
      revenue:  {slot: 0, width: 3.2}
      tax:      {slot: 0, dash: dot}
      spending: {slot: 1, dash: dash}
      total:    {slot: 1, width: 3.2}
    tiles:
      - {variant: revenue, transform: level, label: "Revenue", good: none}
      - {variant: spending, transform: level, label: "Primary spending", good: none}
    overlay: true
    measure: rate
    validate_as: flow
    title: Revenue and Spending
    short_title: Revenue and spending
    description: >-
      Total revenue, tax revenue, primary spending and total spending
      (primary plus interest), as a share of GDP: the last twelve months.
    source: derived
    source_label: Secretaría de Hacienda (IMIG), via datos.gob.ar; INDEC
    frequency: M
    units: "% of GDP, last 12 months"
    transforms: [level]
    ranges: [5Y, 10Y, Max]
    note: >-
      National non-financial public sector, cash basis. Tax revenue is the
      national share, after automatic transfers to the provinces
      (coparticipación).
    yearly: {how: december}
    default: {variant: revenue, transform: level, range: Max}
    derive:
      method: formula
      anchor: rev
      vars: *fiscal_gdp
      variants:
        revenue:  {label: Total revenue,    expr: "100 * sum12(rev) / gdp12(gdp, cpi)"}
        tax:      {label: Tax revenue,      expr: "100 * sum12(tax) / gdp12(gdp, cpi)"}
        spending: {label: Primary spending, expr: "100 * sum12(spend) / gdp12(gdp, cpi)"}
        total:    {label: Total spending,   expr: "100 * (sum12(spend) + sum12(intr)) / gdp12(gdp, cpi)"}

  - id: fiscal_spending_contrib
    topic: fiscal
    wide: true
    kind: contributions
    measure: flow
    title: What Drives Primary Spending
    short_title: Spending by item
    description: >-
      Change in real primary spending from the same month a year earlier, and
      the contribution of each item, in percentage points. Monthly.
    source: derived
    source_label: Secretaría de Hacienda (IMIG), via datos.gob.ar; INDEC
    frequency: M
    units: Percentage points
    ranges: [2Y, 5Y, Max]
    note: >-
      Each item deflated by the CPI (national, INDEC). Contribution of an
      item: its real change over total primary spending a year earlier, so
      the bars add up to the change in total. Provinces: current and capital
      transfers. Capital spending excludes capital transfers to provinces.
      Other: goods and services, transfers to universities and public
      companies, and the rest.
    contributions:
      precomputed: true
      total: total
      total_label: Real primary spending, y/y %
      units: pp
      groups:
        - {key: pensions,  label: Pensions and social security, add: [pensions],  color: copper}
        - {key: private,   label: Transfers to households and firms, add: [private], color: sky}
        - {key: wages,     label: Wages,                        add: [wages],     color: sage}
        - {key: provinces, label: Transfers to provinces,       add: [provinces], color: lavender}
        - {key: capital,   label: Capital spending,             add: [capital],   color: gold}
        - {key: other,     label: Other,                        add: [other],     color: neutral}
    yearly: {how: december, suffix: _12m, total_label: "Real primary spending, change vs. previous year, %"}
    default: {variant: total, transform: level, range: 5Y}
    derive:
      method: formula
      anchor: tot
      start: "2017-12-01"
      vars:
        tot: 379.9_GTOS_PRIMA017__37_33
        pen: 379.9_GTOS_CORR_017__35_92
        wag: 379.9_GTOS_CORR_017__49_26
        prv: 379.9_GTOS_CORR_017_3_0_M_50_79
        pcur: 379.9_GTOS_CORR_017_5_0_M_51_42
        pcap: 379.9_GTOS_CAP_T017__50_91
        cap: 379.9_GTOS_CAP_2017__13_60
        cpi: 148.3_INIVELNAL_DICI_M_26
      variants:
        total:     {label: Total,      expr: "100 * (tot * lag(cpi, 12) / cpi - lag(tot, 12)) / lag(tot, 12)"}
        pensions:  {label: Pensions,   expr: "100 * (pen * lag(cpi, 12) / cpi - lag(pen, 12)) / lag(tot, 12)"}
        private:   {label: Transfers to households and firms, expr: "100 * (prv * lag(cpi, 12) / cpi - lag(prv, 12)) / lag(tot, 12)"}
        wages:     {label: Wages,      expr: "100 * (wag * lag(cpi, 12) / cpi - lag(wag, 12)) / lag(tot, 12)"}
        provinces: {label: Provinces,  expr: "100 * ((pcur + pcap) * lag(cpi, 12) / cpi - (lag(pcur, 12) + lag(pcap, 12))) / lag(tot, 12)"}
        capital:   {label: Capital,    expr: "100 * ((cap - pcap) * lag(cpi, 12) / cpi - (lag(cap, 12) - lag(pcap, 12))) / lag(tot, 12)"}
        other:     {label: Other,      expr: "100 * ((tot - pen - prv - wag - pcur - cap) * lag(cpi, 12) / cpi - (lag(tot, 12) - lag(pen, 12) - lag(prv, 12) - lag(wag, 12) - lag(pcur, 12) - lag(cap, 12))) / lag(tot, 12)"}
        # Twelve-month versions (real sums of the last twelve months vs. the twelve before), for the yearly view.
        total_12m:     {label: Total (12 months),     expr: "100 * (sum12((tot) / cpi) / lag(sum12((tot) / cpi), 12) - 1)"}
        pensions_12m:  {label: Pensions (12 months),  expr: "100 * (sum12((pen) / cpi) - lag(sum12((pen) / cpi), 12)) / lag(sum12((tot) / cpi), 12)"}
        private_12m:   {label: Households and firms (12 months), expr: "100 * (sum12((prv) / cpi) - lag(sum12((prv) / cpi), 12)) / lag(sum12((tot) / cpi), 12)"}
        wages_12m:     {label: Wages (12 months),     expr: "100 * (sum12((wag) / cpi) - lag(sum12((wag) / cpi), 12)) / lag(sum12((tot) / cpi), 12)"}
        provinces_12m: {label: Provinces (12 months), expr: "100 * (sum12((pcur + pcap) / cpi) - lag(sum12((pcur + pcap) / cpi), 12)) / lag(sum12((tot) / cpi), 12)"}
        capital_12m:   {label: Capital (12 months),   expr: "100 * (sum12((cap - pcap) / cpi) - lag(sum12((cap - pcap) / cpi), 12)) / lag(sum12((tot) / cpi), 12)"}
        other_12m:     {label: Other (12 months),     expr: "100 * (sum12((tot - pen - prv - wag - pcur - cap) / cpi) - lag(sum12((tot - pen - prv - wag - pcur - cap) / cpi), 12)) / lag(sum12((tot) / cpi), 12)"}

  - id: fiscal_revenue_contrib
    topic: fiscal
    wide: true
    kind: contributions
    measure: flow
    title: What Drives Revenue
    short_title: Revenue by tax
    description: >-
      Change in real total revenue from the same month a year earlier, and
      the contribution of each tax, in percentage points. Monthly.
    source: derived
    source_label: Secretaría de Hacienda (IMIG), via datos.gob.ar; INDEC
    frequency: M
    units: Percentage points
    ranges: [2Y, 5Y, Max]
    note: >-
      National non-financial public sector, cash basis: the national share of
      each tax, after automatic transfers to the provinces. Each item
      deflated by the CPI (national, INDEC); contribution of an item: its
      real change over total revenue a year earlier, so the bars add up to
      the change in total. Other taxes: import duties, fuel, excise, personal
      assets and the rest, including the PAIS tax on foreign-currency
      purchases (December 2019 - December 2024). Non-tax and capital revenue
      is the residual of total revenue: property income (including BCRA
      profit transfers and the pension fund's income), fees and capital
      revenue.
    contributions:
      precomputed: true
      total: total
      total_label: Real total revenue, y/y %
