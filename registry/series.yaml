  - id: inflation_measures
    topic: prices
    release: pib
    kind: variants
    overlay: true
    measure: rate
    validate_as: flow
    plain_level: true
    title: Three Measures of Inflation
    short_title: Inflation measures
    description: >-
      Inflation over four quarters in three price indices: consumer prices
      (CPI), wholesale prices (IPIM) and the GDP deflator, which covers
      everything produced in the country. Quarterly averages.
    source: derived
    source_label: INDEC, via datos.gob.ar
    frequency: Q
    units: "% vs. the same quarter a year earlier"
    transforms: [level]
    ranges: [10Y, Max]
    note: >-
      The GDP deflator is nominal over real GDP; it includes investment
      goods and exports and leaves out imports, so it can move apart from
      the CPI when the exchange rate or the terms of trade move. It is the
      same series as the GDP deflator in National accounts.
    default: {variant: cpi, transform: level, range: 10Y}
    derive:
      method: formula
      anchor: d
      vars: {c: 148.3_INIVELNAL_DICI_M_26, w: 448.1_NIVEL_GENERAL_0_0_13_46, d: 25.2_OGP_2004_T_17}
      vars_how: {c: mean, w: mean}
      variants:
        cpi:      {label: "Consumer prices (CPI)", expr: "100 * (c / lag(c, 4) - 1)"}
        ipim:     {label: "Wholesale prices (IPIM)", expr: "100 * (w / lag(w, 4) - 1)"}
        deflator: {label: "GDP deflator", expr: "100 * (d / lag(d, 4) - 1)"}
