      interest and remuneration of bank accounts, quasi-currencies and other.
    contributions:
      precomputed: true
      total: total
      total_label: Change in base money
      units: pp
      groups:
        - {key: fx,       label: FX purchases from the private sector, add: [fx],       color: copper}
        - {key: treasury, label: Treasury,                              add: [treasury], color: sky}
        - {key: steril,   label: Sterilization (repos and BCRA notes),  add: [steril],   color: sage}
        - {key: other,    label: Other,                                 add: [other],    color: neutral}
    default: {variant: total, transform: level, start: "2022-01"}
    derive:
      method: flows
      stock: "bcra:15"
      variants:
        total:    {label: Total,        sum_of: ["bcra:46"]}
        fx:       {label: FX purchases, sum_of: ["bcra:47"]}
        treasury: {label: Treasury,     sum_of: ["bcra:48", "bcra:49", "bcra:50", "bcra:51"]}
        steril:   {label: Sterilization, sum_of: ["bcra:52", "bcra:53", "bcra:56", "bcra:58"]}
        other:    {label: Other,        sum_of: ["bcra:54", "bcra:55", "bcra:57", "bcra:59"]}

