  - {id: china_swap_cny, source: manual, frequency: D, measure: flow, static: true, allow_gaps: true, label: "China swap booked in reserves (CNY bn)"}
  - {id: bcra_fx_repos, source: manual, frequency: D, measure: flow, static: true, allow_gaps: true, label: "BCRA repos with foreign banks (USD m)"}
  - {id: "bcra_fx_repos#short_usd_m", source: manual, frequency: D, measure: flow, static: true, allow_gaps: true, label: "BCRA repos with foreign banks, original maturity up to one year (USD m)"}
  - {id: imf_purchases, source: manual, frequency: D, measure: flow, static: true, allow_gaps: true, label: "IMF purchases and repurchases since April 2025 (USD m)"}
  - {id: "bcra:29",  source: bcra, frequency: M, measure: flow, allow_gaps: true, label: "REM: median expected inflation, next 12 months"}
